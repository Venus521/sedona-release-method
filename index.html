/* ── 自定义色盘引擎：17 个变量逐块可调，存本机（release-look-custom-v1） ── */
const CUSTOM_KEY = "release-look-custom-v1";
const CUSTOM_VARS = ["bg","bg2","card","card2","ink","muted","line","accent","accent-ink","accent-soft","accent-line","btn","btn-line","btn-ink","warn","good","danger"];
function hexRGB(h){ h = String(h||"").replace("#",""); if(h.length===3) h = h.split("").map(c=>c+c).join(""); if(!/^[0-9a-fA-F]{6}$/.test(h)) return [128,128,128]; return [0,1,2].map(i=>parseInt(h.slice(i*2,i*2+2),16)); }
function rgbHex(r,g,b){ return "#"+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join(""); }
function relLum(h){ const c = hexRGB(h).map(v=>{ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
function ratioHex(a,b){ const x=relLum(a), y=relLum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
function mixToward(h,t,f){ const c=hexRGB(h); return rgbHex(c[0]+(t[0]-c[0])*f, c[1]+(t[1]-c[1])*f, c[2]+(t[2]-c[2])*f); }
function customVars(){ try{ const o = JSON.parse(localStorage.getItem(CUSTOM_KEY)||"null"); return (o && typeof o==="object") ? o : null; }catch(e){ return null; } }
function saveCustom(v){ if(storageOk){ try{ localStorage.setItem(CUSTOM_KEY, JSON.stringify(v)); }catch(e){} } markLookChanged(); }

/* ── 外观跨端同步：电脑/手机配色保持一致 ──
   本机任何外观改动 → rf_look_meta 记时间戳 + 借收获本的自动上传通道上云；
   另一端开机合并时发现云端更新 → release-sync 回调 __atLook 热应用（不刷新、不再上传，无回环）。 */
var LOOK_APPLIED_KEY = "rf_look_applied_at";
function markLookChanged(){
  if(storageOk){
    try{
      var at = new Date().toISOString();
      localStorage.setItem("rf_look_meta", JSON.stringify({at:at}));

  }

}

function isCustom(){ return document.documentElement.dataset.theme==="custom"; }
function clearCustomVars(){ const root=document.documentElement; CUSTOM_VARS.forEach(k=>root.style.removeProperty("--"+k)); root.classList.remove("cs-dark"); }
function applyCustom(v){
  const root = document.documentElement;
  root.dataset.theme = "custom";
  CUSTOM_VARS.forEach(k=>{ if(v && v[k]) root.style.setProperty("--"+k, v[k]); });
  root.classList.toggle("cs-dark", relLum(v && v.bg || "#ffffff") < 0.45);
  paintThemeColor();
}
/* 从指定预设（或当前主题）读一份 17 值快照，作自定义的起点 */
function snapshotTheme(fromId){
  const root = document.documentElement;
  const wasCustom = isCustom();
  const target = (fromId && LOOKS.some(l=>l.id===fromId)) ? fromId : (wasCustom ? null : (LOOKS.some(l=>l.id===root.dataset.theme) ? root.dataset.theme : "paper"));
  if(wasCustom && !fromId){
    const o = {}; CUSTOM_VARS.forEach(k=>{ o[k] = root.style.getPropertyValue("--"+k).trim() || getComputedStyle(root).getPropertyValue("--"+k).trim(); }); return o;
  }
  const hadInline = CUSTOM_VARS.map(k=>[k, root.style.getPropertyValue("--"+k)]);
  CUSTOM_VARS.forEach(k=>root.style.removeProperty("--"+k));
  const prevTheme = root.dataset.theme;
  root.dataset.theme = target; root.classList.remove("cs-dark");
  const cs = getComputedStyle(root); const o = {};
  CUSTOM_VARS.forEach(k=>{ o[k] = cs.getPropertyValue("--"+k).trim(); });
  root.dataset.theme = wasCustom ? "custom" : prevTheme;
  hadInline.forEach(([k,v])=>{ if(v) root.style.setProperty("--"+k, v); });
  return o;
}
/* 换肤后同步顶栏那行 theme-color。<head> 的开场脚本里还有一份同样的三分支判断
   （纸/雾/墨），那是防深色用户首屏闪白用的，必须在 body 渲染前跑；改动 LOOKS 时两处都要动。 */
function paintThemeColor(){
  const m = document.querySelector('meta[name="theme-color"]');
  let cur;
  if(isCustom()){
    cur = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#e9e2d3";
  }else{
    cur = (LOOKS.find(l=>l.id===document.documentElement.dataset.theme) || LOOKS[0]).bg;

  if(m) m.setAttribute("content", cur);
}

  const box = document.getElementById("cpanel");
  if(!box) return;
  if(!isCustom()){ box.innerHTML = ""; box.classList.add("hidden"); return; }
  /* 内容照常渲染；开合由 togglePanel 管（点「自定义」卡展开），刷新后不自动弹出 */
  const v = customVars() || {};

    + '<button class="chip" id="cp-reset">删掉自定义</button></div>';
  CP_GROUPS.forEach(g=>{

    g[1].forEach(it=>{

  box.querySelectorAll("[data-cpfrom]").forEach(b=>{
    b.onclick = ()=>{ const vv = snapshotTheme(b.dataset.cpfrom); saveCustom(vv); applyCustom(vv); renderColorPanel(); renderLooks(); };
  });
  box.querySelector("#cp-reset").onclick = ()=>{
    if(storageOk){ try{ localStorage.removeItem(CUSTOM_KEY); localStorage.removeItem(LS_LOOK); }catch(e){} }
    markLookChanged();
    applyTheme(systemTheme());

    toast(tx("已删掉自定义，回到跟随系统"));
  };
  box.querySelector("#cp-x").onclick = ()=>closeLayers();

function curVar(k){
  const inline = document.documentElement.style.getPropertyValue("--"+k).trim();
  return inline || getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim();
}
function updateRatios(){
  const box = document.getElementById("cpanel");
  if(!box || !isCustom()) return;
  box.querySelectorAll(".cp-item").forEach(it=>{
    const k = it.dataset.cpk;
    const pairs = CP_PAIRS.filter(p=>p[0]===k);
    const ratioEl = it.querySelector(".cp-ratio");
    if(!pairs.length){ ratioEl.textContent = ""; ratioEl.classList.remove("cp-warn"); return; }
    let worst = 99, worstBg = "#ffffff";
    pairs.forEach(p=>{ const r = ratioHex(curVar(p[0]), curVar(p[1])); if(r < worst){ worst = r; worstBg = curVar(p[1]); } });
    ratioEl.textContent = worst.toFixed(1);
    ratioEl.classList.toggle("cp-warn", worst < 4.5);
    let fix = it.querySelector(".cp-fix");
    if(worst < 4.5){
      if(!fix){
        fix = document.createElement("button");
        fix.className = "cp-fix"; fix.type = "button"; fix.textContent = "加深修正";
        fix.title = "把这个颜色往远离底色的方向推，直到对比度够 4.5";
        fix.onclick = ()=>{
          const vv = customVars() || {};
          const bgs = pairs.map(p=>curVar(p[1]));
          let c = curVar(k);
          for(let i=0; i<12; i++){
            const w = Math.min.apply(null, bgs.map(b=>ratioHex(c, b)));
            if(w >= 4.5) break;
            c = mixToward(c, relLum(c) >= Math.max.apply(null, bgs.map(b=>relLum(b))) ? [255,255,255] : [0,0,0], 0.12);
          }
          vv[k] = c; saveCustom(vv); applyCustom(vv); renderColorPanel(); renderLooks();
        };
        it.appendChild(fix);
      }
    }else if(fix) fix.remove();
  });
}

function newState(){ return {level:"", emoLevel:"", goal:"", emotion:"", want:"", rounds:0, also:[], reread:false, path:[]}; }
let state = newState();
let cursor = "level";

const LS_RUN = "release-run-v1";
const WS_RUN_KEY = "release-ws-run-v1";
let run = {live:false, elapsed:0, activeFrom:null, startedAt:null};

/* ── 走链的引擎同一时刻只服务一档 ──
   引导自己那一档（slot="guide"），或工作本某个条目那一档（slot="ws:<条目id>"）。
   换档时把手上的 state/cursor/run 收进槽，再把目标槽里那一档取出来放回全局——
   jump／back／计时／键盘／浮层出口这些一律不用改第二遍，工作本走的就是引导那条链。
   引导档仍写 release-run-v1（走查与断点续走认这个键），工作本各档写 release-ws-run-v1。 */
const SLOTS = {};
let slot = "guide";
function wsSlotId(){ return slot.indexOf("ws:")===0 ? slot.slice(3) : null; }
function newNonce(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
/* 引擎的落点：引导档写主舞台，工作本档写工作本里那一块——同一条链，两个宿主 */
function stageEl(){ return document.getElementById(wsSlotId() ? "ws-stage" : "stage"); }
function railEl(){ return document.getElementById(wsSlotId() ? "ws-rail" : "rail"); }
function stageSel(){ return wsSlotId() ? "#ws-stage" : "#stage"; }
function blankRun(){ return {live:false, elapsed:0, activeFrom:null, startedAt:null}; }
function takeSlot(name){
  if(name === slot) return;
  SLOTS[slot] = {state:state, cursor:cursor, run:run};
  slot = name;
  const s = SLOTS[name];
  if(s && s.state){ state = s.state; cursor = s.cursor || "level"; run = s.run || blankRun(); }
  else { state = newState(); cursor = "level"; run = blankRun(); }
  state.reread = false;
  saveRun();
}
function slotSuspend(){
  if(wsOpen !== null){ wsOpen = null; if(wsEdit !== null) wsEdit = null; }
  takeSlot("guide");
}
function wsSaveSlots(){
  if(!storageOk) return;
  const map = {};
  Object.keys(SLOTS).forEach(k=>{ if(k.indexOf("ws:")===0) map[k.slice(3)] = SLOTS[k]; });
  try{ localStorage.setItem(WS_RUN_KEY, JSON.stringify(map)); }catch(e){}
}
function wsLoadSlots(){
  if(!storageOk) return;
  let p = null;
  try{ p = JSON.parse(localStorage.getItem(WS_RUN_KEY)||"{}"); }catch(e){ return; }
  if(!p || typeof p !== "object") return;
  Object.keys(p).forEach(id=>{
    const r = p[id];
    if(r && r.state && FLOW_INDEX[r.cursor||"level"] !== undefined){
      SLOTS["ws:"+id] = {state:r.state, cursor:r.cursor||"level", run:r.run||blankRun()};
    }
  });
}

function fmtDur(s){ return pad(Math.floor(s/60))+":"+pad(s%60); }
function runSecs(){
  const ms = run.elapsed + (run.live && run.activeFrom!==null ? Date.now()-run.activeFrom : 0);
  return Math.floor(ms/1000);
}
function runStart(){
  if(run.live) return;
  run.live = true;
  if(run.startedAt===null) run.startedAt = Date.now();
  run.activeFrom = document.hidden ? null : Date.now();
  saveRun(); refreshRail();
}
function runPause(){
  if(run.activeFrom!==null){ run.elapsed += Date.now()-run.activeFrom; run.activeFrom = null; saveRun(); refreshRail(); }
}
function runResume(){
  if(run.live && run.activeFrom===null && !document.hidden) run.activeFrom = Date.now();
}
function runFreeze(){
  if(run.activeFrom!==null){ run.elapsed += Date.now()-run.activeFrom; run.activeFrom = null; }
  run.live = false;
  saveRun(); refreshRail();
}
function runClear(){
  run = {live:false, elapsed:0, activeFrom:null, startedAt:null};
  saveRun();
}
function clockTitle(){ return "只算这一页待在前台的时间，切走和关掉都不计"; }
function startText(){
  if(!run.startedAt) return "";
  const d = new Date(run.startedAt);
  return pad(d.getHours())+":"+pad(d.getMinutes());
}
function clockHtml(){
  if(!run.live && run.elapsed<=0) return "";
  const st = startText();
  return '<span class="clock'+(run.live?" live":"")+'" id="clock" title="'+clockTitle()+'">'
    + (st ? '始 <b>'+st+'</b> · ' : '') + '用时 <b>'+fmtDur(runSecs())+'</b></span>';
}
function paintClock(){
  const c = document.getElementById("clock");
  if(!c) return;
  const st = startText();
  c.innerHTML = (st ? '始 <b>'+st+'</b> · ' : '') + '用时 <b>'+fmtDur(runSecs())+'</b>';
  c.classList.toggle("live", run.live);
  c.title = clockTitle();
}
function tickClock(){ paintClock(); }
function saveRun(){
  if(!storageOk) return;
  if(wsSlotId()){ wsSaveSlots(); return; }   /* 工作本那一档不占引导的断点存档 */
  try{ localStorage.setItem(LS_RUN, JSON.stringify({state:state, cursor:cursor, run:run})); }catch(e){}
}
function loadRun(){
  if(!storageOk) return;
  try{
    const raw = localStorage.getItem(LS_RUN);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(!p || FLOW_INDEX[p.cursor]===undefined || !p.state) return;   /* 下标 0 是 falsy：原先写成 !FLOW_INDEX[p.cursor]，停在第一步刷新的人整档被静默丢掉 */
    state = Object.assign(newState(), p.state);
    if(!Array.isArray(state.also)) state.also = [];
    /* level 只在「有值但非法」时兜底。空串是「还没选过起手」，必须留白：
       原先这条把空串也兜成老手 —— 停在第一步刷新的人会被静默判成「从想要开始」。 */
    if(state.level!=="" && state.level!=="新手" && state.level!=="老手") state.level = "老手";
    state.reread = false;
    if(p.cursor==="emotion"){ state.emotion=""; state.emoLevel=""; }   /* 重开页面正停在认出步：存过的选择已算旧答案，不亮 */
    cursor = p.cursor;
    /* 走到后面某步而 level 仍是空的（脏存档）：退回起手让本人再选一次，不替他选 */
    if(state.level==="" && cursor!=="level") cursor = "level";
    const r = p.run || {};
    run = {live:!!r.live, elapsed:Number(r.elapsed)||0, activeFrom:null, startedAt:r.startedAt||null};
    runResume();
  }catch(e){}
}
setInterval(tickClock, 1000);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) runPause(); else runResume(); });
window.addEventListener("pagehide", runPause);

function setPane(name){
  let resumed = false;
  if(wsSlotId() && (name==="guide" || name==="harvest")){ takeSlot("guide"); resumed = true; }   /* 离工作本那一屏：把手上的档收回槽里，进度不丢 */
  ["guide","lesson","sheets","harvest"].forEach(p=>{
    document.getElementById("pane-"+p).classList.toggle("hidden", p!==name);

  document.getElementById("rail").innerHTML = name==="guide" ? railHtml() : "";
  if(name==="lesson") renderLesson8();

function railHtml(){
  /* 2026-10-14：这颗钮原来挂一长串「感受层用九大情绪表、多一步「允许」；想要层起手就在
     N颗想要上认一格」——界面替她盘算流程的话，本轮一并撤，只留「换一格起点」。 */

      + (state.level==="老手" ? esc(tx("从三大想要开始")) : esc(tx("从九大情绪开始")))+'</button>' : '';
  const chain = FLOW;
  const i = Math.max(0, chain.findIndex(s=>s.id===cursor));
  const count = '<span class="rail-count" title="'+clockTitle()+'"><b>'+(i+1)+'</b>/'+chain.length
    + pick(' · 复查 ',' · reviewed ')+'<b>'+state.rounds+'</b>'+pick(' 轮',' rounds')+'</span>';
  const stuck = '<button class="g-stuck" id="stuckbtn" type="button" title="'+esc(tx("卡住、越放越崩、情绪说不出——点这里"))+'">'+esc(tx("卡住了"))+'</button>';
  /* 目标句也是 rail-bar 里的一颗钮：抬头就一行，长了自动缩，点＝再念一遍 */
  const line = (!state.goal || cursor==="goal") ? ""
    : '<button class="g-line'+(state.reread?" on":"")+'" id="reread" type="button" aria-pressed="'+(state.reread?"true":"false")+'" title="'+esc(state.goal)+'">'
      + esc(state.goal)+'</button>';
  /* 用时不占位：完整用时收账时看得到，悬停计数也有（2026-10-08 顶栏一行取舍） */

function wireRail(){
  const b = document.getElementById("reread");
  if(b) b.onclick = ()=>{ state.reread = !state.reread; render(); };
  const s = document.getElementById("lvsw");

      jump("drop");
      toast(pick("跳过了「允许」这一步", "The “allow” step is skipped"));
      return;
    }
    saveRun(); render();
    toast(state.level==="新手" ? tx("从九大情绪开始") : tx("从三大想要开始"));
  };
  const sb = document.getElementById("stuckbtn");
  if(sb) sb.onclick = ()=>togglePanel("stuck-panel", renderStuckPanel);
}
/* 全局浮层互斥开关：卡住了面板 / 自定义色盘 / 外观，开一个关另一个 */
const LAYERS = ["stuck-panel","cpanel","look-panel","fb-panel"];

/* 底幕只认一件事：现在还有没有浮层开着。每张浮层自己那颗「收起」钮走的是
   el.classList.add("hidden")，路径各不相同，与其四处各收一遍，不如让遮罩
   自己在关掉一张之后看一眼 LAYERS —— 全关了就摘掉。
   MutationObserver 挂在 LAYERS 上，不依赖调用方记得通知。 */
function syncScrim(){
  const scrim = document.getElementById("scrim");
  if(!scrim) return;
  const anyOpen = LAYERS.some(x=>{
    const e = document.getElementById(x);
    return e && !e.classList.contains("hidden");
  });
  scrim.classList.toggle("on", anyOpen);
  /* opacity 直写，不交给 transition —— 系统开「减少动效」时 transition 被关，
     靠过渡就会停在旧值（遮罩该盖不盖 / 该撤不撤）。 */
  scrim.style.opacity = anyOpen ? "1" : "0";
  scrim.style.pointerEvents = anyOpen ? "auto" : "none";
}
(function watchLayers(){
  if(typeof MutationObserver === "undefined") return;
  const ob = new MutationObserver(syncScrim);
  LAYERS.forEach(x=>{
    const e = document.getElementById(x);
    if(e) ob.observe(e, {attributes:true, attributeFilter:["class"]});
  });
  const scrim = document.getElementById("scrim");
  /* 点底幕＝收起当前开着那张 */
  if(scrim) scrim.onclick = ()=>{ closeLayers(); };
})();
function togglePanel(id, renderFn){
  const el = document.getElementById(id);
  const willOpen = el.classList.contains("hidden");
  LAYERS.forEach(x=>{
    const e = document.getElementById(x);
    if(e) e.classList.toggle("hidden", !(x===id && willOpen));
  });
  /* 底幕交给 syncScrim（MutationObserver 盯着六张层），这里不重复切 */
  /* 入口钮的「已展开」跟着层走：开别层把抽屉顶掉时，这颗不许还亮着 */
  [["look-panel","look-open"],["fb-panel","fb-open"]].forEach(pr=>{
    const p = document.getElementById(pr[0]), o = document.getElementById(pr[1]);
    if(p && o) o.setAttribute("aria-expanded", p.classList.contains("hidden") ? "false" : "true");
  });
  if(willOpen && renderFn) renderFn();
}
/* 浮层的总出口：每张浮层自己带一颗钮，一键关干净（10-05 报「自定义之后无法退出」） */
function closeLayers(){
  let any = false;
  LAYERS.forEach(x=>{
    const e = document.getElementById(x);
    if(e && !e.classList.contains("hidden")){ e.classList.add("hidden"); any = true; }
  });
  if(any){ renderLooks(); }
  return any;
}
/* 壳有没有接返回手势：旧壳没这条方法，按返回＝直接退出到桌面。
   页面自己判不了系统手势，只能问壳要一个凭据；没有就提示更新一次。 */
function shellBackOk(){
  try{ return !!(window.AndroidShell && window.AndroidShell.backHandled && window.AndroidShell.backHandled()); }
  catch(e){ return false; }
}
function lkWarnHtml(){
  if(!window.AndroidShell || shellBackOk()) return "";
  return '<span class="lk-warn">更新一次 App 才有：导出直接落盘、返回一层层关</span>'
    + '<button class="mini" id="lk-upd" type="button">更新</button>';
}
/* 释放屏全表层的出口（2026-10-13 E1）：这一层不进 LAYERS——它自带薄雾罩
   （.18，问句在层上方仍读得清），与六张层共用的深底幕不是一回事。
   所以返回手势和 Esc 都先问它，再问 closeLayers。层开着时删/清空走重渲，
   出口钮「完成」与点雾罩在渲染处绑定（见 renderLesson8 里 #l8-sheet-x）。 */
function l8SheetIsOpen(){
  const pane = document.getElementById("pane-lesson");
  if(pane && pane.classList.contains("hidden")) return false;
  return !!document.getElementById("l8-sheet");
}
function l8SheetHide(){

  renderLesson8();
  return true;
}
/* 手机的返回手势/返回键先问这里：有关得上的层就关它并回 closed；
   一层都没有才回 none，让壳把人交回桌面。单页 App 不许拿网页历史当后退。 */
window.__back = function(){
  if(l8SheetHide()) return "closed";
  if(closeLayers()) return "closed";
  if(wsOpen !== null){ wsClose(); renderSheetsPane(); return "closed"; }
  return "none";
};
document.addEventListener("keydown", e=>{
  if(e.key !== "Escape") return;
  if(wsOpen !== null) return;
  const t = e.target;
  if(t && (t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && t.type !== "color"))) return;
  if(l8SheetHide()){ e.preventDefault(); return; }

});
function refreshRail(){
  if(!wsSlotId() && document.getElementById("pane-guide").classList.contains("hidden")) return;
  const rail = railEl();
  if(!rail) return;
  rail.innerHTML = railHtml();
  wireRail();
}

function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function jump(id, opt){
  if(id === "done"){ endRun(); return; }   /* 「好点了」＝最后一答，收工不留下一格 */
  { const stq = FLOW[FLOW_INDEX[id]];   /* 退场格的入口顺到下一颗参与的格 */
    if(stq && stq.step && !runStepOn(stq.step)) id = (STEP_SKIP[stq.step] || id); }
  if(opt && opt.set) Object.assign(state, opt.set);
  if(opt && opt.round){ state.rounds++; }
  if(id==="emotion"){ state.emotion=""; state.emoLevel=""; state.want=""; }
  if(id==="want"||id==="grabwant"){ state.want=""; }   /* 每次进入「认出感受/想要」都是新的一认：不带上一轮的高亮 */
  state.path.push({id:cursor, rounds:state.rounds});
  cursor = id;
  runStart(); saveRun();
  render();
}
function back(){
  const prev = state.path.pop();
  if(!prev) return;
  if(typeof prev === "string"){ cursor = prev; saveRun(); render(); return; }
  state.rounds = prev.rounds;
  cursor = prev.id; saveRun(); render();
}
function restart(){
  state = newState();
  cursor = "level";
  runClear();
  render();
}

/* 走完最后一答「好点了」：不再有「心智安静」和「收账」两格。
   工作本那一档当场把这一笔记在条目上；引导那一档**不再把人拽去「收获本」填表**——
   喜欢连着放几轮的人，每放一轮就被拽去写一次收获，第三轮就不想放了。
   现在改成：不跳页、不展开表单、不弹 toast，用时／轮数／目标句／想要／情绪先挂成待记（pendingRun）。
   2026-10-12：用户定规「所有的释放都不要主动提醒用户释放完，除非用户主动结束」——
   起手屏那行「上一遍走完了 · 记这一遍」的轻入口也一并撤掉，待记的手只留给用户自己伸：
   随时点「收获本」，那张写字屏顶上挂着这一笔的门票；走下一轮时上一轮自动落进时间流，不打断也不丢数。 */
function endRun(){
  runFreeze();
  const now = new Date();
  const rec = {goal: state.goal || "", emo: (state.emotion || "").trim(), want: state.want || "",
    rounds: state.rounds, secs: runSecs(), start: startText(),
    date: String(now.getFullYear()).slice(2)+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate()),
    ts: now.toISOString()};
  const wk = wsSlotId();
  if(wk){
    const it = wsById(wsOpen);
    if(!it){ slotSuspend(); renderSheetsPane(); return; }
    if(!Array.isArray(it.runs)) it.runs = [];
    it.runs.push(Object.assign({t:Date.now(), iso:rec.ts}, rec));
    it.emo = rec.emo;
    if(rec.want) it.want = rec.want;
    it.updatedAt = rec.ts;
    saveSheets();
    wsEndRun(wk);
    pendingRun = rec;
    renderSheetsPane();
    return;
  }
  /* 上一遍还挂着没记的，先替它落进「收获本」（那本来就是一次完整的放），
     本轮接上去当新的待记。这样连着放五轮，五轮都在，只是不再逼你当场停下来写。 */
  if(pendingRun) addHarvest(pendToRow(pendingRun));
  pendingRun = rec;
  state = newState(); cursor = "level"; runClear(); saveRun(); render();
}


function render(){
  const st = FLOW[FLOW_INDEX[cursor]];
  const stage = stageEl();
  const backBtn = document.getElementById("back");
  if(backBtn) backBtn.disabled = state.path.length===0;   // 第一步没有上一页，置灰防误点
  const wp = document.getElementById("ws-prev");
  if(wp) wp.disabled = state.path.length===0;
  railEl().innerHTML = railHtml();
  wireRail();

  if(state.reread && state.goal){
    stage.innerHTML = '<div class="kind">'+esc(tx("目标句 · 再念一遍"))+'</div><h2 class="q">'+esc(state.goal)+'</h2>'
      + '<p class="hint">'+esc(tx("站在终点把它念完。念完回到刚才那一步，步数和轮数都不动。"))+'</p>'
      + '<div class="opts"><button class="opt prime" id="rereadback">'+esc(tx("念完了，回去"))+'</button></div>';
    document.getElementById("rereadback").onclick = ()=>{ state.reread = false; render(); };
    return;
  }

  const q = st.qFn ? st.qFn(state) : st.q;
  const kind = st.kindFn ? st.kindFn(state) : st.kind;
  const rawOpts = st.optsFn ? st.optsFn(state) : st.opts;
  /* 只走感受（第1-4课走法）里没有「从想要开始」这一进：想要那一簇整簇不走 */
  /* 2026-10-12：长按拖顺序推广到引导链每一屏——先按存档顺序排好数组，再照这个顺序渲染。
     data-i 是排完之后的下标，所以下面 click 里 opts[i] 取到的还是钮上那句话，路由不会错位。
     九大情绪那九格不吃这条（顺序是 1992 原表定的，固定不动）。 */
  const opts = applyOrder("flow-"+st.id, rawOpts, o => o.l || o.label);
  /* kind（小眉题）与 q（这一屏的问句）都是界面自己的话，随语言走；
     选项的 tag / 标题同理。选项下面那行副说明（oh(o)）带课程术语和动态数字，
     属下一波，这里先不动。 */
  let qHtml = '<div class="kind">'+esc(tx(kind))+'</div><h2 class="q">'+esc(tx(q))+'</h2>';
  if(st.big) qHtml += '<div class="note" style="font-size:var(--fs-q);text-align:center">'+st.big+'</div>';

  let body = "";
  if(st.type==="level"){
    body = '<div class="opts" data-sort-group="flow-'+st.id+'">'
      + opts.map((o,i)=>'<button class="opt" data-i="'+i+'" data-sort-key="'+esc(o.l)+'" data-l="'+esc(o.l)+'" data-lv="'+esc(o.lv||o.l)+'" data-go="'+o.go+'"'+SORT_TITLE+'><span class="k">'+(i+1)+'</span>'
        + '<span class="opt-txt">'+(o.tag ? '<span class="bdg">'+esc(tx(o.tag))+'</span>' : '')
        + '<span class="ttl">'+esc(tx(o.l))+'</span></span></button>').join("")
      + '</div>'
      /* 起手屏不再挂「上一遍走完了 · 记这一遍」那一行（2026-10-12 定规：不主动宣布放完）。
         上一遍的用时／轮数仍挂在 pendingRun 上，人自己点进「收获本」时，写字屏顶上才递那张门票。 */
      /* 六步骤收在这里：走完八课不再停在「这一课走完了」那一页，这一页也没删，
         只是换了地方——起手屏要翻的时候翻得到。 */
      + '<details class="sixfold"><summary>'+t("six.summary")+'</summary>'
        + '<div class="sixfold-in"><ol>'
        + SIX_STEPS.map(function(x, i){ return '<li>'+esc(x)+'<span class="six-en">'+esc(SIX_STEPS_EN[i])+'</span></li>'; }).join("")
        + '</ol></div></details>';
  }else if(st.type==="emotion"){
    if(state.level !== "老手"){
      const e0 = LV_LADDER.find(x=>x.key===state.emoLevel);
      const words = e0 ? Array.from(new Set(e0.kw.concat(e0.sub))) : [];
      const chipOf = s=>'<button class="chip" data-c="'+esc(s)+'" aria-pressed="'+(state.emotion===s?"true":"false")+'">'+esc(s)+'</button>';
      let inner;
      if(!e0){
        inner = '<div class="opts grid emo">'
+ EMO_ORDER().map((k,i)=>{ const e = LV_LADDER.find(x=>x.key===k); return '<button class="opt" data-e="'+e.key+'" aria-pressed="'+(state.emoLevel===e.key?"true":"false")+'">'
+ '<span class="k">'+(i+1)+'</span>'+esc(tx(e.key))+'</button>'; }).join("")
          + '</div>';
      }else{
        /* 挑过一格，九格整块收起：这一问已经答完，不许它继续占掉两屏把「就用这一格」挤出屏幕 */
        inner = '<div class="sw"><div class="sw-head"><span class="sw-name">'+esc(tx(e0.key))+'</span>'
          + '<span class="sw-note">'+esc(tx("点一个更贴的词，或就用这一格"))+'</span>'
          + '<button class="sw-swap" data-emoswap type="button" title="'+esc(tx("回到九大情绪表换一格"))+'">'+esc(tx("换一格"))+'</button></div>'
          + '<div class="sw-box"><div class="sw-chips">'
          + words.slice(0, SW_SHOWN).map(chipOf).join("") + '</div>'
          + (words.length>SW_SHOWN
              ? '<details class="sw-more"><summary>'+pick('还有 '+(words.length-SW_SHOWN)+' 个更细的词', (words.length-SW_SHOWN)+' more precise words')+'</summary>'
                + '<div class="sw-chips">' + words.slice(SW_SHOWN).map(chipOf).join("") + '</div></details>' : "")
          + '</div></div>'
          + '<div class="opts"><button class="opt prime" data-i="0">'+pick('就用「'+esc(e0.key)+'」', 'Use “'+esc(tx(e0.key))+'”')+'</button></div>';
      }
      /* 情绪和想要分成两块：这一屏只认情绪，想要留在它自己那一问里 */
      body = '<div class="blk"><div class="blk-h">'+esc(tx("情绪 · 九层"))+'</div>'+inner+'</div>';
    }else{
      body = '<div class="blk"><div class="blk-h">'+esc(tx("想要"))+'</div>'
        + '<div class="chips wants3" id="want-row" data-sort-group="'+WANT_GROUP+'">'
        + wantList().map(w=>'<button class="chip" data-w="'+w.key+'" data-sort-key="'+esc(w.key)+'" aria-pressed="'+(state.want===w.key?"true":"false")+'"'
          + SORT_TITLE+'>'+esc(tx(w.label))+'</button>').join("")
        + '</div></div>';
    }
  }else if(st.type==="goal"){
    body = '<div class="inrow"><textarea id="goalin" class="goalbox" rows="3" enterkeyhint="done" placeholder="'+esc(tx("例：这笔钱已经到我账上，而且我收得很平静"))+'">'+esc(state.goal)+'</textarea></div>'
      + '<div class="opts"><button class="opt prime" data-i="0">'+esc(tx("确定"))+'</button></div>';
  }else if(st.type==="chips"){
    body = '<div class="field"><div class="chips" data-sort-group="flow-'+st.id+'">'
      + st.chips.map(c=>'<button class="chip" data-c="'+esc(c)+'" data-sort-key="'+esc(c)+'" aria-pressed="'+(state[st.key]===c?"true":"false")+'"'+SORT_TITLE+'>'+esc(tx(c))+'</button>').join("")
      + '</div></div><div class="opts"><button class="opt prime" data-i="0">继续</button></div>';
  }else if(st.type==="wants"){
    body = '<div class="blk"><div class="blk-h">'+esc(tx("想要"))+'</div>'
      + '<div class="opts grid wantsrow" id="want-row" data-sort-group="'+WANT_GROUP+'">'
      + wantList().map(w=>'<button class="opt" data-want="'+esc(w.key)+'" data-sort-key="'+esc(w.key)+'"'
        + SORT_TITLE+'>'+esc(tx(w.label))+'</button>').join("")
      + '</div></div>';
  }else if(st.type==="choice"){
    body = '<div class="opts" data-sort-group="flow-'+st.id+'">'
      + opts.map((o,i)=>'<button class="opt'+'" data-i="'+i+'" data-sort-key="'+esc(o.label)+'"'+SORT_TITLE+'><span class="k">'+(i+1)+'</span>'+esc(tx(o.label))+'</button>').join("")
      + '</div>';
  }
  stage.innerHTML = qHtml + body;
  /* 「选项位置每步一致」（2026-10-09 用户口径：不用每一步都花心思移动手指）。
     做法是渲染完再量一次题干的**自然高度**，取本会话见过的最大值写进 --qh：
     短题那一步底下留白补齐、长题那一步是真高度，两种情况下第一颗选项顶边都在同一条横线上。
     为什么不按行数写死：手机到桌面档差一倍字号，写死行数必然一边空太多、一边顶出去；量出来最实在。

     坑（第一版就踩了）：量 getBoundingClientRect().height 会拿到**已经被 min-height 撑起来**的高度，
     于是最大值自己咬自己——第一屏量到 313px 写进去，下一屏量到 313px，比值相等才没继续涨，
     纯属运气。正确做法是量一个不受 min-height 影响的盒子的高度：
     用 Range 包住题干文字量文字本身的行高。 */
  (function(){
    const qEl = stage.querySelector(".q");
    if(!qEl || !qEl.firstChild) return;
    const rg = document.createRange();
    rg.selectNodeContents(qEl);
    const h = Math.ceil(rg.getBoundingClientRect().height);
    if(!h) return;
    if(!(window.__qMax > h)) window.__qMax = h;
    document.documentElement.style.setProperty("--qh", window.__qMax + "px");
  })();

  /* 起手屏那行「记这一遍」已经撤掉：放完一轮不递任何入口，想写随时自己点「收获本」。 */

  stage.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      if(consumeSortGuard()) return;   /* 刚拖完松手：这一次 click 是浏览器补的，不能当成选中 */
      const i = +btn.dataset.i;
      if(st.type==="level"){
        /* 按钮上显示的是「从感受开始／从想要开始」，内部仍存 新手／老手（引擎各处按这两个值分叉） */
        state.level = (opts[+btn.dataset.i] && opts[+btn.dataset.i].lv) || btn.dataset.l;
        if(state.level==="老手") state.emoLevel = "";
        jump(btn.dataset.go || st.then, opts[+btn.dataset.i]); return;
      }
      if(st.type==="emotion"){
        if(btn.dataset.e){
          state.emoLevel = btn.dataset.e;
          state.emotion = btn.dataset.e;
          saveRun(); render();
          const sw = stage.querySelector(".sw");
          if(sw && sw.scrollIntoView) sw.scrollIntoView({block:"nearest", behavior:"smooth"});
          return;
        }
        if(state.level==="老手" ? !state.want : !state.emotion){
          toast(state.level==="新手" ? tx("先在九大情绪里挑一格")
            : pick("先在"+wantLabels().length+"颗想要里认一格", "Name one of the "+wantLabels().length+" wants first")); return;
        }
        const nx = st.thenFn ? st.thenFn(state) : st.then;
        jump(nx); return;
      }
      if(st.type==="wants"){
        if(btn.dataset.want){ jump(st.thenFn ? st.thenFn(st) : st.then, {set:{want:btn.dataset.want}}); return; }   /* 想要跟钮走，不按位猜 */
        state.want = wantKeys()[i]; jump(st.thenFn ? st.thenFn(st) : st.then); return;
      }
      if(st.type==="goal"){
        /* 目标句可留空：这一屏是「这一放要放什么」的锚，不是必填项。
           原来空着会被拦下弹 toast，与本屏提示「空着也行，点了就往下走」自相矛盾；
           下游按空值走（收获本那一格留白、reread 跳过），不必在这里挡。 */
        state.goal = document.getElementById("goalin").value.trim();
        jump(st.then); return;
      }
      if(st.type==="chips"){
        if(!state[st.key]){ toast("先选一个，不用想理由"); return; }
        jump(st.then); return;
      }
      jump(opts[i].go, opts[i]);
    };
  });
  const swp = stage.querySelector("[data-emoswap]");
  if(swp){
    swp.onclick = ()=>{ state.emoLevel = ""; state.emotion = ""; saveRun(); render(); };
  }
  bindOptSort(stage);                       /* 长按拖顺序；点一下就是选中它、往下走 */
  stage.querySelectorAll(".chip").forEach(c=>{
    if(st.type==="goal") return;
    c.onclick = ()=>{
      /* 刚拖完松手那一下，浏览器会补一次 click：不吃掉的话松一下就被当成「认了这颗」，直接往下走。 */
      if(consumeSortGuard()) return;
      if(c.dataset.w && !c.dataset.c) state.want = c.dataset.w;
      else { state[st.key] = c.dataset.c; if(c.dataset.w) state.want = c.dataset.w; }
      saveRun();
      if(st.type==="emotion"){ jump(st.thenFn ? st.thenFn(state) : st.then); return; }
      stage.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===c?"true":"false"));
    };
  });
  if(st.type==="goal"){
    const inp = document.getElementById("goalin");
    /* 目标句边打边存：打字途中刷新页面，整句不再丢 */
    let goalT = null;
    inp.addEventListener("input", ()=>{
      runStart();
      state.goal = inp.value.trim();
      clearTimeout(goalT); goalT = setTimeout(saveRun, 400);
    });
    // 不限字数就要能换行：Enter 就是「确定」，Shift+Enter 才在句里换行
    inp.onkeydown = e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); stage.querySelector(".opt").click(); } };
    inp.focus();
  }
}

function pad(n){ return String(n).padStart(2,"0"); }

async function copy(text){
  /* 原先写完还要 readText() 回读比对：那会触发额外一次「读取剪贴板」的授权询问，
     部分浏览器直接抛。写成功就是成功了，校验属于自找麻烦。 */
  try{
    await navigator.clipboard.writeText(text);
    toast("已复制");
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove();
    toast(ok ? "已复制" : "复制被拦，选中那行手动复制");
  }
}

const LAST2_OPTS = ["放了一些，回去继续", "再放一轮"];
/* 卡住支线选项的显示层翻译：静态串走 UI_EN 查表；动态拼接串
   （mute 第3步「用「X」放，回去继续」，X 是词墙里的中文词）在此拼出英文。
   只动显示，不动 opts 数组本身——路由判断拿的还是原中文串。 */
function stuckOptDisp(o){
  if(lang() !== "en") return o;
  if(UI_EN[o]) return UI_EN[o];
  const m = /^用「(.+)」放，回去继续$/.exec(o);
  if(m) return "Release with “" + tx(m[1]) + "”, back to it";
  return o;
}
/* 每条支线一个眉题，逐步骤不再重复 */
const STUCK_NAME_OF = {crash:"越放越崩", mute:"说不清感觉", stuck:"放不动", grab:"还不愿放"};
let stuckFlow = null;   /* {key, i, pick, returnTo} 会话态，不落盘 */

function startStuckFlow(key){

}
function endStuckFlow(){
  const back = stuckFlow && stuckFlow.returnTo;

  render();
}
/* 「说不清感觉」那条不再给他一行提示文字自己去查表：九大情绪一格一格摊在这一屏，
   点哪格，那一格更细的词当场跟着出来——跟引导页情绪步同一块组件，不是第二套东西。 */
function stuckEmoHtml(m){
  const e0 = LV_LADDER.find(x=>x.key===m.emoLevel);
  if(!e0){
    return '<div class="opts grid emo">'
      + EMO_ORDER().map((k,i)=>{ const e = LV_LADDER.find(x=>x.key===k); return '<button class="opt" type="button" data-se="'+esc(e.key)+'" aria-pressed="'+(m.emotion===e.key?"true":"false")+'"><span class="k">'+(i+1)+'</span>'+esc(tx(e.key))+'</button>'; }).join("")
      + '</div>';
  }
  const words = Array.from(new Set(e0.kw.concat(e0.sub)));
  const chipOf = s=>'<button class="chip" type="button" data-sc="'+esc(s)+'" aria-pressed="'+(m.emotion===s?"true":"false")+'">'+esc(s)+'</button>';
  return '<div class="sw"><div class="sw-head"><span class="sw-name">'+esc(tx(e0.key))+'</span>'
    + '<span class="sw-note">'+esc(tx("点一个更贴的词，或就用这一格"))+'</span>'
    + '<button class="sw-swap" data-swap type="button" title="'+esc(tx("回到九大情绪表换一格"))+'">'+esc(tx("换一格"))+'</button></div>'
    + '<div class="sw-box"><div class="sw-chips">' + words.slice(0,SW_SHOWN).map(chipOf).join("") + '</div>'
    + (words.length>SW_SHOWN
        ? '<details class="sw-more"><summary>'+pick('还有 '+(words.length-SW_SHOWN)+' 个更细的词', (words.length-SW_SHOWN)+' more precise words')+'</summary>'
          + '<div class="sw-chips">' + words.slice(SW_SHOWN).map(chipOf).join("") + '</div></details>' : "")
    + '</div></div>';
}
function renderStuckFlow(){
  const stage = stageEl();
  if(!stage || !stuckFlow) return;
  const flow = STUCK_FLOWS[stuckFlow.key] || [];
  const st = flow[stuckFlow.i];
  if(!st){ endStuckFlow(); return; }
const kind = tx("卡住了") + " · " + (tx(STUCK_NAME_OF[stuckFlow.key])||"")
    + (stuckFlow.round>=2 ? pick(' · 第'+stuckFlow.round+'轮', ' · round '+stuckFlow.round) : '');
  const q = st.qFn ? st.qFn(stuckFlow) : st.q;
  const last = stuckFlow.i === flow.length - 1;
  const rawOpts = (st.optsFn ? st.optsFn(stuckFlow) : st.opts)
    || LAST2_OPTS;
  const opts = applyOrder("stuck-"+stuckFlow.key, rawOpts, x=>x);
  let h = '<div class="btnline" style="margin:0 0 var(--sp-1)"><button class="mini" id="stuck-exit">‹ '+esc(tx("退出"))+'</button></div>'
    + '<div class="kind">'+esc(kind)+'</div><h2 class="q">'+esc(tx(q))+'</h2>';
  if(st.emo) h += stuckEmoHtml(stuckFlow);
  h += '<div class="opts" data-sort-group="stuck-'+stuckFlow.key+'">'
    + opts.map((o,i)=>'<button class="opt" data-stuckstep="'+i+'" data-sort-key="'+esc(o)+'"'+SORT_TITLE+'>'+esc(stuckOptDisp(o))+'</button>').join("")
    + '</div>';
  stage.innerHTML = h;
  const x = document.getElementById("stuck-exit");
  if(x) x.onclick = endStuckFlow;
  bindOptSort(stage);
  if(st.emo){
    stage.querySelectorAll("[data-se]").forEach(b=>b.onclick=()=>{
      stuckFlow.emoLevel = b.dataset.se; stuckFlow.emotion = b.dataset.se; renderStuckFlow();
    });
    stage.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{
      stuckFlow.emotion = b.dataset.sc; renderStuckFlow();
    });
    const sw = stage.querySelector("[data-swap]");
    if(sw) sw.onclick = ()=>{ stuckFlow.emoLevel = ""; stuckFlow.emotion = ""; renderStuckFlow(); };
  }
  stage.querySelectorAll("[data-stuckstep]").forEach(b=>b.onclick=()=>{
    if(consumeSortGuard()) return;   /* 刚拖完松手：这一次 click 是浏览器补的，不能当成作答 */
    const o = opts[+b.dataset.stuckstep];
    if(o) stuckFlow.pick = o;
    if(last && !/再放一轮/.test(o)){ endStuckFlow(); return; }   /* 「回去继续」当场收线回主链 */
    if(last){
      stuckFlow.pick = ""; stuckFlow.i = 0; stuckFlow.round++;   /* 「再放一轮」从头再来 */
    }else{
      stuckFlow.i++;
      if(stuckFlow.i >= flow.length){ stuckFlow.i = 0; stuckFlow.round++; }   /* 兜底，正常走不到 */
    }
    renderStuckFlow();
  });
}

/* ── 工作本：一屏队列。顶部换表、一个输入框写条目、点条目本体进那条链；
   开始时间、用时、轮数、情绪、想要、目标句都落在条目自己身上（runs），放过的过程事后看得见。 ── */
let wsG = 0;         /* 当前看/写哪一组 */
let wsOpen = null;   /* 正在走链的那一条（钥匙串，见 wsKeyOf） */
/* 2026-10-14 用户令「工作本那么多内容都要以目录形式收起来」：工作本页默认落目录屏
   （十三张表一张目录）。wsMode 只有两个值：list＝目录，table＝某张表的队列/走链屏。
   与 l8Mode 同一套心思：只记「人在哪一层」，别的状态各有各的键，不动。 */
let wsMode = "list";
let wsEdit = null;
let wsSeq = 0;

function wsEnsureIds(){
  let changed = false, seen = {};
  Object.keys(sheets).forEach(sid=>{
    if(!Array.isArray(sheets[sid])){ delete sheets[sid]; changed = true; return; }
    sheets[sid].forEach(it=>{
      if(typeof it.id !== "number" || seen[it.id]){ it.id = ++wsSeq; changed = true; }
      seen[it.id] = 1;
      if(!Array.isArray(it.runs)){
        it.runs = it.done ? [{a:[], t:0}] : [];
        delete it.done; delete it.good; delete it.open; changed = true;
      }
      if(it.want === -1 || it.want === undefined) it.want = null;
      if(typeof it.c !== "string" || !it.c){ it.c = newNonce(); changed = true; }
      if(typeof it.emo !== "string") it.emo = "";
      if(!it.updatedAt){
        const last = it.runs[it.runs.length-1];
        it.updatedAt = (last && (last.iso || last.t)) ? new Date(last.iso || last.t).toISOString() : new Date().toISOString();
        changed = true;
      }
    });
  });
  if(changed) saveSheets();
}
function wsMigrate(){
  let max = 0;
  Object.keys(sheets).forEach(sid=>{
    if(!Array.isArray(sheets[sid])) return;
    sheets[sid].forEach(it=>{ if(typeof it.id === "number" && it.id > max) max = it.id; });
  });
  wsSeq = max;
  wsEnsureIds();
  if(!curSheet || !SHEETS.some(x=>x.id === curSheet)) curSheet = SHEETS[0].id;
}
function wsLive(sid){ return sheets[sid] || []; }
function wsKeyOf(it){ return it.c || ("n"+it.id); }   /* 云合并认这把钥匙；本机的 it.id 只是行内句柄，换设备重排不改身份 */
function wsById(k){ return wsLive(curSheet).filter(x=>wsKeyOf(x) === k)[0] || null; }
function wsRounds(it){ return (it.runs || []).length; }
function wsCur(){ return SHEETS.filter(x=>x.id === curSheet)[0] || SHEETS[0]; }
function wsTotals(){
  const ks = Object.keys(sheets).filter(k=>wsLive(k).length);
  let n = 0, d = 0;
  ks.forEach(k=>wsLive(k).forEach(i=>{ n++; if(wsRounds(i)) d++; }));
  return {n:n, d:d, sheets:ks.length};

  h += '<div class="btnline"><button class="mini" id="ws-clear">'
    + pick('清空这张表 · ', 'Clear this table · ') + wsLive(s.id).length + pick(' 条', ' entries') + '</button></div>';

}
function wsRunLine(rec){
  if(!rec) return "";
  const bits = [];
  if(rec.start) bits.push(rec.start+pick(" 开始"," start"));
  if(typeof rec.secs === "number") bits.push(pick("用时 ","Time ")+fmtDur(rec.secs));
  if(rec.emo) bits.push(pick("情绪 ","Feeling ")+tx(rec.emo));
  if(rec.want) bits.push(pick("想要 ","Want ")+normWantKey(rec.want));
  if(typeof rec.rounds === "number") bits.push(pick("复查 ","Reviewed ")+rec.rounds+pick(" 轮"," rounds"));
  if(rec.feeling) bits.push(rec.feeling);
  if(rec.gain) bits.push(pick("收获：","Gain: ")+rec.gain);
  return bits.join(" · ");
}

function wsBind(p, s){
  const db = p.querySelector("#ws-dir");
  if(db) db.onclick = ()=>{ wsMode = "list"; renderSheetsPane(); };
  p.querySelectorAll("[data-wsopen]").forEach(el=>el.onclick = ()=>{
    const id = el.dataset.wsopen;
    if(wsOpen === id){ wsClose(); }
    else{ if(wsOpen !== null) takeSlot("guide"); wsOpen = id; wsEdit = null; }
    if(document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    renderSheetsPane();
  });
  const backEl = p.querySelector("#ws-back");
  if(backEl) backEl.onclick = ()=>{ wsClose(); renderSheetsPane(); };
  const prevEl = p.querySelector("#ws-prev");
  if(prevEl) prevEl.onclick = ()=>{ if(state.path.length) back(); };
  const again = p.querySelector("#ws-again");
  if(again) again.onclick = ()=>armConfirm(again, "重来这一条？", ()=>{
    if(wsOpen === null) return;
    wsResetRun(wsOpen); renderSheetsPane(); toast("这一条回到起手");
  });
  p.querySelectorAll("[data-wsgmove]").forEach(b=>b.onclick = ()=>{
    const it = wsById(b.dataset.wsgmove); if(!it) return;
    it.g = +b.dataset.gi; wsG = it.g; wsTouch(it); saveSheets(); renderSheetsPane();
  });
  p.querySelectorAll("[data-wsedit]").forEach(b=>b.onclick = ()=>{
    wsEdit = b.dataset.wsedit; wsClose(); renderSheetsPane();
    const inp = p.querySelector("#wb-editin"); if(inp){ inp.focus(); inp.select(); }
  });
  const ein = p.querySelector("#wb-editin");
  if(ein){
    const commit = ()=>{
      if(wsEdit === null) return;
      const it = wsById(wsEdit), v = ein.value.trim();
      if(it && v){ it.text = v; wsTouch(it); }
      wsEdit = null; saveSheets(); renderSheetsPane();
    };
    ein.onkeydown = e=>{
      if(e.key === "Enter"){ e.preventDefault(); commit(); }
      else if(e.key === "Escape"){ wsEdit = null; renderSheetsPane(); }
    };
    ein.onblur = commit;
  }
  p.querySelectorAll("[data-wsdel]").forEach(b=>b.onclick = ()=>armConfirm(b, "确认删？", ()=>{
    const parts = b.dataset.wsdel.split("|");
    const arr = wsLive(parts[0]), ix = arr.findIndex(x=>wsKeyOf(x) === parts[1]);
    if(ix < 0){ renderSheetsPane(); return; }
    const gone = arr[ix];
    if(wsKeyOf(gone) === wsOpen) wsClose();
    takeSlot("guide");                       /* 槽里的档要先收回 SLOTS，才能按条目钥匙删干净 */
    delete SLOTS["ws:"+wsKeyOf(gone)];
    tombAdd(WS_TOMB, parts[0]+"|"+wsKeyOf(gone));   /* 墓碑钥匙必须和 mergeSheets 的 sheetNonce 一致（表id|c/nonce），否则删掉的下次合并复活 */
    arr.splice(ix, 1); saveSheets(); wsSaveSlots(); renderSheetsPane();
  }));
  const tIn = p.querySelector("#ws-topic");
  if(tIn) tIn.onchange = ()=>saveTopic(s.id, tIn.value.trim());
  const addNow = ()=>{
    const ta = p.querySelector("#wb-in");
    if(!ta || !wsAdd(s, ta.value)) return;
    renderSheetsPane();
    const inp = p.querySelector("#wb-in");
    if(inp){ inp.value = ""; inp.focus(); }
  };
  const ta = p.querySelector("#wb-in");
  if(ta) ta.onkeydown = e=>{
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); addNow(); }
  };
  const go = p.querySelector("#wb-go");
  if(go) go.onclick = addNow;
  const cl = p.querySelector("#ws-clear");
  if(cl) cl.onclick = ()=>{
    if(!wsLive(s.id).length){ toast("这张表是空的"); return; }
    armConfirm(cl, "确认清空？", ()=>{
      const n = wsLive(s.id).length;
      wsLive(s.id).forEach(it=>{
        tombAdd(WS_TOMB, s.id+"|"+wsKeyOf(it));
        takeSlot("guide");
        delete SLOTS["ws:"+wsKeyOf(it)];
      });
      sheets[s.id] = []; wsEdit = null; wsClose(); saveSheets(); wsSaveSlots(); renderSheetsPane();
      toast("清空了 " + n + " 条");
    });
  };
}

/* 落盘通道：手机壳里 blob: 只活在渲染进程，壳子是拿页内 fetch 去取的，
   点击同一拍就 revoke 等于递过去一个空地址（实测 fetch 必败）——手机上就是点了没文件。
   所以有原生直写通道（AndroidShell.saveText）先走它；没有才退回 <a download>，
   并且那颗 a 要挂进文档、revoke 推到几秒以后。
   2026-10-14「其他功能全删」之后这里只递纯文字，不再管 JSON。 */
function saveAsFile(name, txt, note){
  if(window.AndroidShell && typeof window.AndroidShell.saveText === "function"){
    try{ window.AndroidShell.saveText(name, txt); }
    catch(e){ toast("没能写入：" + ((e && e.message) || e)); return false; }
    toast("已存到 下载/释放法/" + name + (note ? " · " + note : ""));
    return true;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], {type:"text/plain;charset=utf-8"}));
  a.download = name;
  a.className = "filepick";
  document.body.appendChild(a);
  a.click();
  const url = a.href;
  setTimeout(()=>{ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 8000);
  toast("已导出 " + name + (note ? "（" + note + "）" : ""));
  return true;
}
/* ── 台账退役（2026-10-08）：走完一遍的记录只留「收获本」这一处 ──
   老账目搬一次就打上标志，绝不搬第二遍；存储 release-ledger-v1 一个字没动，
   真要回来，原样还在，搬得回来。 */
const LG_MERGED = "rf_harvest_merged";
/* 一条老账换成一条记录：目标句进正文，身体感受／收获／别的想要 换行跟在后面，
   轮数／读数／用时 照搬——走过的那一笔从此带数。 */
function rowToHarvest(r){
  const els = String(r.also||"").split("·").filter(Boolean).map(k=>normWantKey(k));
  const text = [r.goal || "未填", r.feeling, r.gain ? "收获："+r.gain : "",
    els.length ? "别的想要："+els.join("、") : ""].filter(Boolean).join("\n");
  const ts = r.updatedAt || rowIsoOf(r);
  return {id:r.id, ts:ts, date:r.date||"", text:text, mood:r.emo||"", goal:"", tag:"",
    want:(r.want && r.want!=="未选") ? r.want : "",
    rounds:(typeof r.rounds==="number" ? r.rounds : 0),
    secs:(typeof r.secs==="number" ? r.secs : null),
    reading:(typeof r.reading==="number" ? r.reading : null),
    start:r.start||"", updatedAt:ts};
}
function mergeLedgerOnce(){
  if(!storageOk) return;
  try{ if(localStorage.getItem(LG_MERGED)) return; localStorage.setItem(LG_MERGED, "1"); }catch(e){ return; }
  let raw = "";
  try{ raw = localStorage.getItem(LS) || ""; }catch(e){ return; }
  const added = [];
  try{
    const p = JSON.parse(raw || "[]");
    if(Array.isArray(p)) p.forEach(rw=>{
      const r = normalizeRow(rw);
      if(!r || harvest.some(x=>x.id===r.id)) return;
      added.push(rowToHarvest(r));
    });
  }catch(e){ return; }
  if(!added.length) return;
  added.forEach(x=>harvest.unshift(x));
  saveHarvest();
}

/* ---------- 全部东西写成一份 TXT（2026-10-14 用户令「默认导出就是TXT，其他功能全删」） ----------
   以前要备份得在几颗钮里挑，导出来的还是 JSON／md——人打不开。
   现在只有一份纯文字：工作本一张表一段（条目＋它自己走过的每一轮），收获本一条一段。
   导入这一路整个下线：数据只在这一台设备上长，拿出去的那一份是给人看的。 */
function wsTxtBlock(s){
  const list = wsLive(s.id);
  if(!list.length) return "";
  const topic = s.topic ? topicOf(s.id) : "";
  let h = "〔" + tx(s.name) + "〕" + (topic ? pick("主题：", "Topic: ") + topic : "") + "\n";
  list.forEach(it=>{
    const g = s.groups.length > 1 ? String(s.groups[it.g] || "") : "";
    h += "· " + String(it.text||"").replace(/\r?\n+/g," ")
      + (g ? pick("（", " (") + tx(g) + pick("）", ")") : "") + "\n";
    (it.runs || []).forEach(r=>{
      const l = wsRunLine(r);
      if(l) h += "   " + l + "\n";
    });
  });
  return h + "\n";
}
function exportAllTxt(){
  const hv = harvest.filter(x=>!x.del).slice().sort((a,b)=>harvStamp(b)-harvStamp(a));
  if(!wsTotals().n && !hv.length){ toast(pick("还没有东西可导出", "Nothing to export yet")); return; }
  const d = new Date();
  const stamp = String(d.getFullYear()).slice(2)+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())
    +" "+pad(d.getHours())+":"+pad(d.getMinutes());
  const bar = "────────────────";
  let txt = t("brand") + "\n" + pick("导出于 ", "Exported ") + stamp + "\n";
  const wblocks = SHEETS.map(wsTxtBlock).filter(Boolean).join("");
  if(wblocks){
    txt += "\n" + bar + "\n" + t("tab.sheets") + "\n" + bar + "\n\n" + wblocks;
  }
  if(hv.length){
    txt += "\n" + bar + "\n" + t("tab.harvest") + "\n" + bar + "\n\n"
      + hv.map(harvTxtBlock).join("\n\n") + "\n";
  }
  saveAsFile("释放法备份-" + String(d.getFullYear())+pad(d.getMonth()+1)+pad(d.getDate()) + ".txt", txt);
}

/* 轻量确认：第一次点把按钮变成「确认…」，再点才执行；2.6 秒不动自动弹回。
   只用在误触即丢数据的操作上（删记录 / 重新开始），不弹窗、不打断。 */
function armConfirm(btn, armedLabel, fn){
  if(btn.dataset.armed === "1"){
    btn.dataset.armed = "";
    btn.textContent = btn.dataset.idle || btn.textContent;
    btn.classList.remove("armed");
    fn();
    return;
  }
  btn.dataset.armed = "1";
  btn.dataset.idle = btn.textContent;
  btn.textContent = armedLabel;
  btn.classList.add("armed");
  setTimeout(()=>{
    if(!btn.isConnected || btn.dataset.armed !== "1") return;
    btn.dataset.armed = "";
    btn.textContent = btn.dataset.idle;
    btn.classList.remove("armed");
  }, 2600);
}

/* ===== 收获本（可同步） =====
   数据：数组，每条 {id, ts, date, text, mood, goal, tag, updatedAt, del}
   - id：创建时生成，跨设备合并的唯一键
   - ts：ISO 时间戳（排序 / 合并比较）
   - updatedAt：最近修改时间（合并时取较新者）
   - del：软删除标记（合并时优先于内容，任一端删过就不再出现） */
const LS_HARVEST = "release-harvest-v1";
let harvest = [];
let harvEditing = null;            /* null | "__new__" | 已有 id */
let pendingRun = null;             /* 走完那一遍的数：挂在起手屏上等人记，不再主动弹表单 */
/* 走完、没记、就又走了下一轮的那一遍，转成一条「走过」直接落进收获本。
   跟表单 save 那段同源：读数没填就是 null，文字/标签留空，用户回头点编辑补写就行。
   先把这一笔留住，比逼他当场停下来填表重要——不打断也不丢数。 */
function pendToRow(pr){
  return {text: "", mood: pr.emo || "", goal: pr.goal || "", tag: "", want: pr.want || "",
          rounds: pr.rounds, secs: pr.secs, start: pr.start,
          date: pr.date, ts: pr.ts};
}
function loadHarvest(){
  if(!storageOk) return;
  try{
    const raw = localStorage.getItem(LS_HARVEST);
    if(!raw) return;
    const pa = JSON.parse(raw);
    if(Array.isArray(pa)) harvest = pa.filter(x=>x && x.id);
  }catch(e){}
}
function saveHarvest(){
  if(!storageOk) return;
  try{ localStorage.setItem(LS_HARVEST, JSON.stringify(harvest)); }catch(e){}
  try{ if(!SYNC_OFF && window.CBSync) CBSync.autosync(); }catch(e){}
}
function newHarvestId(){ return 'H' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function addHarvest(o){
  const now = new Date().toISOString();
  harvest.unshift(Object.assign({ id:newHarvestId(), ts:now, updatedAt:now }, o));
  saveHarvest();
}
function updateHarvest(id, patch){
  const it = harvest.find(x=>x.id===id);
  if(!it) return;
  Object.assign(it, patch, { updatedAt:new Date().toISOString() });
  saveHarvest();
}
function deleteHarvest(id){
  const it = harvest.find(x=>x.id===id);
  if(!it) return;
  it.del = true; it.updatedAt = new Date().toISOString();
  saveHarvest();
}
/* 数字由 renderHarvestList 一起算好写进 #harv-count（走过的＋随手记的合成一条流），
   这个函数只负责「哪儿有数字就刷新哪儿」——导入云端那种改了数据但没重画列表的路径靠它。 */
function updateHarvCount(){
  const c = document.getElementById("harv-count");
  if(!c) return;
  const body = document.getElementById("harv-body");
  if(body) renderHarvestList();
}
function harvFormHtml(){
  const e = harvEditing;
  const cur = (e && e!=="__new__") ? harvest.find(x=>x.id===e) : null;
  /* 刚走完一遍（pendingRun 在场）才在屏底附一张原文门票；随手记那一屏不许多出一格 */
  const pr = cur ? null : pendingRun;
  const text = cur ? (cur.text||"") : "";
  /* 记录时间：编辑读回这条自己的时刻，新记取现在；格式跟卡片上那一行对齐（26-10-12 11:20） */
  const iso = cur ? String(cur.ts||cur.updatedAt||"") : new Date().toISOString();
  const d = iso ? iso.slice(2,10)+" "+iso.slice(11,16) : "";
  const walked = cur ? (typeof cur.rounds === "number") : false;
  /* 2026-10-12 用户口径「安安静静一个输入框」：想要三颗也从写字屏撤下——
     数据一条不删，旧条目里已有的 want 字段编辑时原样留着（只打补丁不清字段），
     只是不再摆在写字屏上。写字屏就两样东西：一行记录时间、一句话。

function harvItemHtml(it){
  /* 时间流的排序依据是 ts（ISO），只显示日期的话同一天两条分不出先后——补上时刻。
     格式跟走过的那条对齐（26-10-07 04:12），两行左起线才对得齐。 */
  const iso = String(it.ts||"");
  const d = iso ? iso.slice(2,10)+" "+iso.slice(11,16) : (it.date||"");
  const walked = typeof it.rounds === "number";
  /* 2026-10-12「字段一起砍」：卡片只留一句话。原先那一行「复查 2 轮 · 用时 4 分 · 情绪 … · 想要 …」
     整条撤掉——数据还在条目上（走过几次／累计多久仍从这些数算），只是不再逐条摊给人看。
     走完自动落档的那一笔常常一个字没写，光秃秃一张卡看着像坏了，所以没写字时兜一句想要／情绪。 */
  const only = [it.want ? "想要 "+WANT_LABEL(it.want) : "", it.mood ? "情绪 "+it.mood : ""].filter(Boolean).join(" · ");
  return '<div class="harv-item">'
    + '<div class="harv-meta"><span class="harv-date">'+esc(d)+'</span>'
    + '<span class="harv-src">'+(walked?"走过":"随手记")+'</span>'
    + '<span class="harv-ops">'
    + '<button class="h-op" data-edit="'+it.id+'" aria-label="编辑这条" title="编辑">'+IC_EDIT+'</button>'
    + '<button class="h-op" data-del="'+it.id+'" aria-label="删除这条" title="删除">'+IC_DEL+'</button>'
    + '</span></div>'
    + (it.text ? '<div class="harv-text">'+esc(it.text)+'</div>'
               : (only ? '<div class="harv-text" style="color:var(--muted)">'+esc(only)+'</div>' : ''))
    + '</div>';
}
/* 走过的那一笔和随手记的那一句同一条流：ts 就是它自己的时刻（台账退役，rowStamp 一起退） */
function harvStamp(x){
  const t=Date.parse(x.ts||x.updatedAt||"");
  return isNaN(t) ? 0 : t;
}
/* 收获本顶部那一行：只报三个数——走过几次、累计多久、最近读数多少。
   不排行、不打分、不给评语：这一屏是用来回看的，不是用来被考核的。 */
function lookStatsHtml(){
  const walked = harvest.filter(x=>!x.del && typeof x.rounds === "number");
  const n = walked.length;
  const mins = Math.floor(walked.reduce((s,x)=>s+(Number(x.secs)||0),0)/60);
  const dur = !n ? "—"
    : (mins>=60 ? Math.floor(mins/60)+" 小时"+((mins%60)? " "+(mins%60)+" 分":"")
                 : mins+" 分");
  return '<div class="harv-stat" id="harv-stat">走过 '+n+' 次 · 累计 '+dur+'</div>';
}
function renderHarvestList(){
  const body = document.getElementById("harv-body");
  if(!body) return;
  if(harvEditing!==null){
    body.innerHTML = harvFormHtml();
    const save = document.getElementById("harv-save");
    if(save) save.onclick = ()=>{
      /* 空着也能存：占位符答应过「不想写就空着」。想要已从界面撤下，
         编辑旧条目时它已有的 want 字段原样留着（updateHarvest 只打补丁，不清字段）。 */
      const text = String(document.getElementById("harv-text").value||"").trim();
      const o = { text: text };
      /* 走完那一遍的数就静默挂在这一条上：轮数／用时／开始时刻。界面不摆，数据不丢。 */
      if(pendingRun){
        o.rounds = pendingRun.rounds; o.secs = pendingRun.secs; o.start = pendingRun.start;
        o.mood = pendingRun.emo; o.goal = pendingRun.goal;
        if(!o.want) o.want = pendingRun.want;
        pendingRun = null;
      }
      if(harvEditing==="__new__") addHarvest(o); else updateHarvest(harvEditing, o);
      harvEditing = null;
      updateHarvCount();
      renderHarvestList();
      toast("已记下来");
    };
    const cancel = document.getElementById("harv-cancel");
    if(cancel) cancel.onclick = ()=>{ harvEditing=null; renderHarvestList(); };
    const t = document.getElementById("harv-text");
    if(t) t.focus();
    return;
  }
  const q = (document.getElementById("harv-q")||{}).value || "";
  const kw = q.trim().toLowerCase();
  const hit = s => String(s||"").toLowerCase().includes(kw);
  /* 一条时间流：走过的那一笔（带 复查／读数／用时）＋ 随手记的那一句，按时刻倒序。
     2026-10-08 台账退役：记录只剩这一处，行与行同一件长相、同两颗钮。 */
  const list = harvest.filter(x=>!x.del && (!kw
      || hit(x.text) || hit(x.mood) || hit(x.goal) || hit(x.tag)
      || hit(x.want ? (WANT_LABEL_OF[x.want]||x.want) : "")
      || hit(x.date||"") || hit(String(x.ts||""))));
  /* 2026-10-14 用户令：「还没有走过一次…」全删，「没有匹配「」的。」也不要写。
     空的、搜不到的，都不写一句话——列表区就空着，钮（记一笔／导出 TXT）已经把能做的事摆在那儿。
     （原先搜不到那行是照 q 拼的，q 为空时拼出来正好是「没有匹配「」的。」，本轮一并去掉。） */
  if(!list.length){ body.innerHTML = ""; return; }
  const nw = list.filter(x=>typeof x.rounds === "number").length;
  const merged = list.map(x=>({t:harvStamp(x), h:harvItemHtml(x)})).sort((a,b)=>b.t-a.t);
  body.innerHTML = lookStatsHtml()
    + '<div class="harv-list">'+merged.map(m=>m.h).join("")+'</div>'
    + '<div class="harv-count" id="harv-count">'+merged.length+' 条 · 走过的 '+nw+' · 随手记的 '+(merged.length-nw)+'</div>';
  body.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ harvEditing=b.getAttribute("data-edit"); renderHarvestList(); });
  body.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const id=b.getAttribute("data-del");
    const it=harvest.find(x=>x.id===id);
    if(it && confirm("删除这一条？同步后另一台设备也会消失。")){ deleteHarvest(id); updateHarvCount(); renderHarvestList(); }
  });
}
/* ── 一条记录写成给人读的那一段（2026-10-14 加）──

/* 2026-10-14 用户令「八节课那么多内容都要以目录形式收起来」：
   八课页默认落在**目录屏**（八课一张目录，内容收在条目里），点一行才进那一课的引导。
   l8Mode 三个值：list＝八课目录，lesson＝课内一句一屏，pdir＝本课练习目录
   （轮40 用户令「练习部分也要目录那样」：练习切换也从横排 chip 改成目录式，
   与 list 同一套心思——只记「人在哪一层」，句位数据各有各的键，不动）。
   #L8 这类深链照旧直接落到那一课（走查判据与旧链接都靠它）。 */
let l8cur = (function(){ const m = location.hash.match(/^#L(\d)$/); return m ? (+m[1]) : 1; })();
let l8Mode = (function(){ const m = location.hash.match(/^#L(\d)$/); return m ? "lesson" : "list"; })();
/* 每课走到第几句（目录屏要显示「走到哪了」）：只记句位这一件小事，
   别的数据（随手记、改过的引导句）各有各的键，不动。 */
const LS_8P = "release-8lesson-pos-v1";
function l8PosAll(){ try{ const o = JSON.parse(localStorage.getItem(LS_8P)||"null"); return (o&&typeof o==="object")?o:{}; }catch(e){ return {}; } }
function l8PosOf(n){ const v = l8PosAll()[n]; return (typeof v === "number" && v >= 0) ? v : null; }
function l8PosSet(n, i){ const o = l8PosAll(); o[n] = i; try{ localStorage.setItem(LS_8P, JSON.stringify(o)); }catch(e){} }
function load8L(){ try{ const o = JSON.parse(localStorage.getItem(LS_8L)||"null"); return (o&&typeof o==="object")?o:{}; }catch(e){ return {}; } }
function save8L(o){ try{ localStorage.setItem(LS_8L, JSON.stringify(o)); }catch(e){} }
/* 引导词就地改：改动只存这一台设备，LESSON8 里课程原话一个字不动。
   2026-10-10 八课数据逐字照原课程重写后句位全变，就地改与随手记两键从 v1 换到 v2：
   v1 里套在旧句位上的旧改动会盖住／错套新原话，换代后自动失效（旧键留在本机可找回）。
   要把它固化进真身，点「改过 N 句」复制那份清单（现句＋课程原话都在里面）。 */
const LS_8E = "release-8lesson-edits-v2";
function l8Edits(){ try{ const o = JSON.parse(localStorage.getItem(LS_8E)||"null"); return (o&&typeof o==="object")?o:{}; }catch(e){ return {}; } }
function l8SetEdit(k, v){ const o = l8Edits();
  if(v===null||v===undefined||v==="") delete o[k]; else o[k] = v;
  try{ localStorage.setItem(LS_8E, JSON.stringify(o)); }catch(e){} }
function l8EdCount(n, ed){ return Object.keys(ed).filter(function(k){ return k.indexOf(n+"-")===0; }).length; }
function l8EditList(n, ed){
  const G = LESSON8[n-1].guide;
  return Object.keys(ed).filter(function(k){ return k.indexOf(n+"-")===0; })
    .sort(function(a,b){ return (+a.split("-")[1]) - (+b.split("-")[1]); })
    .map(function(k){ const i = +k.split("-")[1];
      return "第"+n+"课 第"+(i+1)+"句\n现在：【"+ed[k]+"】\n原话：【"+(G[i]?G[i].s:"")+"】"; })
    .join("\n\n");
}
function l8EditLine(box, key, base, cur){
  /* 点进框里定位光标也会冒泡到这一句那颗 onclick：已经在编辑就直接回，
     否则 textContent="" 会把刚挂上的输入框连同光标位置一起抹掉。 */
  if(box.querySelector(".l8-edit-ta")) return;
  box.classList.add("l8-editing");
  box.textContent = "";
  const ta = document.createElement("textarea");
  ta.className = "l8-edit-ta"; ta.rows = 3; ta.value = cur;
  const bar = document.createElement("div"); bar.className = "l8-edit-bar";
  const ok = document.createElement("button"); ok.type = "button"; ok.textContent = t("l8.ok");
  const rb = document.createElement("button"); rb.type = "button";
  rb.textContent = (cur === base) ? t("l8.cancel") : t("l8.revert");
  bar.appendChild(ok); bar.appendChild(rb);
  box.appendChild(ta); box.appendChild(bar);
  ta.focus();
  const drop = function(){ l8SetEdit(key, null); renderLesson8(); };
  ok.onclick = function(){
    const v = ta.value.replace(/\s+/g, " ");
    if(v === "" || v === base){ drop(); return; }
    l8SetEdit(key, v); renderLesson8();
  };
  rb.onclick = drop;
  ta.onkeydown = function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ok.onclick(); }
    else if(e.key === "Escape"){ renderLesson8(); }
  };
}
let l8i = 0;                     /* 当前走到这一课的第几步 */
const _l8Loop = {};              /* 循环面计数（课-步 键）：自动循环三轮用 */
const L8_NOTE = "release-8lesson-notes-v2";   /* 同上：句位全变，随手记一并换代 */
function l8Notes(){ try{ return JSON.parse(localStorage.getItem(L8_NOTE)||"{}"); }catch(e){ return {}; } }
function l8SaveNote(k, v){ const o = l8Notes(); o[k] = v;
  try{ localStorage.setItem(L8_NOTE, JSON.stringify(o)); }catch(e){} }

/* 八课 write 步绑工作本：写下的行直接落工作本对应表对应组（一行一条），
   与工作本页签同源同存（release-sheets-v1，云同步自动跟上）。删除走同一套墓碑。 */
function wsAddTo(sid, gi, raw){
  const lines = String(raw||"").split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,50);
  if(!lines.length) return 0;
  const arr = sheets[sid] || (sheets[sid] = []);
  lines.forEach(t=> arr.push({id:++wsSeq, c:newNonce(), g:gi, text:t, runs:[], want:null, emo:"", updatedAt:new Date().toISOString()}));
  saveSheets();
  return lines.length;
}
function wsDelFrom(sid, key){
  const arr = wsLive(sid), ix = arr.findIndex(x=>wsKeyOf(x) === key);
  if(ix < 0) return;
  const gone = arr[ix];
  if(wsKeyOf(gone) === wsOpen) wsClose();
  takeSlot("guide");
  delete SLOTS["ws:"+wsKeyOf(gone)];
  tombAdd(WS_TOMB, sid+"|"+wsKeyOf(gone));
  arr.splice(ix, 1); saveSheets(); wsSaveSlots();
}
/* 清空一个练习写下的条目（2026-10-13 用户令「填写的要可以删掉，清空」：每节课每个练习
   写下的都要能单条删、也能一键清空）：
   粒度＝「这个练习写的那几栏」（表 id + 组号数组），**不是整张表**——
   练习6/7 同在 goal 表却各占一栏、练习8/9/13 同在 remember 表各占一栏，
   整表一清会把别的练习顺手扫掉，那不是人要的「清空这个练习」。
   每一条都进墓碑再清——不然另一台设备合下来的时候，刚清空的东西会被原样带回来
   （墓碑就是为这种情况存在的：合并时它压住复活）。返回清掉几条，好让界面回一句实打实的数。 */
function wsClearExer(sid, gs){
  const want = {};
  (gs || []).forEach(function(g){ want[g] = 1; });
  const arr = wsLive(sid);
  let n = 0;
  for(let i = arr.length - 1; i >= 0; i--){
    const it = arr[i];
    if(!want[(typeof it.g === "number") ? it.g : 0]) continue;
    const k = wsKeyOf(it);
    tombAdd(WS_TOMB, sid + "|" + k);
    delete SLOTS["ws:" + k];
    if(k === wsOpen) wsClose();
    arr.splice(i, 1); n++;
  }
  if(n){ wsSaveSlots(); saveSheets(); }
  return n;
}

/* ── 八课目录屏（2026-10-14 用户令「八节课那么多内容都要以目录形式收起来」）──
   八课页默认停在这里：八课一张目录，一句一屏的内容全收在条目里，点一行才进那一课。
   目录上只报课次（第 X / 8 课）——不列练习名、不讲课、不显示进度（2026-10-14 轮41
   用户令「直接写第几课就好了」「目录不要简介」：练习名摘要整条撤掉）。 */
function l8DirSub(L){
  const ks = (L.key || []).map(function(k){
    const kk = tx(String(k));
    const i = kk.indexOf("·");
    return i >= 0 ? kk.slice(i+1).trim() : kk;
  });
  if(!ks.length) return "";
  if(ks.length <= 2) return ks.join(pick("、", ", "));
  /* 已经显示了前两个，「等」后面报的是**还剩几个**（英文分支同口径），不是这一课一共几个 */
  return ks.slice(0,2).join(pick("、", ", ")) + pick("…等 "+(ks.length-2)+" 个", "…and "+(ks.length-2)+" more");
}
function l8Open(n){
  if(n < 1 || n > 8) return;
  l8cur = n;
  l8i = l8PosOf(n) || 0;     /* 从上次那一句接着走；没进过就从第一句起 */
  l8Mode = "lesson";
  renderLesson8();
}
function l8RenderDir(){
  const p = document.getElementById("pane-lesson");
  if(!p) return;
  document.documentElement.classList.toggle("no-guide-edit", !guideEditable());
  /* 2026-10-14 轮40 用户令「不要用"走过"这些，全删掉」：状态列与头行计数全删
     （句位落盘与续走不受影响）；轮41 曾按「目录不要简介」撤掉练习名摘要，
     用户复盘判定属「砍功能」过头，此处回退为轮40 终态：练习名摘要照显，只留课次+摘要。 */
  const rows = LESSON8.map(function(L){
    return '<button class="l8-dirrow" type="button" data-l8n="'+L.n+'">'
      + '<span class="dr-n">'+l8PosText(L.n)+'</span>'
      + '<span class="dr-sub">'+esc(l8DirSub(L))+'</span>'
      + '<span class="dr-ar">›</span></button>';
  }).join("");
  p.innerHTML = '<div class="l8-wrap">'
    + '<div class="l8-top"><span class="l8-dirh">'+esc(tx("八节课 · 目录"))+'</span></div>'
    + '<div class="l8-dir">'+rows+'</div></div>';
  p.querySelectorAll("[data-l8n]").forEach(function(b){
    b.onclick = function(){ l8Open(+b.dataset.l8n); };
  });
}
/* ── 练习目录（2026-10-14 轮40 用户令「练习部分也要目录那样，不要用"走过"这些，全删掉」）──
   多练习的课（第 6 课六个、第 15/16 课各两个…）原来在课内挂一排横滚 chip＋条数角标：
   放不下被裁、还带着计数（用户报「这样不好看，后面看不见了」）。现在改目录式，
   与八课目录屏同一套规矩：
   ① 课内一条 opener 细条（.l8-pdir-b）——点开全屏练习目录（l8Mode="pdir"）；
   ② 全屏目录一行一个练习竖排，当前高亮，没有角标；
   ③ 全表层（.l8-sheet）里的竖排行同②——从释放屏也能跳去别的练习。
   三个部件共用下面这四颗：prList 列练习、refMap/curPrs 认当前、jumpPr 跳转。 */
function l8PrList(L){
  const arr = [];
  L.guide.forEach(function(g, gi){
    if(g.pr && arr.map(function(x){ return x.pr; }).indexOf(g.pr) < 0) {
      arr.push({ pr: g.pr, gi: gi });
    }
  });
  return arr;
}
/* write 屏的 pr 反查它落在哪几张 (sid,g)：释放屏（ref）要认「我现在放的是哪个练习」
   靠这张表；一个填写屏同时填两栏的（喜欢/不喜欢…）两栏各自的练习名都认。 */
function l8RefMap(L){
  const mp = {};
  L.guide.forEach(function(g){
    if(g.ws && g.pr) (g.ws.gs || []).forEach(function(gi){ mp[g.ws.sid + "|" + gi] = g.pr; });
    if(g.ref && g.pr) mp[g.ref.sid + "|" + g.ref.g] = g.pr;  /* 升板块：释放屏高亮对应练习 */
  });
  return mp;
}
/* 当前屏（第 at 句）属于哪个/哪几个练习：可能两个（一个填写屏填两栏的）。 */
function l8CurPrs(L, at){
  const st = L.guide[at];
  const s = {};
  if(!st) return s;
  const refMap = l8RefMap(L);
  if(st.t === "write" && st.pr){
    s[st.pr] = 1;
    if(st.ws) (st.ws.gs || []).forEach(function(gi){
      const p = refMap[st.ws.sid + "|" + gi]; if(p) s[p] = 1;
    });
  }else if(st.ref){
    const mp = refMap[st.ref.sid + "|" + st.ref.g]; if(mp) s[mp] = 1;
  }
  return s;
}
/* 跳去某个练习（2026-10-10 用户令「释放的时候可以突然自由切换」）：
   已填写过就直接进它的释放面继续放；没填写才进填写屏。
   目录行（全屏目录与全表层）都走这一颗；从目录跳＝回课内那一句。 */
function l8JumpPr(gi){
  const L = LESSON8[Math.min(Math.max(l8cur,1),8)-1];
  const wst = L.guide[gi];
  let target = gi;
  if (wst && wst.ws) {
    const filled = (wst.ws.gs || []).some(function(gx){
      return wsLive(wst.ws.sid).some(function(it){ return it.g === gx && it.text; });
    });
    if (filled) {
      for (let k = gi + 1; k < L.guide.length; k++) {
        const g2 = L.guide[k];
        /* 边界只认「真填写屏」(write 且不带 sel 的识别屏) 和 say 收尾步——
           2026-10-12 修：识别屏也是 t:"write"（带 sel:true），旧判据把它当成填写屏
           提前 break，导致点已填行的练习只会退回填写屏、进不了释放面。 */
        if ((g2.t === "write" && !g2.sel) || g2.t === "say") break;
        if (g2.ref && g2.ref.sid === wst.ws.sid) { target = k; break; }
      }
    }
  }
  _l8Loop[L.n + "-" + target] = 0;
  l8i = target;
  l8Mode = "lesson";
  renderLesson8();
}
/* 全屏练习目录：一行一个练习，当前在放的那个高亮；右侧报这是第几课的练习。
   没有计数角标、没有「走过」——目录不是进度台账，是入口（同八课目录屏）。 */
function l8RenderPdir(){
  const p = document.getElementById("pane-lesson");
  if(!p) return;
  const L = LESSON8[Math.min(Math.max(l8cur,1),8)-1];
  const curPrs = l8CurPrs(L, Math.min(l8i, L.guide.length-1));
  const rows = l8PrList(L).map(function(x){
    return '<button class="l8-prow'+((curPrs[x.pr]) ? ' on' : '')+'" type="button" data-gi="'+x.gi+'">'
      + '<i class="pp-n">'+esc(tx(x.pr))+'</i>'
      + '<i class="pp-ar">›</i></button>';
  }).join("");
  p.innerHTML = '<div class="l8-wrap">'
    + '<div class="l8-top"><button class="l8-nav" id="l8-pdir-back" type="button">‹ '+esc(tx("返回"))+'</button>'
    + '<span class="l8-dirh">'+esc(tx("练习目录"))+'</span>'
    + '<span class="l8-dirst">'+esc(l8PosText(L.n))+'</span></div>'
    + '<div class="l8-pdir">'+rows+'</div></div>';
  p.querySelector("#l8-pdir-back").onclick = function(){ l8Mode = "lesson"; renderLesson8(); };
  p.querySelectorAll(".l8-prow").forEach(function(b){
    b.onclick = function(){ l8JumpPr(parseInt(b.getAttribute("data-gi"), 10) || 0); };
  });
}
function renderLesson8(){
  const p = document.getElementById("pane-lesson");
  if(!p) return;
  const L = LESSON8[Math.min(Math.max(l8cur,1),8)-1];
  const notes = l8Notes();
  const ed = l8Edits();
  const total = L.guide.length;
  /* 开发者模式关着时（2026-10-14 用户令）：根上挂个类，CSS 把虚线/文字光标一起收掉 */
  document.documentElement.classList.toggle("no-guide-edit", !guideEditable());
  if(l8Mode === "list"){ l8RenderDir(); return; }
  if(l8Mode === "pdir"){ l8RenderPdir(); return; }
  /* 课内每渲一次就把句位落盘：目录屏靠它显示「走到哪」，换页签/重载都不丢。 */
  l8PosSet(L.n, l8i);

  const top = '<div class="l8-top">'
    + '<button class="l8-nav key" id="l8-dir" type="button">‹ '+tx("目录")+'</button>'
    + '<button class="l8-reset" id="l8-reset" type="button">'+t("l8.restart")+'</button>'
    + '<span class="l8-pos">'+l8PosText(L.n)+'</span>'
    + '<button class="l8-nav" id="l8-prev" type="button"'+(L.n<=1?" disabled":"")+'>‹ '+t("l8.prev")+'</button>'
    + '<button class="l8-nav" id="l8-next" type="button"'+(L.n>=8?" disabled":"")+'>'+t("l8.next")+' ›</button>'
    + '</div>';

  /* ── 引导中：一句一屏 ── */
  const at = Math.min(l8i, total-1);
  const st = L.guide[at];
  const ek = L.n + "-" + at;
  const line = (ed[ek] !== undefined) ? ed[ek] : st.s;
  /* 英文界面下这一屏那句话走对照表（2026-10-14 轮45）：渲染只认 lineUi，开发者模式那颗钮递出去的仍是 line（中文原句），改完不会把英文存成课程正文。 */
  const lineUi = tx(line);
  /* 释放屏全表层开关（2026-10-13 E1）：换句/换课即收层——层是给这一句开的，
     走到下一句就该关；同一句里删/清空重渲，键没变，层保持开着不闪没。 */
  if(window.__l8sheetKey !== L.n + "-" + at) window.__l8sheet = false;
  window.__l8sheetKey = L.n + "-" + at;
  /* 最后一句没有「下一句」可点：那句之后就是「结束」。2026-10-09 收工不再换屏以后，
     这一句底下若还挂一颗「下一句」，点了原地不动＝死钮。出口只有底下那两颗。 */
  const isLast = at >= total - 1;
  /* 顶部第二行（2026-10-14 深夜）：左边「第 X / Y 句」，右边一组操作钮。
     原先这里是一根进度条占掉大半行——用户令撤掉，位置没必要再说一遍（见 CSS 那条注释）。 */
  const head = '<div class="l8-barrow">'
    + '<span class="l8-stepn">'+l8StepText(l8i, total)+'</span>'
    + (guideEditable() && l8EdCount(L.n, ed) ? '<button class="l8-edn" id="l8-edn" type="button">'+l8EdnText(l8EdCount(L.n, ed))+'</button>' : '')
    + '</div>';

  /* 练习目录三件套（2026-10-14 轮40：横排 chip 退役，逻辑提到 l8PrList/l8RefMap/l8CurPrs
     四颗共享函数——全屏目录与全表层也要用）：
     本课有哪些练习、当前屏属于哪个/哪几个练习（一个填写屏填两栏的两个都亮）。 */
  const prList = l8PrList(L);
  const refMap = l8RefMap(L);
  const curPrs = l8CurPrs(L, at);
  /* 全表层里的竖排练习行（2026-10-14 轮40）：从释放屏也能点行跳去别的练习。
     一行一个、当前高亮、没有条数角标——角标是「计数」，用户令全删。 */
  const prRows = (prList.length >= 2)
    ? '<div class="l8-prows">' + prList.map(function(x){
        return '<button class="l8-prow'+((curPrs[x.pr]) ? ' on' : '')+'" type="button" data-gi="'+x.gi+'">'
          + '<i class="pp-n">'+esc(tx(x.pr))+'</i>'
          + '<i class="pp-ar">›</i></button>';
      }).join("") + '</div>'
    : "";
  /* 课内 opener 细条（2026-10-14 轮40）：一条一行字，点开全屏练习目录。
     右侧报「当前在放哪个」；认不出所属（有些句不属于任何练习）就报这一课几个练习。 */
  const prDirBtn = (prList.length >= 2)
    ? (function(){
        const names = Object.keys(curPrs);
        const cur = names.length
          ? pick("当前："+names[0], "Current: "+tx(names[0]))
          : pick("这一课 "+prList.length+" 个练习", prList.length+" practices in this lesson");
        return '<button class="l8-pdir-b" id="l8-pdir-b" type="button">'
          + '<i class="pp-bt">'+esc(tx("练习目录"))+'</i>'
          + '<i class="pp-bc">'+esc(cur)+'</i>'
          + '<i class="pp-ba">›</i></button>';
      })()
    : "";
  /* 全表数据（2026-10-13 E1）：释放屏与填写/识别屏共用同一批部件——rows 按栏列条目
     （当前栏高亮），foot 是「清空这个练习 · N 条」。填写/识别屏＝内联速览卡（摘要行+展开）；
     释放屏＝常显胶囊＋全表层，原「正在放」绿卡和两级「展开」一并撤掉——
     胶囊报「正在放哪个练习·全表几条」，点开一层就是全表，不再于两处列同一批条目。 */
  const ovSid = (st.ws && st.ws.sid) || (st.ref && st.ref.sid) || "";
  const ovG = (st.ref ? st.ref.g : -1);
  const prName = (st.ref && refMap[st.ref.sid + "|" + st.ref.g]) || "";
  const ovParts = (function(){
    if(!ovSid) return null;
    const meta = SHEETS.filter(function(x){ return x.id === ovSid; })[0];
    if(!meta) return null;
    const live = wsLive(ovSid);
    if(!live.length) return null;              /* 一张都没写：没什么可总览，别占地方 */
    const gs = meta.groups || [meta.name];
    /* 本练习＝这张表里的哪几栏：清空粒度落在这里，不能照整张表扫
       （练习6/7 同在 goal 表各占一栏、练习8/9/13 同在 remember 表各占一栏）。 */
    const exerGs = (function(){
      if(st.ws && st.ws.sid === ovSid) return (st.ws.gs || []).slice();
      for(let k = at; k >= 0; k--){
        const g = L.guide[k];
        if(g && g.ws && g.ws.sid === ovSid) return (g.ws.gs || []).slice();
      }
      return (st.ref && typeof st.ref.g === "number") ? [st.ref.g] : [];
    })();
    const inExer = function(it){ return exerGs.indexOf((typeof it.g === "number") ? it.g : 0) >= 0; };
    let total = 0, mine = 0;
    const rows = gs.map(function(gname, gi){
      const its = live.filter(function(it){ return it.g === gi; });
      total += its.length;
      return '<div class="l8-ov-g'+((gi === ovG) ? ' cur' : '')+'">'
        + '<i class="l8-ov-gn">'+esc(tx(gname))+'</i>'
        + '<i class="l8-ov-gc">'+(its.length ? pick(its.length + ' 条', its.length + ' entries') : tx('还没写'))+'</i>'
        + (its.length
            ? its.map(function(it){
                mine += inExer(it) ? 1 : 0;
                return '<div class="l8-ov-row"><div class="l8-ov-it">'+esc(it.text)+'</div>'
                  + '<button class="l8-ov-del" type="button" data-sid="'+esc(ovSid)+'"'
                  + ' data-k="'+esc(wsKeyOf(it))+'" aria-label="'+esc(tx("删掉这一条"))+'" title="'+esc(tx("删掉这一条"))+'">'+esc(tx("删"))+'</button></div>';
              }).join("")
            : '')
        + '</div>';
    }).join("");
    const foot = mine
      ? '<div class="l8-ov-foot"><button class="l8-ov-clr" type="button" data-sid="'+esc(ovSid)+'"'
        + ' data-gs="'+esc(exerGs.join(","))+'" data-n="'+mine+'">'+pick('清空这个练习 · ', 'Clear this practice · ')+mine+pick(' 条', ' entries')+'</button></div>'
      : '';
    return { sid: ovSid, meta: meta, total: total, rows: rows, foot: foot };
  })();
  /* 填写/识别屏：内联速览卡（摘要行＝表名＋条数，点开按栏列全表；展开态存 __l8ov） */
  const ovHtml = (ovParts && st.t !== "ask") ? (function(){
    const open = (window.__l8ov && window.__l8ov[ovParts.sid]) ? ' on' : '';
    return '<div class="l8-ov'+open+'" data-sid="'+esc(ovParts.sid)+'">'
      + '<button class="l8-ov-sum" type="button">'
      + '<i class="l8-ov-t">'+esc(tx(ovParts.meta.name))+'</i>'
      + '<i class="l8-ov-n">'+pick(ovParts.total+' 条', ovParts.total+' entries')+'</i>'
      + '<i class="l8-ov-ar">'+esc(tx(open ? '收起' : '展开'))+'</i></button>'
      + '<div class="l8-ov-body">'+ovParts.rows+ovParts.foot+'</div></div>';
  })() : "";
  /* 释放屏：胶囊常显；点开出全表层（chips＋全栏条目＋删/清空都在层里）。
     层开着时重渲（删/清空）保持开着；换句由句键自动收。 */
  const askSheet = (st.t === "ask" && !!ovParts);
  const pillHtml = askSheet
    ? '<div class="l8-pillrow"><button class="l8-pill" id="l8-pill" type="button" aria-expanded="'
      + (window.__l8sheet ? "true" : "false") + '">'+tx("正在放：")
      + esc(tx(prName || ovParts.meta.name)) + ' · ' + pick(ovParts.total + ' 条', ovParts.total + ' entries') + ' <i>'
      + (window.__l8sheet ? "▴" : "▾") + '</i></button></div>'
    : "";
  const sheetHtml = (askSheet && window.__l8sheet)
    ? '<div class="l8-sheet-scrim" id="l8-sheet-scrim"></div>'
      + '<div class="l8-sheet" id="l8-sheet" role="dialog" aria-label="'+esc(tx("全表"))+'">'
      + '<div class="l8-sh-h"><i class="l8-sh-t">'+esc(tx("全表"))+' · '+esc(tx(ovParts.meta.name))+'</i>'
      + '<button class="l8-sh-x" id="l8-sheet-x" type="button">'+esc(tx("完成"))+'</button></div>'
      + prRows + ovParts.rows + ovParts.foot + '</div>'
    : "";
  let body = '<div class="l8-card w"><div class="l8-line" id="l8-line">'+esc(lineUi)+'</div></div>';
  if(st.t === "ask"){
    /* 九大情绪那一排顺序固定（2026-10-12 用户口径：「除了九大情绪的顺序，其他选项的顺序都要可以长按拖动」）：
       这一屏整排都是情绪表上的名字，就不给拖序的组键——按结构认，不按第几课认。 */
    const emoRow = st.o && st.o.every(function(x){ return EMO_ORDER().indexOf(x) >= 0; });
    body = pillHtml
      + '<div class="l8-card q"><div class="l8-line" id="l8-line">'+esc(lineUi)+'</div></div>'
      + '<div class="l8-opts"'+(emoRow ? '' : ' data-sort-group="l8-'+L.n+'-'+at+'"')+'>'
      + (emoRow ? st.o : applyOrder("l8-"+L.n+"-"+at, st.o, function(x){ return x; })).map(function(x){ return '<button class="l8-opt" type="button" data-o="'+esc(x)+'"'+(emoRow ? '' : ' data-sort-key="'+esc(x)+'"')+SORT_TITLE+'>'+esc(tx(x))+'</button>'; }).join("")
      + '</div>';
  }else if(st.t === "write"){
    /* write 步挂输入框：每一课的第 1 句都是 write 步（2026-10-09 用户口径：
       「每节课第一个地方都要有个输入框」），课中真叫人写下来的那几句照旧挂。
       2026-10-10 起按用户令「输入框部分可以根据具体的工作本来制定」分两种：
       带 ws 字段的＝按那张工作本表的组来出框（一行一条，走下去自动落进工作本，
       与工作本页签同源）；没带 ws 的（写感受那两句）仍走随手记。 */
    const k = L.n + "-" + l8i;
    if(st.ws){
      const meta = SHEETS.filter(x=>x.id === st.ws.sid)[0];
      /* 2026-10-13 精简（用户问「排版是否太累赘」）：原来这里单独一行「写进工作本「X」这张表」，
         与下面速览摘要行说的是同一件事；表名挪进摘要行，这一行删掉——填写屏少一块，少 21px。 */
      let inner = '<div class="l8-card w"><div class="l8-line" id="l8-line">'+esc(lineUi)+'</div></div>';
      if(st.ws.topic){
        inner += '<div class="l8-ws-grp"><i class="l8-ws-gn">'+esc(tx("主题"))+'</i>'
          + '<input id="l8-ws-topic" class="l8-in" value="'+esc(topicOf(st.ws.sid))+'"'
          + ' placeholder="'+esc(tx(st.ph || "这张表的主题"))+'"></div>';
      }
      /* 2026-10-13（用户报「一个练习有多方面的释放，排版有点不好看」）：一个练习含多个方面时
         （喜欢/不喜欢、想要/不想要、三栏方式…）把各面包进两栏并排的卡片容器，每个方面一张完整卡片；
         桌面以下（手机主战场）grid 自动回落单列，不会挤。 */
      const gsN = (st.ws.gs || []).length;
      if(gsN >= 2) inner += '<div class="l8-ws-grps">';
      (st.ws.gs || []).forEach(function(gi, gix){
        const gname = (meta && meta.groups && meta.groups[gi]) ? meta.groups[gi] : pick("第"+(gi+1)+"栏", "Column "+(gi+1));
        const ph = tx(gix === 0 ? (st.ph || "一行一条，写完点保存进工作本") : "一行一条");
        /* 写屏只留输入框（2026-10-10 用户令「八节课里不要留这些记录」）：

function l8step(d){
  const L = LESSON8[Math.min(Math.max(l8cur,1),8)-1];
  const total = L.guide.length;
  l8i += d;
  /* 推到底不换屏，人停在最后一句（末格是问句，出口＝底下那两颗（‹ 上一句／结束））。 */
  if(l8i >= total) l8i = total - 1;
  renderLesson8();
}
/* 换课的唯一入口（2026-10-12 轮20）：顶部‹上一课/下一课›两颗钮和左右滑手势都走这，
   滑动只是把「点钮」换成「划一下」。清的是**目标课**的 loop 计数——进一课从零起放，
   和原来两颗钮的行为一致（原来 clearLoops(l8cur±1) 清的就是目的地）。 */
function l8Goto(n){
  n = Math.min(Math.max(n,1),8);
  if(n === l8cur) return false;
  Object.keys(_l8Loop).forEach(function(k){ if(k.indexOf(n+"-")===0) delete _l8Loop[k]; });
  l8cur = n; l8i = 0;
  renderLesson8();
  return true;
}
function bindNav(p, L){
  /* 清 loop 计数只在真换课的时刻（2026-10-12 抓到的真 bug：原来写在 bindNav 里
     每次渲染都清，答完第 1 轮回识别屏渲染一次计数就被清掉，times 永远到不了 3，
     一面无限循环；点「从头」的清零在 #l8-reset 自己的 onclick 里）。 */
  const pre=p.querySelector("#l8-prev"), nxt=p.querySelector("#l8-next");
  if(pre) pre.onclick = function(){ l8Goto(l8cur-1); };
  if(nxt) nxt.onclick = function(){ l8Goto(l8cur+1); };
  /* 回目录（2026-10-14）：先把这一课走到第几句落盘，目录上才有得报 */
  const d = p.querySelector("#l8-dir");
  if(d) d.onclick = function(){ l8PosSet(l8cur, l8i); l8Mode = "list"; renderLesson8(); };
}

    + '<p class="bak-sub">哪儿别扭、想加什么、哪一步卡住了 —— 一句就够。</p>'
    + '<div class="field"><textarea id="fb-text" class="goalbox bak-fb" maxlength="500" placeholder="写清楚就行（登录后才能送到）"></textarea></div>'
    + '<div class="btnline"><button class="act" id="fb-send">发送给作者</button></div>';
  const x = el.querySelector("#fb-x");
  if(x) x.onclick = ()=>el.classList.add("hidden");
  const fbPost = async (text) => {
    const cfg = window.RELEASE_SYNC_CFG || {};
    const env = String(cfg.ENV || "").trim();
    const region = String(cfg.REGION || "ap-shanghai").trim();
    const url = env
      ? `https://${env}.${region}.tcb.cloudbase.net/release-fb`
      : "https://release-fb.ap-shanghai.tcb.cloudbase.net/release-fb";
    const res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.code || "没发出去");
    return data;
  };

  const fbs = el.querySelector("#fb-send");
  if(fbs) fbs.onclick = async ()=>{
    const ta = el.querySelector("#fb-text");
    if(!ta) return;
    fbs.disabled = true;
    try{
      await fbPost(ta.value);
      ta.value = "";
      el.classList.add("hidden");
      toast("已送到作者手里，谢谢你");
    }catch(e){
      toast((e && e.message) || "没发出去");
    }finally{
      fbs.disabled = false;
    }
  };
  const t = el.querySelector("#fb-text");
  if(t) setTimeout(()=>t.focus(), 120);
}

/* ---------- App 里「检查更新」的结果怎么递到眼前 ----------
   壳在启动 2.5s／4s 各自动查一次（壳＋内容热更），人点「检查更新」再各查一次，
   结果都递回这两个回调。2026-10-14 轮43 用户令「检查更新不要跳出绿色横幅了」：
   那条 sticky 在顶栏下沿的绿横幅整块撤走。结果只剩三个去处，都不占屏幕：
     · 按钮那一行字（已是最新／有新版）——钮本身就是那颗入口，写着「有新版」时
       再点一次，壳自己弹系统对话框问要不要装；
     · 壳那头的 Toast：MainActivity 每次回传都 toast 一句，页面再弹一条是重复；
     · 真换了内容时壳直接换根刷新（MainActivity runContentCheck 里「已更新到 code」
       那条分支），所以 __atWeb 只在没换成（ok=false）时开口。
   延后语义没丢：「这次先不升」「这版不升」＝关壳那个对话框里点「以后再说」
   （壳自己记 skip_code，静默查就不再拦路）。原先横幅那两颗钮是同一件事的页面版，
   横幅撤了它们没有去处，一并撤。 */
window.__atUpd = function(text, ok){
  updLabel(ok ? "已是最新" : "有新版", ok ? "fresh" : "");
  const b = document.getElementById("btn-upd");
  if(b) b.title = text || "";
};
window.__atWeb = function(text, ok){
  if(text && !ok) toast(text);
};
(function(){
  const b = document.getElementById("btn-upd");
  if(!b) return;
  b.hidden = !IN_APP;
  if(IN_APP) b.onclick = askUpdate;
})();

/* 页签键盘导航：左右方向键在五个页签间走并选中，Home/End 到头（WAI-ARIA tabs 惯例） */
document.querySelector(".tabs").addEventListener("keydown", e=>{
  const tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  const i = tabs.indexOf(document.activeElement);
  if(i < 0) return;
  let n = null;
  if(e.key==="ArrowRight") n = (i+1)%tabs.length;
  else if(e.key==="ArrowLeft") n = (i-1+tabs.length)%tabs.length;
  else if(e.key==="Home") n = 0;
  else if(e.key==="End") n = tabs.length-1;
  if(n===null) return;
  e.preventDefault();
  tabs[n].focus();
  tabs[n].click();
});
