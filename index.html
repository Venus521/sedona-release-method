<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e2d3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%234f6f45'/%3E%3C/svg%3E">
<title>释放法 · 自走引导</title>
<script>
/* 开场就定主题：手动选过（release-look-v1，与下方 LS_LOOK 同 key）用固定的；没选过跟随系统深浅，
   避免深色系统用户每次先闪一屏纸色。
   这段必须在 <head> 里内联跑，页面一渲染就得有颜色，不能等主脚本 —— 代价是主题色（meta
   theme-color）的判断在下方的 paintThemeColor() 里还有一份，改主题列表时两处都要动。 */
(function(){try{var l=localStorage.getItem("release-look-v1");
var t=(l==="paper"||l==="mist"||l==="ink")?l:((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"ink":"paper");
document.documentElement.dataset.theme=t;
var m=document.querySelector('meta[name="theme-color"]');
if(m) m.setAttribute("content", t==="ink"?"#0d0f13":(t==="mist"?"#dde6ef":"#e9e2d3"));
}catch(e){}})();
</script>
<style>
:root{
  --r:16px; --r-sm:11px;
/* 间距尺：4px 一档。问句与选项、钮与钮的留白只走这六档。 */
  --sp-0:4px; --sp-1:8px; --sp-2:12px; --sp-3:16px; --sp-4:20px; --sp-5:24px;
  --fs-q:clamp(24px,4.4vw,42px);
  --fs-o:clamp(17px,2.3vw,22px);
  /* 字号阶梯（2026-10-04）：原先全文件 70 处 font-size 是硬编码 px，想整体放大只能一处一处改。统一到这里后改一格就全站生效。 */
  --fs-micro:11px;
  --fs-cap:12px;
  --fs-note:13px;
  --fs-sm:14px;
  --fs-md:15px;
  --fs-lg:16px;
  /* 2026-10-04 补最后四档：原先品牌名/大数字/云同步主钮/外观预览小字还是硬编 px。
     断点不再各写一条规则，只改 --fs-title 与 --fs-stat 这两个档位。 */
  --fs-title:19px;
  --fs-stat:26px;
  --fs-cta:17px;
  /* 2026-10-05：剩下三处字面 clamp 也归进变量（九格情绪钮／主推钮／手机主问句）。闸门从此判「CSS 里不许出现字面字号」，改一处档位全站跟着走。 */
  --fs-emo:clamp(16px,2vw,19px);
  --fs-prime:clamp(18px,2.6vw,24px);
  --fs-qn:clamp(26px,7.6vw,38px);
  /* 氛围层回退值：三主题各自覆盖；自定义色盘未提供时取这里 */
  --sheen:rgba(255,255,255,.55);
  --glow:rgba(79,111,69,.07);
  --shadow:rgba(42,35,23,.10);
}
html[data-theme="paper"]{
  color-scheme:light;
  --bg:#e9e2d3; --bg2:#e0d8c6; --card:#fffaf0; --card2:#f7f0e2;
  --ink:#2a2317; --muted:#6f634e; --line:#d5c8ae;
  --accent:#4f6f45; --accent-ink:#ffffff; --accent-soft:#e3ecd9; --accent-line:#9db488;
  --sheen:rgba(255,255,255,.55); --glow:rgba(79,111,69,.07); --shadow:rgba(42,35,23,.10);
  --btn:#f3ecdc; --btn-line:#c9b994; --btn-ink:#3a3222;
  --warn:#9d4417; --good:#4f6f45; --danger:#b23a17;
}
html[data-theme="mist"]{
  color-scheme:light;
  --bg:#dde6ef; --bg2:#d2deea; --card:#fafdff; --card2:#eef5fb;
  --ink:#17293c; --muted:#52708a; --line:#bfd3e3;
  --accent:#2a6ba6; --accent-ink:#ffffff; --accent-soft:#dbeaf9; --accent-line:#8fb6da;
  --sheen:rgba(255,255,255,.60); --glow:rgba(42,107,166,.08); --shadow:rgba(23,41,60,.10);
  --btn:#e9f2fa; --btn-line:#adc6dc; --btn-ink:#1c3549;
  --warn:#a8306a; --good:#2a7f6a; --danger:#c01f4f;
}
html[data-theme="ink"]{
  color-scheme:dark;
  --bg:#0d0f13; --bg2:#141821; --card:#1b2028; --card2:#232a34;
  --ink:#e8eef6; --muted:#8fa0b4; --line:#333c48;
  --accent:#d3a625; --accent-ink:#14100a; --accent-soft:#2b2618; --accent-line:#6d5c28;
  --sheen:rgba(255,255,255,.04); --glow:rgba(211,166,37,.05); --shadow:rgba(0,0,0,.45);
  --btn:#262d38; --btn-line:#414b5a; --btn-ink:#dce5f0;
  --warn:#e2735f; --good:#6cb48c; --danger:#ff7a66;
}
*{box-sizing:border-box;touch-action:manipulation}
body{
  margin:0; overscroll-behavior-y:contain;
  background:
    radial-gradient(900px 520px at 88% -120px, var(--glow), transparent 70%),
    radial-gradient(760px 480px at -120px 100%, var(--glow), transparent 70%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  color:var(--ink); min-height:100vh;
  font-family:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif; font-size:var(--fs-lg); line-height:1.65;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  /* 2026-10-14 用户圈顶栏报「太多空白」：竖向衬从 8px 收到 5px——顶栏本就只有一行内容，
     衬太厚整条显得又高又空；品牌印章 20px＋一行字本身只需要 ~30px 高。 */
  padding:max(5px, env(safe-area-inset-top)) 14px 5px; border-bottom:1px solid var(--line);
  background:var(--card);
  /* 2026-10-14 用户令「顶部不要固定」：顶栏跟着页面一起滚走，不再吸顶。 */
  box-shadow:0 1px 0 var(--sheen) inset;
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .bar{background:color-mix(in srgb, var(--card) 86%, transparent);
       -webkit-backdrop-filter:blur(12px) saturate(1.05); backdrop-filter:blur(12px) saturate(1.05)}
}
.brand{margin:0; font-size:17px; letter-spacing:.06em; font-weight:700; white-space:nowrap;
  display:flex; align-items:center; gap:8px}
/* 印章式印记：一颗方寸「释」，给顶栏一个可记住的视觉锚点 */
.brand::before{
  content:"释"; flex:0 0 auto; width:20px; height:20px; border-radius:6px;
  background:var(--accent); color:var(--accent-ink);
  font-size:var(--fs-note); font-weight:700; letter-spacing:0; line-height:1;
  display:grid; place-items:center;
}
.brand small{display:block;font-size:var(--fs-cap);letter-spacing:.14em;color:var(--muted);font-weight:400;white-space:nowrap}
.bar .grow{flex:1}
.looks{display:flex; gap:10px; flex-wrap:wrap}
/* 顶栏一颗「外观」入口，抽屉里才是预览：四款＋跟随系统并排，每款渲染自己的纸底、示例字与主色钮。
   原来五颗挤在顶栏、预览字 10px 还被裁掉 41%，等于把款式名当成款式发给用户。
   10-14 又收了一刀：示例字下面那条 1px 规线和「回上一步」那颗次级钮一起删了——改前实测每格预览
   99 高、分三层（示例字 22／规线 1／那一行钮 35），改后 76 高、两层（示例字 20＋主色钮 33），
   卡片 143→120、网格 448→379（393×851 实拍；「还有剩余吗」每格照旧只画一遍，全抽屉 6 遍没变）。
   用户说「外观部分也要简单点」；一款就一行示例字＋一颗主色钮，纸底／字色／主色三样信息一样没少。 */
/* 圆角 9px → var(--r-sm)：顶栏这颗「外观」与八课课次导航、底部页签统一到一个族
   （2026-10-14 用户报顶部不统一，见 .l8-top 那条注释）。 */
.lookbtn{display:flex; align-items:center; gap:5px; font:inherit; font-size:var(--fs-note); min-height:26px;
  padding:2px 9px; border-radius:var(--r-sm); cursor:pointer; background:var(--card2);
  border:1.5px solid var(--line); color:var(--ink); white-space:nowrap}
.lookbtn:hover{border-color:var(--accent-line)}
.lookbtn[aria-expanded="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.lookbtn .lb-n{color:var(--muted); font-size:var(--fs-note)}
.lb-sw{flex:0 0 auto; width:12px; height:12px; border-radius:4px; border:1px solid var(--line)}
.lb-sw[data-l="paper"]{background:#e9e2d3}
.lb-sw[data-l="mist"]{background:#dde6ef}
.lb-sw[data-l="ink"]{background:#0d0f13}
.lb-sw[data-l="custom"]{background:var(--bg)}
.lb-sw[data-l="sys"]{background:linear-gradient(90deg,#e9e2d3 0 50%,#0d0f13 50% 100%)}
.look-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(172px,1fr)); gap:12px; margin:14px 0 4px}
/* 开发者模式（2026-10-14 用户令：一个 APK 里自由切用户版／开发者版）：
   外观面板底部一行开关，药丸样式跟 aria-pressed 走，不另存状态。 */
.lk-dev{display:flex; align-items:center; gap:10px; width:100%; margin:12px 2px 0; padding:11px 14px;
  box-sizing:border-box; font:inherit; font-size:var(--fs-note); font-weight:700; color:var(--ink);
  background:var(--card2); border:1px solid var(--line); border-radius:12px; cursor:pointer; text-align:left}
.lk-dev-n{flex:1}
.lk-dev-n i{font-style:normal; font-weight:400; color:var(--muted); margin-left:6px; font-size:var(--fs-micro)}
.lk-dev-pill{position:relative; flex:0 0 auto; width:42px; height:24px; border-radius:999px;
  background:var(--line); border:1px solid var(--line); transition:background .15s}
.lk-dev-pill::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px;
  border-radius:50%; background:var(--card); transition:transform .15s}
.lk-dev[aria-pressed="true"] .lk-dev-pill{background:var(--btn); border-color:var(--btn-line)}
.lk-dev[aria-pressed="true"] .lk-dev-pill::after{transform:translateX(18px)}
.lk-dev-sub{margin:6px 2px 0; font-size:var(--fs-micro); color:var(--muted); line-height:1.6}
/* 语言切换（2026-10-14 用户令「整个项目可以中英切换」）：外观面板里一行两颗钮，
   选中态跟 aria-pressed 走，样式与开发者模式那行保持一致的分量。 */
.lk-lang{display:flex; align-items:center; gap:8px; margin:12px 2px 0}
.lk-lang-n{flex:1; font-size:var(--fs-note); font-weight:700; color:var(--ink)}
.lk-langb{font:inherit; font-size:var(--fs-note); font-weight:700; padding:8px 18px; min-height:40px;
  color:var(--muted); background:var(--card2); border:1px solid var(--line); border-radius:999px; cursor:pointer}
.lk-langb[aria-pressed="true"]{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
.lk{font:inherit; text-align:left; cursor:pointer; padding:0; border-radius:14px; overflow:hidden;
  background:transparent; border:1.5px solid var(--line); display:flex; flex-direction:column}
.lk:hover{border-color:var(--accent-line)}
.lk[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.lk-pv{display:flex; align-items:center; gap:8px; padding:13px 12px; min-height:76px}
/* 预览示例字：中文「还有剩余吗」在 172px 的格子里本来就贴边，换成英文
   「Anything left?」更长，会把右边那颗「Yes」挤出格子（EN 态实拍见 2026-10-14）。
   兜底：允许收缩并省略，别撑破卡片；窄屏另降一档字号（见媒体查询）。 */
.lk-q{font-size:var(--fs-md); line-height:1.35; font-weight:700; white-space:nowrap;
  min-width:0; overflow:hidden; text-overflow:ellipsis}
.lk-p{margin-left:auto; flex:0 0 auto; font-size:var(--fs-note); padding:6px 12px; border-radius:8px; font-weight:700; white-space:nowrap}
.lk-name{display:block; padding:8px 12px; font-size:var(--fs-md); font-weight:600; color:var(--ink);
  background:var(--card2); border-top:1px solid var(--line)}
.lk-name i{font-style:normal; font-weight:400; color:var(--muted); font-size:var(--fs-note)}
.lk-pv[data-l="paper"]{background:#e9e2d3}
.lk-pv[data-l="paper"] .lk-q{color:#2a2317}
.lk-pv[data-l="paper"] .lk-p{background:#4f6f45; color:#f3ecdc}
.lk-pv[data-l="mist"]{background:#dde6ef}
.lk-pv[data-l="mist"] .lk-q{color:#17293c}
.lk-pv[data-l="mist"] .lk-p{background:#2a6ba6; color:#f2f7fc}
.lk-pv[data-l="ink"]{background:#0d0f13}
.lk-pv[data-l="ink"] .lk-q{color:#e8eef6}
.lk-pv[data-l="ink"] .lk-p{background:#d3a625; color:#14100a}
.lk-pv[data-l="custom"]{background:var(--bg)}
.lk-pv[data-l="custom"] .lk-q{color:var(--ink)}
.lk-pv[data-l="custom"] .lk-p{background:var(--accent); color:var(--accent-ink)}
/* 跟随系统：白天／夜里各画半张，每一张都带自己的示例字和主色钮——跟另外四款同一画法，
   不许出现「只有名字、没有成品」的那一格。393×851 实测半张 38 高（里头那颗主色钮 33，上下各留
   一口气），两张正好等于别款预览的 76，于是五张卡等高 120，两列网格不会有一格被拉伸。 */
.lk-sys{padding:0; gap:0; display:flex; flex-direction:column}
.lk-half{flex:1 1 50%; display:flex; align-items:center; gap:8px; padding:0 12px; min-height:38px}
.lk-half.l{background:#e9e2d3; border-bottom:1px solid #c9b994}
.lk-half.l .lk-q{color:#2a2317}
.lk-half.l .lk-p{background:#4f6f45; color:#f3ecdc}
.lk-half.d{background:#0d0f13; border-bottom:1px solid #414b5a}
.lk-half.d .lk-q{color:#e8eef6}
.lk-half.d .lk-p{background:#d3a625; color:#14100a}
/* 抽屉顶部只留一行：左边款名，右边收起。原来这里堆了大标题＋两段说明，
   五张预览被顶到第二屏，等于把「挑款式」变成了「先读说明书」 */
/* 出口常驻：浮层是能滚的定高盒子，标题栏跟着滚走＝「完成／收起」再也点不着
   （10-05 报「自定义外观之后无法退出」）。这条顶在窗口上，滚多远都伸手可得。
   top 不能写 0：抽屉的 padding-top 会把吸顶线压到内容框（实测停在 padding 下方 18px），
   那 18px 就成了抬头上面的一条缝，滚起来内容从缝里穿过去（10-07 报「设置条被穿过了」，
   手机 393 实测抬头带内 18 行随滚动变化）。顶沿按 --padt 抬回去，缝就没了（桌面/手机距顶 1px）。 */
.lk-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; position:sticky; top:calc(-1 * var(--padt, 0px)); z-index:2;
  background:var(--card); border-bottom:1px solid var(--line);
  margin:calc(-1 * var(--padt,0px)) calc(-1 * var(--padl,0px)) 12px; padding:var(--padt,0px) var(--padl,0px) 10px}
.lk-head .lk-h{font-size:var(--fs-cap); letter-spacing:.22em; color:var(--accent); font-weight:700}
.lk-head > .mini{margin-left:auto}
.lk-warn{flex:1 1 0; min-width:0; font-size:var(--fs-note); color:var(--muted); line-height:1.45}
.wp-sec{margin:0 0 16px}
.wp-cap{display:block; font-size:var(--fs-cap); letter-spacing:.18em; color:var(--accent); font-weight:700; margin:0 0 8px}
.wp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(216px,1fr)); gap:12px}
.wp-card{font:inherit; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:7px;
  padding:12px 13px; border-radius:14px; background:var(--card2); border:1px solid var(--line); color:var(--ink)}
.wp-card:hover{border-color:var(--accent-line)}
.wp-card[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.wp-ttl{font-size:var(--fs-md); font-weight:700}
.wp-ttl i{font-style:normal; font-weight:400; color:var(--muted); font-size:var(--fs-note)}
.wp-num{font-size:var(--fs-note); font-weight:700; color:var(--accent)}
.wp-card .wp-num{margin-top:auto}
.wp-note,.wp-lock{font-size:var(--fs-note); color:var(--muted); line-height:1.5; margin:0}
.wp-lock{margin-top:8px}
.wp-chips{display:flex; gap:6px; flex-wrap:wrap}
.wp-chips span{font-size:var(--fs-note); padding:4px 9px; border-radius:8px; white-space:nowrap;
  background:var(--btn); border:1px solid var(--btn-line); color:var(--btn-ink)}
.wp-modes{display:flex; gap:8px; flex-wrap:wrap}
.wp-row{display:flex; align-items:center; gap:7px; padding:6px 0; border-bottom:1px solid var(--line)}
.wp-row .rk{width:16px; font-size:var(--fs-note); color:var(--muted); font-weight:700; text-align:center}
.wp-row .nm{flex:1 1 auto; min-width:0; font-size:var(--fs-sm)}
.wp-row .wp-out{color:var(--muted); text-decoration:line-through}
/* 面板折叠：常用在外，微调折进（2026-10-08 减负） */
.wp-foldhead{display:flex; align-items:center; gap:10px; width:100%; font:inherit; cursor:pointer;
  background:transparent; border:0; border-top:1px solid var(--line); padding:12px 2px; margin:4px 0 0; text-align:left}
.wp-foldhead .fh-name{flex:0 0 auto; font-size:var(--fs-sm); font-weight:700; color:var(--ink)}
.wp-foldhead .fh-sum{flex:1 1 auto; min-width:0; font-size:var(--fs-note); color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right}
.wp-foldhead .fh-arr{flex:0 0 auto; font-size:var(--fs-note); color:var(--muted)}
.wp-foldhead[aria-expanded="true"] .fh-name{color:var(--accent)}
.wp-sub{padding:0 0 12px}
.wp-sub.hidden{display:none}

main{max-width:900px; margin:0 auto; padding:32px 22px 48px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:26px 28px 28px; box-shadow:0 1px 0 var(--sheen) inset, 0 14px 40px var(--shadow);
}
/* 引导步骤进场：随流程轻轻浮起，替代生硬的整屏跳变 */
#stage>*{animation:stageIn .24s ease both}
@keyframes stageIn{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
.tabs{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
/* 圆角 999px 胶囊 → var(--r-sm)：桌面档页签与卡片内的课次导航同屏并列（八课页就是），
   一个胶囊一个方角＝「不统一」最扎眼的一处（2026-10-14 用户报顶层导航不统一，
   桌面 1280 实拍坐实）。窄屏页签本来就是 11px（见窄屏媒体查询），这里反而是桌面在跑偏。
   至此全站两个圆角档：卡片 --r:16 / 控件 --r-sm:11，不再有第三种。 */
.tab{
  font:inherit; font-size:var(--fs-md); padding:8px 16px; border-radius:var(--r-sm); cursor:pointer;
  background:var(--btn); border:1.5px solid var(--btn-line); color:var(--btn-ink);
}
.tab:hover{border-color:var(--accent-line)}
.tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
/* rail：引导页抬头两段 —— 第一行目标句（整条就是一颗钮，点它＝再念一遍），第二行左计数右触点 */
/* 2026-10-08 顶部一行化：rail 只有一行，目标句也是行内一员，塞不下时目标句自己缩 */
/* 字距 .08em → .01em：这行是「1/13 · 复查 0 轮」这类数字短讯，
   .08em 把每个数字和间隔符都撑开，跟课次行同一个毛病（见 .l8-pos）。 */
.rail{margin:-2px 0 var(--sp-1); color:var(--muted); font-size:var(--fs-note); letter-spacing:.01em; display:flex; align-items:center}
.rail-bar{display:flex; align-items:center; gap:8px; flex-wrap:nowrap; min-width:0}
.rail b{color:var(--ink); font-weight:700}
.rail-count{margin-right:auto; white-space:nowrap; letter-spacing:.04em}
.rail-bar button{min-height:28px; min-width:0}
/* 目标句是 rail-bar 里的一颗钮（2026-10-08 顶部一行化）：单行截断，全文看 title */
.rail .g-line{font:inherit; text-align:left; cursor:pointer; min-width:0; letter-spacing:0; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:52px; max-width:44%; line-height:1.4;
  background:var(--accent-soft); border:1.5px solid var(--accent-line); color:var(--accent); border-radius:var(--r-sm); padding:3px 10px}
.rail .g-line:hover{border-color:var(--accent)}
.rail .g-line.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rail .clock{font-size:var(--fs-cap); letter-spacing:0; padding:3px 10px; border-radius:var(--r-sm); white-space:nowrap;
  background:var(--card2); border:1.5px solid var(--btn-line); color:var(--muted)}
.rail .clock b{font-family:ui-monospace,Consolas,monospace; font-size:var(--fs-note); font-weight:700; color:var(--ink)}
.rail .clock.live{border-color:var(--accent-line)}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--accent)}
.dot.off{background:transparent; border:1.5px solid var(--line)}
td.gcel{max-width:340px; overflow:hidden; white-space:normal;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
td.tcel{font-family:ui-monospace,Consolas,monospace; font-size:var(--fs-sm); white-space:nowrap}

.q{font-size:var(--fs-q); line-height:1.34; margin:0 0 var(--sp-1); letter-spacing:-.005em; font-weight:400;
  text-shadow:0 1px 0 var(--sheen); font-feature-settings:"kern" 1,"liga" 1;
  min-height:var(--qh, 0px)}
/* 题干区固定高度（2026-10-09，用户口径：「选项位置最好保持一致，每一步不用再花心思移动手指」）。
   原来题干一行就一行、三行就三行，底下第一颗选项跟着上下漂——同一次练习里手指要重新找位置。
   --qh 由 render() 在每次渲染后实测题干高度、取本会话最大值回写（见 stage.innerHTML 那段），
   这里只负责当第一道题之前的初值。短题那一步底下留白补齐，位置照样在同一条横线上。
   顺带一句：那些「选一个最接近的就好」的小字（.hint）也一并删了——它们挤在题干和选项中间，
   是让选项位置飘来飘去的另一个原因。 */
.q{min-height:var(--qh, 0px)}
.hint{color:var(--muted); font-size:var(--fs-md); margin:0 0 var(--sp-5); line-height:1.6; letter-spacing:.01em}
.kind{font-size:var(--fs-cap); letter-spacing:.26em; color:var(--accent); margin:0 0 var(--sp-1); font-weight:700; display:flex; align-items:center; gap:var(--sp-2)}
.kind::before{content:""; width:26px; height:1.5px; background:var(--accent-line); border-radius:2px; flex:0 0 auto}
.opts{display:flex; flex-direction:column; gap:var(--sp-2)}
.opts.grid{flex-direction:row; flex-wrap:wrap}
.opts.grid .opt{flex:1 1 210px}
/* 想要清单（认想要/再套一次）：一行一颗竖排，不再横竖混排 */
.opts.grid.wantsrow{flex-direction:column; flex-wrap:nowrap}
.opts.grid.wantsrow .opt{flex:0 0 auto; width:100%}
/* ── 三颗想要：长按就地拖顺序（2026-10-09 恢复自定义排序）──
   设置面板那一版退役了，但排序这件事本身用户要留着，改成手机上自然的办法：长按任一颗，拖到要去的位置。
   平时点一下还是「选中它、往下走」，长按满 480ms 才进排序，误触不到。 */
/* 原来这里有一整条 .sortbar：长按才浮出来的「按住一颗，拖到要去的位置 · 完成」横条。
   用户不要这块板子——它把「拖一下就完了」说成一件需要先宣布、再点确认的事。
   去掉横条不等于去掉功能：排序中的提示改成三颗自己亮起来（下面 .sorting 规则），
   退出也不再靠「完成」按钮，是松手就落盘、落盘就退出排序模式。 */
/* 排序中：整组禁掉页面滚动与选中，拖起来才不会带着页面一起滑。
   2026-10-12 通用化：选择器从 #want-row 挪到 [data-sort-group]，凡带这个属性的一排都吃同一套样式
   ——引导链的选项/芯片、八课每一屏的选项、卡住支线、三颗想要。九大情绪那九格不给这个属性，顺序固定。 */
[data-sort-group]{position:relative}
[data-sort-group].sorting{touch-action:none; user-select:none; -webkit-user-select:none}
[data-sort-group].sorting > *{cursor:grab}
/* 排序中的提示全靠这一圈描边 + 轻微放大：整排一起亮起来＝「现在可以拖了」。
   原来还有一条写着「按住一颗，拖到要去的位置」的横条，用户嫌它多，此处已删除。 */
[data-sort-group].sorting > [data-sortable]{box-shadow:0 0 0 2px var(--accent); transform:scale(1.02)}
[data-sort-group].sorting > .dragging{
  cursor:grabbing; position:relative; z-index:5; transition:none;
  box-shadow:0 10px 24px var(--shadow); opacity:.96}
/* 原位留一个虚线占位：拖着走的时候要看得见「它原来在这」，不然底下空一块像出了错。
   绝对定位，不占布局——占了会把整排挤下去，落点判定跟着偏。 */
[data-sort-group] .sort-ghost{
  position:absolute; z-index:1; pointer-events:none;
  border:2px dashed var(--accent-line); border-radius:var(--r-sm);
  background:var(--accent-soft); opacity:.55}
/* 九格一行一颗（2026-10-08 定规：这一屏的选项一律竖排，不再三列摊开） */
.opts.grid.emo{display:grid; grid-template-columns:1fr; gap:var(--sp-2)}
.opts.grid.emo .opt{width:100%; font-size:var(--fs-emo); padding:12px 13px; text-align:left; justify-content:flex-start; background:var(--btn); border:1.5px solid var(--btn-line)}
.opts.grid.emo .opt:hover{background:var(--accent-soft); border-color:var(--accent-line)}
/* 2026-10-08：循环选择不再高亮——点了就过，没有「当前格」的视觉驻留；aria 照发供读屏 */
.opts.grid.emo .opt[aria-pressed="true"]{background:var(--btn); border-color:var(--btn-line); color:var(--btn-ink); font-weight:400}
.opts.grid.emo .opt[aria-pressed="true"] .k{border-color:var(--btn-line); color:var(--muted)}
.rail .g-lv{font:inherit; font-size:var(--fs-cap); letter-spacing:0; padding:3px 10px; border-radius:var(--r-sm); cursor:pointer; white-space:nowrap;
  background:var(--card2); border:1.5px solid var(--btn-line); color:var(--muted)}
.rail .g-lv:hover{border-color:var(--accent-line); color:var(--accent)}
.rail .g-stuck{font:inherit; font-size:var(--fs-cap); letter-spacing:0; padding:3px 10px; border-radius:var(--r-sm); cursor:pointer; white-space:nowrap;
  background:var(--card2); border:1.5px solid var(--btn-line); color:var(--muted)}
.rail .g-stuck:hover{border-color:var(--warn); color:var(--warn)}
/* 全局浮层：卡住了面板 / 自定义色盘（顶栏与内容之上；手机从底部升起） */
/* 浮层底幕：六张浮层共用一张。没有它，浮层上下左右露出的那一圈会直接透出
   背后的内容（外观浮层开着的时候，「给作者反馈」那几行就叠在边上）。
   半透明到能看出底下、但底下读不出字，才像"退到后面去了"。 */
.scrim{position:fixed; inset:0; z-index:59; background:rgba(20,18,14,.42);
  opacity:0; pointer-events:none; transition:opacity .2s ease}
/* .on 才有 opacity 与点击；没开浮层时 pointer-events:none，不拦底下那颗按钮 */
.scrim.on{opacity:1; pointer-events:auto}
@media (prefers-color-scheme: dark){ .scrim{background:rgba(8,8,10,.58)} }
.sheet{position:fixed; top:8px; left:12px; right:12px; margin:0 auto; max-width:720px; max-height:min(80vh,760px); overflow:auto;
  z-index:70; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 22px 20px;
  --padt:18px; --padl:22px;
  box-shadow:0 16px 48px rgba(0,0,0,.22)}
.cpanel{position:fixed; top:8px; left:12px; right:12px; margin:0 auto; max-width:680px; max-height:min(80vh,760px); overflow:auto;
  z-index:70; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px 16px;
  --padt:14px; --padl:16px;
  box-shadow:0 16px 48px rgba(0,0,0,.22)}
/* 浮层入场：桌面淡入上浮，手机从底部升起（拇指区方向感一致） */
/* 入场动画只是增强。动画一旦被环境压掉（prefers-reduced-motion、或无头浏览器
   不放动画），浮层必须还是实心的 —— 否则它停在起始帧的半透明上，后面的字直接
   透出来。2026-10-06 用户报「玩法穿过去了」就是 animation:none 把浮层钉在
   opacity:.4。动画期间由 keyframes 接管，两端都是 1，不会透。 */
.sheet,.cpanel{animation:sheetIn .26s cubic-bezier(.2,.8,.25,1) both}
/* 入场动画的两端都从 1 起步。起始帧若写 .4 / 0，动画被环境压掉时
   浮层就永远停在那儿 —— 背后的字会透出来（2026-10-06 报的那次）。
   动效用 transform 表现，不靠透明度，视觉上照样是"升起"。 */
@keyframes sheetIn{from{opacity:1; transform:translateY(12px)} to{opacity:1; transform:none}}
@keyframes sheetUp{from{opacity:1; transform:translateY(46px)} to{opacity:1; transform:none}}
/* ── 工作本：一屏队列（换表走顶上那扇「‹ 目录」门 · 单输入框 · 点条目就地过链 · 答复落行下） ── */
.filepick{position:fixed; right:0; bottom:0; width:1px; height:1px; opacity:0; pointer-events:none; z-index:-1}

/* 工作本里走链：条目那一屏的时间行、进度行，以及链的宿主 */
.wb-fmeta{font-size:var(--fs-note); color:var(--muted); margin:6px 0 12px; font-variant-numeric:tabular-nums}
.wb-fmeta b{color:var(--ink); font-weight:700}
.wb-hist.wb-live{color:var(--accent)}
#ws-stage>*{animation:stageIn .24s ease both}
.wb-add{display:flex; gap:8px; align-items:flex-start}
.wb-add textarea{font:inherit; font-size:var(--fs-md); flex:1 1 auto; min-width:0; padding:10px 12px;
  border-radius:var(--r-sm); border:1.5px solid var(--btn-line); background:var(--card); color:var(--ink);
  resize:none; line-height:1.5; min-height:44px}
.wb-add textarea:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px var(--line)}
.wb-q{list-style:none; margin:12px 0 0; padding:0}
.wb-it{border-bottom:1px solid var(--line); padding:0}
.wb-main{display:flex; align-items:flex-start; gap:9px; padding:11px 0}
.wb-dot{flex:0 0 auto; width:9px; height:9px; border-radius:50%; margin-top:8px;
  border:1.5px solid var(--btn-line); background:transparent}
.wb-it[data-st="done"] .wb-dot{background:var(--accent); border-color:var(--accent)}
.wb-tx{flex:1 1 auto; min-width:0; font:inherit; font-size:var(--fs-md); text-align:left; cursor:pointer;
  background:transparent; border:0; color:inherit; padding:0; line-height:1.5}
.wb-it[data-st="done"] .wb-tx{color:var(--muted)}
.wb-tx:hover{color:var(--accent)}
.wb-tag{flex:0 0 auto; font-size:var(--fs-micro); padding:0 0 0 8px; border:0; background:transparent; color:var(--accent)}
/* 轮30（10-13）：填写屏条目行的「改／删」去边框变行尾小字——去掉表格那种方块列感（沿用 r29 速览卡思路）。
   删/清空本就走 armConfirm 两下确认，去边框不削弱安全性；手机端也不再是 44×44 大块。 */
.wb-act{flex:0 0 auto; display:flex; gap:12px; opacity:1}
.wb-it:hover .wb-act,.wb-it:focus-within .wb-act{opacity:1}
.wb-act .mini{border:0; background:transparent; color:var(--muted); padding:3px 4px; margin-right:0;
  font-size:var(--fs-micro); min-height:0; min-width:0; line-height:1.5}
.wb-act .mini:hover{color:var(--accent); background:transparent}
.wb-act .mini.armed{color:var(--warn); font-weight:700; background:transparent}
.wb-hist{font-size:var(--fs-note); color:var(--muted); margin:0 0 11px 21px}
.wb-hist b{color:var(--ink); font-weight:600}
/* 释放态：点条目本体＝整屏接管。释放链不再缩进行下方那一小块（那里问句只有 17px、
   底部还被固定底栏吃掉），而是沿用引导页那一档字阶，脚手架当场收起。 */
.wb-focus{margin:0}
.wb-fhead{display:flex; align-items:center; gap:9px; margin:0 0 13px; font-size:var(--fs-note); color:var(--muted)}
.wb-back{font:inherit; font-size:var(--fs-note); padding:7px 13px; border-radius:999px; cursor:pointer;
  background:var(--btn); border:1.5px solid var(--btn-line); color:var(--btn-ink)}
.wb-back:hover{border-color:var(--accent); color:var(--accent)}
.wb-fkind{letter-spacing:.1em; color:var(--accent); font-weight:700}
.wb-fstep{margin-left:auto; font-variant-numeric:tabular-nums}
.wb-ftext{font-size:var(--fs-lg); font-weight:600; line-height:1.5; margin:0 0 14px}
.wb-step{font-size:var(--fs-note); color:var(--muted)}
.wb-ffoot{margin-top:20px; padding-top:4px; border-top:1px dashed var(--line)}
.wb-mrow{font-size:var(--fs-note); color:var(--muted); margin-top:11px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.wb-mb{font:inherit; font-size:var(--fs-note); padding:11px 15px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:transparent; color:var(--ink)}
.wb-mb.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.wb-edit{margin:0 0 12px 21px}
.wb-edit input[type=text]{width:100%; font:inherit; font-size:var(--fs-md); padding:9px 11px; border-radius:var(--r-sm);
  border:1.5px solid var(--accent); background:var(--card); color:var(--ink)}
.wb-empty{font-size:var(--fs-note); color:var(--muted); padding:14px 0}

.wb-add .act{flex:0 0 auto; align-self:stretch}
.wb-hist{cursor:pointer}
.ladder{margin:8px 0 0; padding:0; list-style:none}
.ladder li{display:flex; gap:10px; align-items:baseline; padding:5px 0; border-bottom:1px dashed var(--line); font-size:var(--fs-md)}
.ladder li:last-child{border-bottom:0}
.ladder .n{font-family:ui-monospace,Consolas,monospace; font-size:var(--fs-cap); color:var(--muted); min-width:16px}
.ladder .lv{font-weight:700}
.ladder .sub{color:var(--muted); font-size:var(--fs-note)}
.opt{
  font:inherit; font-size:var(--fs-o); text-align:left; cursor:pointer;
  background:var(--btn); color:var(--btn-ink);
  border:1.5px solid var(--btn-line); border-radius:var(--r-sm);
  padding:15px 18px; display:flex; align-items:flex-start; gap:12px;
}
.opt:hover{border-color:var(--accent-line); background:var(--accent-soft); transform:translateY(-1px);
  box-shadow:0 8px 20px -12px var(--shadow)}
.opt .k{
  font-size:var(--fs-micro); color:var(--muted); border:1px solid var(--btn-line);
  border-radius:50%; width:22px; height:22px; padding:0; line-height:1; flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center; font-family:ui-monospace,Consolas,monospace;
}
/* 起手那两张卡：标题与说明各占一段，标题不再被副说明挤成两行 */
.opt .opt-txt{display:block; flex:1 1 auto; min-width:0}
.opt .ttl{display:block; font-weight:700; line-height:1.35; letter-spacing:.01em}
.opt.prime{font-size:var(--fs-prime); letter-spacing:.02em}
.chips{display:flex; gap:var(--sp-1); flex-wrap:wrap}
.chip{
  font:inherit; font-size:var(--fs-lg); padding:9px 17px; border-radius:999px; cursor:pointer;
  background:var(--btn); border:1.5px solid var(--btn-line); color:var(--btn-ink); letter-spacing:.01em;
}
.chip:hover{border-color:var(--accent-line); box-shadow:0 6px 16px -12px var(--shadow)}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700}
/* .opt .subline（选项下面那行「这一路 N 步」的路线说明）已随 2026-10-14 用户令撤掉，
   规则本身也删了；起手两卡现在一行到头：徽标 + 卡名。 */
/* 起手两卡上的定位徽标（推荐 / 新手推荐）：卡片标题上面那一枚小牌 */
.bdg{display:table; margin:0 0 5px; padding:2px 9px; border-radius:99px;
  font-size:var(--fs-micro); font-weight:700; letter-spacing:.06em; line-height:1.5;
  color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-line)}
.field{margin:var(--sp-1) 0}
.inrow-note{font-size:var(--fs-note); color:var(--muted)}
.field>label{display:block; font-size:var(--fs-note); letter-spacing:.14em; color:var(--muted); margin-bottom:var(--sp-0)}
/* 情绪一块、想要一块：两块各带自己的眉题，界面上不再混成一排词 */
.blk{margin:var(--sp-2) 0 0; padding:12px 14px 14px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--card2)}
.blk-h{font-size:var(--fs-note); letter-spacing:.16em; color:var(--accent); font-weight:700; margin:0 0 var(--sp-2)}
/* 子词区：一行小标题 + 等宽网格 + 限高盒，不再是一整面标签墙 */
.sw{margin:var(--sp-4) 0 0}
.sw-head{display:flex; align-items:baseline; gap:var(--sp-2); margin:0 0 var(--sp-1); flex-wrap:wrap}
.sw-name{font-size:var(--fs-cap); letter-spacing:.18em; color:var(--accent); font-weight:700; white-space:nowrap}
.sw-note{font-size:var(--fs-note); color:var(--muted)}
/* 选定后九大情绪表整块收起，只留这一颗回到格子的入口；动作钮静止态要有底色+描边 */
.sw-swap{font:inherit; font-size:var(--fs-note); margin-left:auto; cursor:pointer; white-space:nowrap;
  background:var(--btn); border:1.5px solid var(--btn-line); color:var(--btn-ink);
  border-radius:999px; padding:5px 13px; min-height:34px; align-self:center}
.sw-swap:hover{border-color:var(--accent); background:var(--accent-soft)}
.sw-box{background:var(--card2); border:1px solid var(--line); border-radius:var(--r-sm); padding:11px}
.sw-chips{display:grid; grid-template-columns:1fr; gap:var(--sp-1)}
.sw-chips .chip{font-size:var(--fs-md); padding:9px 7px; min-height:44px; border-radius:10px; text-align:left; display:flex; align-items:center; line-height:1.3}
/* 细词 chips 同规：循环选择不高亮（2026-10-08） */
.sw-chips .chip[aria-pressed="true"]{background:var(--btn); border-color:var(--btn-line); color:var(--btn-ink); font-weight:400}
/* 默认只摊开这一层最常用的六个词，其余收进这颗钮，别把「就用这一格」推到屏幕外 */
.sw-more{margin:var(--sp-1) 0 0}
.sw-more summary{cursor:pointer; min-height:44px; display:flex; align-items:center; font-size:var(--fs-note);
  color:var(--muted); list-style:none}
.sw-more summary::-webkit-details-marker{display:none}
.sw-more summary::before{content:"▸ "; color:var(--accent)}
.sw-more[open] summary::before{content:"▾ "}
.sw-more .sw-chips{margin:var(--sp-1) 0 0}
/* 情绪块里已经有一层 .blk 卡片，别再套一层 .sw-box（卡片套卡片既难看又吃掉宽度） */
.blk .sw{margin:var(--sp-0) 0 0}
.blk .sw-box{border:0;background:transparent;padding:0;margin:0}
.chips.wants3{gap:var(--sp-2); flex-direction:column; align-items:stretch}
.chips.wants3 .chip{font-size:var(--fs-o); padding:15px 22px; border-radius:var(--r-sm); flex:1 1 auto; text-align:left}
.inrow{display:flex; gap:var(--sp-1); align-items:center; flex-wrap:wrap}
/* 同屏相邻两块之间的一格：原先这几条写在 JS 模板的 style 里，挪到尺上 */
.sw+.opts,.inrow+.opts{margin-top:var(--sp-3)}
.field+.inrow,.opts+.opts{margin-top:var(--sp-2)}
.chips+.inrow{margin-top:var(--sp-1)}
#stage+.btnline{margin-top:var(--sp-5)}
input[type=text]{
  font:inherit; font-size:var(--fs-lg); flex:1 1 260px; min-width:0;
  padding:11px 14px; border-radius:var(--r-sm); border:1.5px solid var(--btn-line);
  background:var(--card2); color:var(--ink);
}
input[type=text]:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px var(--line)}
/* 目标句不设字数上限：想写多长写多长，框能自己长高，Shift+Enter 换行 */
textarea.goalbox{
  font:inherit; font-size:var(--fs-lg); width:100%; min-height:104px; max-height:44vh; resize:vertical;
  padding:12px 14px; border-radius:var(--r-sm); border:1.5px solid var(--btn-line);
  background:var(--card2); color:var(--ink); line-height:1.55;
}
textarea.goalbox:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px var(--line)}
input.bad{border-color:var(--warn); box-shadow:0 0 0 2px rgba(200,80,40,.14)}
input[type=text].num{width:96px; flex:0 0 96px; text-align:center}

/* 门票三步：默认收起，摘要可点。写下收获那一屏的补充材料，不抢主按钮 */
.ticket{
  margin:var(--sp-3) 0 var(--sp-0); padding:12px 16px; border-radius:var(--r-sm);
  background:var(--card2); border:1px solid var(--line);
}
.ticket summary{
  cursor:pointer; font-size:var(--fs-sm); color:var(--muted); letter-spacing:.04em;
  list-style:none;
}
.ticket summary::-webkit-details-marker{display:none}
.ticket summary::before{content:"▸ "; color:var(--accent)}
.ticket[open] summary::before{content:"▾ "}
.ticket ol{margin:var(--sp-2) 0 var(--sp-1); padding-left:22px; font-size:var(--fs-md); line-height:1.75}
.ticket li{margin-bottom:var(--sp-1)}
.ticket .hint{margin:var(--sp-1) 0 0}

.btnline{display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-1)}
.act{
  font:inherit; font-size:var(--fs-md); padding:10px 18px; border-radius:10px; cursor:pointer;
  background:var(--accent); border:1.5px solid var(--accent); color:var(--accent-ink);
}
.act:hover{filter:brightness(1.07)}
.act.sec{background:var(--btn); border-color:var(--btn-line); color:var(--btn-ink)}
.act.sec:hover{border-color:var(--accent-line); background:var(--accent-soft)}
.act.danger{background:transparent; border-color:var(--warn); color:var(--warn)}
/* 手机版「检查更新」：只在 App 里出现 —— 网页版每次打开就是最新的一份，没有可更新的东西 */
.upd{
  font:inherit; font-size:var(--fs-note); letter-spacing:.04em; padding:7px 14px; border-radius:999px; cursor:pointer;
  background:var(--card2); border:1.5px solid var(--btn-line); color:var(--btn-ink); white-space:nowrap;
}
.upd:hover{border-color:var(--accent); background:var(--accent-soft)}
.upd.busy{color:var(--muted); cursor:progress}
.upd.fresh{border-color:var(--accent-line); color:var(--accent)}

table{width:100%; border-collapse:collapse; font-size:var(--fs-md); margin-top:8px}
.tscroll{overflow-x:auto}
.tscroll table{min-width:700px}
th{text-align:left; font-weight:400; font-size:var(--fs-cap); letter-spacing:.14em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line)}
td{padding:10px; border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--card2)}
.mini{
  font:inherit; font-size:var(--fs-note); padding:8px 14px; border-radius:8px; cursor:pointer;
  background:var(--btn); border:1.5px solid var(--btn-line); color:var(--btn-ink); margin-right:6px;
}
.mini:hover{border-color:var(--accent)}
.stats{display:flex; gap:26px; flex-wrap:wrap; margin:4px 0 14px}
.stat b{display:block; font-size:var(--fs-stat); line-height:1.2}
.stat span{font-size:var(--fs-note); color:var(--muted); letter-spacing:.1em}
/* .empty 已删（2026-10-14 用户令：空的与搜不到都不写一句话，这一族提示整块退役）。 */
/* ── 云同步面板（release-sync.js 渲染，复用追迹同款结构）── */
.cbAreaWrap{margin-bottom:16px}
/* 面板本身别通栏：桌面下 798px 宽的一条输入框没法读。封顶 420，靠左——
   居中会在右侧留一大片空白，看着像没排完。 */
#cbArea{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--card2); padding:17px 18px;
         max-width:420px}
/* 面板里的输入框一律主题化：type=email / password / 无 type 都要吃到，不能只有 type=text 有样式 */
#cbArea input{
  font:inherit; font-size:var(--fs-lg); width:100%; min-width:0; display:block;
  padding:12px 14px; border-radius:var(--r-sm); border:1.5px solid var(--btn-line);
  background:var(--card); color:var(--ink);
}
/* 邮箱＋密码并排那一行：两栏等宽，谁也不通栏（手机上自动叠回一列） */
#cbArea .row2 > input{flex:1 1 0; width:auto; min-width:0}
#cbArea input:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px var(--line)}
#cbArea input::placeholder{color:var(--muted); opacity:1}
#cbArea label{display:block; font-size:var(--fs-cap); letter-spacing:.16em; color:var(--muted); margin:14px 0 7px}
#cbArea .cbpane > label:first-child{margin-top:0}
#cbArea > .mini{display:block; background:transparent; border:0; padding:0; margin:0; color:var(--muted); font-size:var(--fs-sm); line-height:1.55}
#cbArea .row2{display:flex; gap:9px; margin-top:12px; flex-wrap:wrap}
#cbArea .cbpane .row2{margin-top:6px}
#cbArea .row2 .b1, #cbArea .row2 .b2{flex:1; min-width:130px}
#cbArea .b1{font:inherit; font-size:var(--fs-cta); letter-spacing:.08em; padding:13px 16px; border-radius:var(--r-sm); cursor:pointer; background:var(--accent); border:1.5px solid var(--accent); color:var(--accent-ink)}
#cbArea .b1:hover{filter:brightness(1.07)}
#cbArea .b2{font:inherit; font-size:var(--fs-md); padding:9px 14px; border-radius:10px; cursor:pointer; background:var(--btn); border:1.5px solid var(--btn-line); color:var(--btn-ink)}
#cbArea .b2:hover{border-color:var(--accent-line); background:var(--accent-soft)}
#cbArea .b3{font:inherit; font-size:var(--fs-md); padding:8px 14px; border-radius:8px; cursor:pointer; background:transparent; border:1.5px solid var(--btn-line); color:var(--muted)}
#cbArea .b3:hover{border-color:var(--warn); color:var(--warn)}
#cbArea .msg{margin-top:10px; font-size:var(--fs-sm); line-height:1.5; min-height:18px; word-break:break-word}
/* 同步面板上色走类，不走内联 style：内联那几行绕开皮肤变量层，换肤时它不跟着换，
   判据也数它一条（10-05「同步部分排版不好」里的 8 条内联） */
#cbArea .msg.dim{color:var(--muted)}
#cbArea .msg.bad{color:var(--danger)}
#cbArea .msg.ok,#cbArea .msg.accent,#cbArea .cb-link{color:var(--accent)}
#cbArea .cbfull{width:100%}
#cbArea .cbhide{display:none}
#cbArea .cb-ink{color:var(--ink)}
#cbArea .cb-gap{margin-top:8px}
#cbArea .b1,#cbArea .b2,#cbArea .b3,#cbArea .cbget{min-height:44px}
#cbArea .tiny{font-size:var(--fs-cap); color:var(--muted); margin-top:8px}
#cbArea .cbpane{margin-top:0}
#cbArea .cbcode{display:flex; gap:8px; margin-bottom:10px}
#cbArea .cbcode input{flex:1; min-width:0}
#cbArea .cbget{font:inherit; font-size:var(--fs-md); padding:9px 14px; border-radius:10px; cursor:pointer; white-space:nowrap; background:var(--btn); border:1.5px solid var(--btn-line); color:var(--btn-ink)}
#cbArea .cbget:hover{border-color:var(--accent-line); background:var(--accent-soft)}
#cbArea .cbget:disabled{opacity:.5; cursor:default}
#cbArea .cbnotice{background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:var(--r-sm); padding:10px 12px; font-size:var(--fs-sm); margin-bottom:10px; color:var(--accent); line-height:1.5}
#cbArea .cbfoot{font-size:var(--fs-note); color:var(--muted); margin-top:16px; padding-top:13px; border-top:1px dashed var(--line)}
#cbArea .cbfoot a{display:inline-flex; align-items:center; min-height:46px; padding:0 12px; color:var(--accent); text-decoration:none; cursor:pointer}
#cbArea .cbfoot a:hover{text-decoration:underline}
#cbArea .cbdot{margin:0 6px; color:var(--muted)}

/* ── 收获本 ── */
.harv-bar{display:flex; gap:8px; margin-bottom:14px}
.harv-bar input{flex:1; min-width:0}
.harv-list{display:flex; flex-direction:column; gap:10px}
.harv-item{background:var(--card2); border:1px solid var(--line); border-radius:var(--r-sm); padding:13px 15px}
.harv-meta{display:flex; gap:8px; align-items:center; flex-wrap:nowrap; font-size:var(--fs-note); color:var(--muted); margin-bottom:2px}
.harv-date{font-family:ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums; letter-spacing:.02em}
.harv-text{white-space:pre-wrap; line-height:1.6; font-size:var(--fs-md); color:var(--ink); margin-top:7px}
.harv-count{font-size:var(--fs-note); color:var(--muted)}
#harv-body > .harv-count{display:block; margin:9px 0 0; text-align:right}
/* 底部一颗「导出 TXT」：2026-10-12 先把三颗钮收进一扇「备份与迁移」门，
   2026-10-14 用户令「收获本直接是导出TXT，不要再另外弹出」，那扇门也拆了——
   底行就是导出本身，中间不再有任何一屏。 */
.harv-foot{flex-wrap:nowrap; gap:8px; margin-top:10px}
.harv-foot .act{flex:1 1 0; min-width:0; white-space:nowrap; text-align:center; padding:12px 6px}
/* 分发版没配云同步时才出现：收获本只在本机，得让人知道换设备怎么办 */
.harv-note{margin:8px 2px 0; font-size:var(--fs-note); color:var(--muted); line-height:1.6}
/* ── 八课练习（严格按 1992 原课程逐课走） ──
   2026-10-09 知识卡改成「原本的引导」：旧的 l8-head / l8-count / l8-points /
   l8-say / l8-drills / l8-fold / l8-live / l8-ask / l8-q / l8-foot 全部没有出参了，
   版式见下面这一组。标题这一行只作小字副题，不跟引导句抢重（手机/桌面同档，不再两处各写一遍）。 */
/* ── 八课引导版式（2026-10-09 重做）──
   一句一屏：顶部课次导航 + 进度条，重心全给引导句；选项按个数分档（≤3 大按钮，>3 三列芯片）；
   收工页平铺六步骤。桌面档字号再抬一档。 */
/* ── 顶部导航控件统一（2026-10-14 用户报「顶部导航栏的设计有点难看和不统一」）──
   这块的毛病不在某一条规则，在「圆角有三套」：外观钮 9px、课次导航 99px 胶囊、
   「从头」是光秃秃的下划线文字——三个族竖着排在同一条线上，就是「不统一」的来源。
   项目本来就有 --r-sm:11px（大卡 --r:16 / 控件 --r-sm:11），窄屏页签也是它；
   这里回队，不再各写各的。圆角只统一外形，层级仍靠字号与色重分，不靠形状抢戏。
   2026-10-14 前情：轮31 曾把这三行硬合成一行的做法被用户否掉（见账本 §31/交接卡⑦），
   所以这轮**不动行数与信息层级**，只做「统一外形 + 收紧间距」。 */
/* ── 顶部两行 · 左信息／右操作（2026-10-14 深夜，用户口径：「不要进度条」
   「不要乱七八糟的居中，所有排版都按正常逻辑重新排」）──
   2026-10-14 当天绕了两道弯（先把三颗居中、再把进度条居中限宽），方向是错的：
   居中在 339px 手机上是凑巧能放，到 798px 桌面就变成中间一小撮、两边各空 240px——
   看着像没排。这次按最基本的 App 导航逻辑重来，两条规矩：
     ① 读的信息一律贴左（我在哪一课／第几句），按正常阅读顺序从左读起；
     ② 操作的钮一律贴右成组（翻课、从头），左手肘 shoulder：看不见才更要 predictability。
   实现上不用 justify-content:center，用 margin-right:auto 把右侧那组推到行尾，
   窄屏宽屏同一套规则，不再写两套。
   ⚠️ 边界照旧：轮31 三行合一被否，**行数与信息层级不动**（仍是两行）。
   所以这轮**不动行数与信息层级**，只做「统一外形 + 收紧间距」。 */
/* 进度条整个撤掉（2026-10-14 用户令）：「第 X / Y 句」已经把走到哪说清楚了，
   再拉一根横条是同一件事说两遍，还白白占一行视觉重量。 */
.l8-top{display:flex; align-items:center; gap:6px; margin:0 0 6px}
/* 「第 X / Y 课」是这块唯一要一眼读到的信息（我在哪），两侧翻课钮只是辅助：
   所以位置文字提重（14px / 600 / ink），按钮保持 muted。
   字距从 .08em 收到 .01em——原先连数字之间的空格都被撑开，「1  /  8」看着是散的。
   margin-right:auto 把右边那颗「下一课」推到行尾，自己仍贴着左边那颗。 */
.l8-pos{flex:0 1 auto; margin-right:auto; text-align:left; font-size:var(--fs-sm); font-weight:600; color:var(--ink);
  letter-spacing:.01em; white-space:nowrap}
/* 完成进度挂在课次号底下。收工页删了以后，这是「我放到第几课了」唯一的可见落点。 */
.l8-pos .l8-dn{display:block; font-style:normal; font-size:var(--fs-micro);
  letter-spacing:.04em; color:var(--accent); font-weight:700; margin-top:1px}
.l8-nav{flex:0 0 auto; min-height:38px; padding:0 11px; cursor:pointer;
  background:transparent; border:1px solid var(--line); border-radius:var(--r-sm); color:var(--muted);
  font:inherit; font-size:var(--fs-note); white-space:nowrap}
.l8-nav:hover:not(:disabled){border-color:var(--accent-line)}
.l8-nav:disabled{opacity:.3; cursor:default}
/* 「‹ 目录」脱开同排的翻课钮（2026-10-14 用户令「练习里的目录或者切换应该醒目一点，以防被遗漏」）：
   它是课内唯一一条「出去、重新选地方」的门，穿着跟「上一课／下一课」一样的哑光外衣，
   扫一眼就会漏。走强调色——字 accent、描边 accent-line、底 accent-soft。
   层级仍靠色重不靠放大：高度／圆角／字号与同排那颗一眼看齐。 */
.l8-nav.key{color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); font-weight:700}
.l8-nav.key:hover:not(:disabled){border-color:var(--accent)}
/* 第二行同理：左边是「第 X / Y 句」（读到哪了），右边是操作组（改过 N 句／从头）。 */
.l8-barrow{display:flex; align-items:center; gap:8px; margin:0 0 10px}
/* .l8-meta 已并入进度条那一行 .l8-barrow（10-13 排版收简：三行 chrome 收成两行） */
.l8-stepn{margin-right:auto; font-size:var(--fs-note); color:var(--muted); white-space:nowrap}
/* 「从头」原来是下划线光字钮，跟旁边两颗胶囊不是一个族。改成同族的钮：
   同圆角、同边框。边框给常时可见（不是透明的）——触屏上没有 hover，
   「透明的框」等于把「这颗能点」这件事只留给鼠标用户看。层级靠更小的高度
   （34 vs 44）和更淡的字色分，不靠把框藏起来。 */
.l8-reset{background:none; border:1px solid var(--line); border-radius:var(--r-sm);
  min-height:34px; padding:0 9px; cursor:pointer; font:inherit;
  font-size:var(--fs-note); color:var(--muted); white-space:nowrap}
.l8-reset:hover{border-color:var(--accent-line); color:var(--ink)}
/* ── 八课目录屏（2026-10-14 用户令「八节课那么多内容都要以目录形式收起来」）──
   一条一课，竖排（与八课选项、工作本条目同一条规矩：竖着走，不铺网格）。
   行内三列：左＝课次（主），下＝这一课是哪几个练习（次），右＝箭头。
   全部左对齐/两端对齐，不居中——与八课顶部同一套排版规矩。
   2026-10-14 轮40 用户令「不要用"走过"这些，全删掉」：头行「走过 N / 8 课」与
   行状态列（没走过／走完了／第 X / Y 句）一并撤。句位照常落盘、进课照常续走，
   只是目录上不再显示「走到哪」——目录不是进度台账，是入口。 */
.l8-dir{display:flex; flex-direction:column; gap:10px}
.l8-dirrow{display:grid; grid-template-columns:1fr auto; align-items:center; gap:2px 10px;
  text-align:left; font:inherit; cursor:pointer;
  padding:12px 14px; background:var(--card2); border:1px solid var(--line); border-radius:12px; min-height:56px}
.l8-dirrow:hover{border-color:var(--accent-line); background:var(--accent-soft)}
.l8-dirrow .dr-n{grid-column:1; font-size:var(--fs-sm); font-weight:700; color:var(--ink)}
.l8-dirrow .dr-sub{grid-column:1; font-size:var(--fs-note); color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.l8-dirrow .dr-ar{grid-column:2; font-size:17px; color:var(--muted); line-height:1}
.l8-dirh{font-size:var(--fs-title); font-weight:700; color:var(--ink); margin-right:auto; letter-spacing:.01em}
.l8-dirst{font-size:var(--fs-note); color:var(--muted); white-space:nowrap}
/* ── 工作本目录屏（2026-10-14 用户令「工作本那么多内容都要以目录形式收起来」）──
   与八课目录屏同一套排版规矩：竖排不铺网格、左对齐、状态在右、没有进度条。
   类名带 wb- 前缀——这一屏在工作本页签里，跟 l8- 那一套分开，grep 不乱。
   行内就两行字＋一颗箭头：左＝表名（主），下＝这张表干什么（次）
   （2026-10-14 用户令：目录不报条数——里面有没有东西，进门看得见）。 */
.wb-top{display:flex; align-items:center; gap:6px; margin:0 0 6px}
.wb-pos{flex:0 1 auto; margin-right:auto; text-align:left; font-size:var(--fs-sm); font-weight:600; color:var(--ink);
  letter-spacing:.01em; white-space:nowrap}
.wb-nav{flex:0 0 auto; min-height:38px; padding:0 11px; cursor:pointer;
  background:transparent; border:1px solid var(--line); border-radius:var(--r-sm); color:var(--muted);
  font:inherit; font-size:var(--fs-note); white-space:nowrap}
.wb-nav:hover{border-color:var(--accent-line)}
.wb-dirh{font-size:var(--fs-title); font-weight:700; color:var(--ink); margin-right:auto; letter-spacing:.01em}

:root.no-guide-edit .l8-line{cursor:default; border-bottom:0; padding-bottom:0}
.l8-edit-ta{display:block; width:100%; box-sizing:border-box; min-height:96px; padding:12px 14px;

.l8-edit-ta:focus{outline:none; border-color:var(--accent)}

.l8-edn{font:inherit; font-size:var(--fs-micro); font-weight:700; color:var(--accent);
  background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:var(--r-sm);
  padding:3px 11px; cursor:pointer; white-space:nowrap}
/* 手机档那一屏不再上下居中（10-14 用户报「这个排版太奇怪了」）：改前实测 mid 高 390、内容只有
   254，一句短问话被上 60／下 76 两段空白夹在屏幕正中，整块卡片又只到 551 高，底下还悬空 142
   才到「上一句／结束」——三处空白各自为政，看着就是散的。现在让 wrap 铺满一屏，空档统一收到
   内容之下、由底部那两颗钮压住下沿。214 是扫出来的（同一屏从 204 试到 224）：393×851 实测
   wrap 637＝851−214、docScroll 归零（204 那一档还滚 2px）；这 214 摊开来是顶栏 65＋main 上 14
   ＋wrap 上方那条进度行 17，加上 main 下 96＋wrap 下方余量 21＋1px 余量。改后卡片下沿离底栏
   56（改前 142）。刘海机另加安全区超出 10px 的那一截。padding-top 只留一个封顶偏移，免得问句
   又顶到上沿。代价按 18 屏逐屏扫过（改前／改后各一趟，同一控制文件）：不滚的屏 12→10，
   「练习2」与「练习10 分两栏」这两屏由不滚变成滚 48／20px——顶部那 56 在本来就快满一屏的
   练习屏上照加；最滚的那一屏 360→416。 */
.l8-wrap{display:flex; flex-direction:column}
.l8-mid{flex:1 1 auto; display:flex; flex-direction:column; justify-content:flex-start}
/* 换屏要浮起来，不要「啪」地一下硬切（2026-10-12）：
   八课答完一句会自动跳回识别那一屏，之前那一跳是整屏瞬变，用户说「太生硬」。
   #stage 与 #ws-stage 早就有这条，八课这屏漏了；页签之间也是同一毛病，一并补上淡入。 */
#pane-lesson .l8-mid>*{animation:stageIn .24s ease both}
/* 左右滑换课（2026-10-12 轮20）：跟手拖动的是 .l8-wrap 整块（顶栏＋引导句＋底部两颗钮
   一起走，才是翻页器的样子）；松手过线后新一课从那一侧推进来。
   touch-action:pan-y＝横向手势归 JS，纵向滚动归浏览器——没有这条，手指一横着拖
   浏览器就 pointercancel 把手势收走，滑动时灵时不灵。输入框恢复 auto（框里要能
   正常选字、正常竖滚）。 */
#pane-lesson .l8-wrap{touch-action:pan-y}
#pane-lesson .l8-wrap input,#pane-lesson .l8-wrap textarea{touch-action:auto}
@keyframes l8InNext{from{transform:translateX(52px); opacity:0} to{transform:none; opacity:1}}
@keyframes l8InPrev{from{transform:translateX(-52px); opacity:0} to{transform:none; opacity:1}}
@keyframes paneIn{from{opacity:0} to{opacity:1}}
main section[role="tabpanel"]:not(.hidden){animation:paneIn .2s ease both}
/* 填写框从一行起、随输入长高（2026-10-13 用户报「填写的时候太别扭」）：
   原来固定 rows=2 起高 81px，带主题的练习三组一摞，「继续」被顶到屏幕外头；

.l8-in{display:block; width:100%; box-sizing:border-box; min-height:48px; padding:12px 14px; margin:0 0 10px;
  font:inherit; font-size:var(--fs-md); line-height:1.7; color:var(--ink);

.l8-in:focus{outline:none; border-color:var(--accent)}
/* 八课 write 步绑工作本（2026-10-10，用户令「输入框部分可以根据具体的工作本来制定」）：
   每个方面一张卡（卡头＝方面名、卡体＝输入框）；已有条目列表跟在工作本页签同源，删条目走同一套墓碑。
   2026-10-13 重排（用户报「一个练习有多方面的释放，排版有点不好看」）：原来是「小标签＋一摞白框」，
   几个方面之间只隔 10px、彼此没有分隔感，看不出谁是谁的地盘；现在每个方面是一张完整的卡，
   桌面宽屏两栏并排、手机恒单列（手机是主战场，并排会挤成一团）。 */
.l8-ws-hint{margin:-2px 0 11px; font-size:var(--fs-note); color:var(--muted); text-align:left}
.l8-ws-grps{display:grid; gap:10px; margin:0 0 12px}
@media (min-width:720px){ .l8-ws-grps{grid-template-columns:1fr 1fr} }
.l8-ws-grp{margin:0; padding:10px 12px 8px; background:var(--card2);

.l8-ws-grp>.l8-ws-gn{display:block; margin:0 0 6px; font-size:var(--fs-sm); font-weight:700; color:var(--accent)}

.l8-ws-grp .l8-in + .l8-in{margin-top:8px}

.l8-ws-it{display:flex; align-items:center; gap:8px; padding:8px 12px;

.l8-ws-it .t{flex:1 1 auto; font-size:var(--fs-note); color:var(--ink); overflow-wrap:anywhere}

/* 识别屏九格（L2/L4 sel 步）：与 ask 屏选项同规格竖排大钮（2026-10-10 用户令「太简陋了」，

.l8-ws-hint2{margin:0 0 8px; font-size:var(--fs-note); color:var(--muted)}
.l8-sel{display:flex; flex-direction:column; gap:10px}
.l8-selb{min-height:54px; padding:12px 16px; cursor:pointer; font:inherit;
  font-size:17px; font-weight:600; color:var(--btn-ink); background:var(--btn);
  border:1.5px solid var(--btn-line); border-radius:12px; text-align:center}
.l8-selb:hover{border-color:var(--accent-line); background:var(--accent-soft)}
.l8-selb.on{color:var(--accent-ink); background:var(--accent); border-color:var(--accent); font-weight:700}
/* 八课释放屏：胶囊＋全表层（2026-10-13 用户选 E1）：
   释放屏不再挂绿卡与内联 chips 行；胶囊常显「正在放哪个练习·全表几条」，
   点胶囊直接开全表层——桌面右侧抽屉、手机从底部升起半屏（top:46%，10-13：顶栏钮补 44 后抬 2%，问句全文仍露在层上方），
   薄雾罩只到 .18，问句和胶囊在层上方仍读得清；层底让开固定页签栏。
   出口：层顶「完成」／点雾罩／返回手势／Esc（接进浮层总出口体系）。 */
.l8-pillrow{display:flex; justify-content:flex-start; margin:0 0 10px; position:relative; z-index:61; pointer-events:none}
.l8-pill{position:relative; z-index:61; display:inline-flex; align-items:center; gap:8px; min-height:32px; padding:6px 13px; cursor:pointer; pointer-events:auto;
  font:inherit; font-size:var(--fs-cap); font-weight:700; letter-spacing:.02em; white-space:nowrap;
  background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:999px; color:var(--accent)}
.l8-pill:hover{border-color:var(--accent)}
.l8-pill i{font-style:normal; font-weight:400; color:var(--muted)}
.l8-sheet-scrim{position:fixed; inset:0; z-index:59; background:rgba(42,35,23,.18)}

.l8-sh-t{font-style:italic; font-size:var(--fs-title); font-weight:700; color:var(--ink)}
.l8-sh-x{margin-left:auto; min-height:34px; padding:0 14px; cursor:pointer; font:inherit; font-size:var(--fs-note);

@media (max-width:900px){

@media (min-width:901px){

.l8-ov{margin:0 0 12px; background:var(--card2); border:1.5px solid var(--line); border-radius:12px}
.l8-ov-sum{display:flex; align-items:center; gap:8px; width:100%; min-height:44px;
  padding:8px 14px; cursor:pointer; font:inherit; background:transparent; border:0; text-align:left}
.l8-ov-t{flex:1 1 auto; font-size:var(--fs-sm); font-weight:700; color:var(--ink)}
.l8-ov-n{flex:0 0 auto; padding:1px 8px; font-size:var(--fs-micro); color:var(--accent);
  background:var(--accent-soft); border-radius:999px}
.l8-ov-ar{flex:0 0 auto; font-size:var(--fs-micro); color:var(--muted)}
.l8-ov-body{display:none; padding:2px 14px 8px; border-top:1px dashed var(--line)}
.l8-ov.on .l8-ov-body{display:block}
.l8-ov-g{padding:7px 0}
.l8-ov-g + .l8-ov-g{border-top:1px solid var(--line)}
.l8-ov-g.cur{margin:0 -6px; padding:7px 6px; background:var(--accent-soft); border-radius:10px}

.l8-ov-gn{font-size:var(--fs-sm); font-weight:700; color:var(--accent)}
.l8-ov-gc{margin:0 0 0 8px; font-size:var(--fs-micro); color:var(--muted)}
.l8-ov-it{position:relative; padding-left:14px; font-size:var(--fs-note); color:var(--ink); line-height:1.6; overflow-wrap:anywhere}
.l8-ov-it::before{content:""; position:absolute; left:2px; top:.62em; width:4px; height:4px;

.l8-ov-more{padding-left:14px; font-size:var(--fs-micro); color:var(--muted)}

.l8-ov-row{display:flex; align-items:flex-start; gap:8px}
.l8-ov-it{flex:1 1 auto}
.l8-ov-del{flex:0 0 auto; margin-left:6px; padding:2px 5px; cursor:pointer;
  font:inherit; font-size:var(--fs-micro); line-height:1.7; color:var(--muted);

   原是一排横滚 chip＋条数角标（2026-10-10 建、10-13 改横滚）：第 6 课六颗 chip 放不下被裁
   （用户报「这样不好看，后面看不见了」），角标还带着计数。整条退役，换成两级：
   ① opener 细条 .l8-pdir-b（课内）：一行字报「练习目录 · 当前在放哪个」，点开全屏目录；
   ② 全屏目录 .l8-pdir 与全表层 .l8-prows：一行一个练习竖排，当前高亮，没有角标。

.l8-prow .pp-n{grid-column:1; font-style:normal; font-size:var(--fs-sm); font-weight:700; color:var(--ink)}
.l8-prow .pp-ar{grid-column:2; font-style:normal; font-size:17px; color:var(--muted); line-height:1}

.l8-prow.on .pp-ar{color:var(--accent)}
.l8-sheet .l8-prows{margin:12px 0 4px}
/* opener 细条：2026-10-14 用户令「练习里的目录或者切换应该醒目一点，以防被遗漏」——

.l8-pdir-b{display:flex; align-items:center; gap:8px; width:100%; min-height:40px;

.l8-pdir-b .pp-ba{flex:0 0 auto; font-style:normal; font-size:15px; color:var(--accent); line-height:1}

/* 「保存进工作本」钮（2026-10-10 用户令「不要记录，除非用户点了保存」）：
   写屏内容默认不落表，点这颗才写入；未保存就前进的转本机草稿。 */
.l8-save{width:100%; min-height:46px; margin:0 0 12px; cursor:pointer; font:inherit;

  border:1.5px solid var(--accent-line); border-radius:12px}
.l8-save:hover{background:var(--accent-soft)}
/* 八课选项一律竖排一颗一行（2026-10-09，用户口径：「选项排行要跟引导那样是竖排的」）。
   原先按个数分档：≤3 颗走两列、>3 颗走三列（九大情绪表摊成 3×3）。主引导早就定过规矩——
   那一屏的选项一律竖排，主引导的九格情绪表自己也是单列（.opts.grid.emo 是 1fr）。
   所以这里不分档：九颗也竖排，一屏放不下就滚，跟引导的行为完全一致。 */
.l8-opts{display:flex; flex-direction:column; gap:10px}
.l8-opts .l8-opt{min-height:54px; padding:12px 16px; cursor:pointer; font:inherit;
  font-size:17px; font-weight:600; color:var(--btn-ink); background:var(--btn);
  border:1.5px solid var(--btn-line); border-radius:12px; text-align:left}
.l8-opts .l8-opt:hover{border-color:var(--accent-line); background:var(--accent-soft)}
/* say 步只有一句要听的话，不给输入框（2026-10-09 用户口径）：底下就是一颗中性「下一句」，
   跟 ask 步那排选项同一套料，免得一句捎话倒像是要填什么东西。 */
.l8-say{width:100%; min-height:54px; margin:0 0 16px; cursor:pointer; font:inherit;
  font-size:17px; font-weight:600; color:var(--btn-ink); background:var(--btn);
  border:1.5px solid var(--btn-line); border-radius:12px; text-align:center}
.l8-say:hover{border-color:var(--accent-line); background:var(--accent-soft)}
.l8-go{width:100%; min-height:54px; margin:0 0 16px; cursor:pointer; font:inherit; font-size:17px;
  font-weight:700; color:var(--accent-ink); background:var(--accent); border:0; border-radius:12px}
.l8-bottom{display:flex; gap:10px; margin:20px 0 0}
.l8-b2{flex:1 1 0; min-height:46px; padding:0 6px; cursor:pointer; font:inherit; font-size:var(--fs-note);
  color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:11px;
  white-space:nowrap}
.l8-b2.prime{color:var(--accent-ink); background:var(--accent); border-color:var(--accent); font-weight:700}
.l8-b2:disabled{opacity:.35; cursor:default}
/* 六步骤：原先铺在八课的收工页（✓ 这一课走完了）上，那一页已被用户删掉。
   内容一条没少，挪到引导页起手屏底下的折叠区——课程一开头想翻的人翻得到，
   不想翻的人一点不用管。 */
.sixfold{margin:0 0 var(--sp-2); border:1px solid var(--line); border-radius:var(--r-sm);
  background:var(--card)}
.sixfold > summary{cursor:pointer; padding:12px 14px; min-height:44px; display:flex; align-items:center;
  list-style:none; font-size:var(--fs-note); font-weight:700; color:var(--muted)}
.sixfold > summary::-webkit-details-marker{display:none}
.sixfold > summary::before{content:"▸ "; color:var(--accent)}
.sixfold[open] > summary::before{content:"▾ "}
.sixfold-in{padding:2px 16px 16px}
.sixfold ol{margin:0; padding-left:1.35em}
.sixfold li{margin:0 0 10px; font-size:var(--fs-sm); line-height:1.7; color:var(--ink)}
.sixfold li:last-child{margin-bottom:0}
/* 六步骤中英对照（2026-10-14）：英文逐字取自语料库原版，另起一行、次要字号，
   不抢中文的视线；门票（.ticket）里同一类行共用这条规则。 */
.sixfold li .six-en, .ticket li .six-en{display:block; margin-top:2px;
  font-size:var(--fs-micro); color:var(--muted); line-height:1.6}
@media (min-width:641px){
  .l8-line{font-size:23px}
  .l8-card{padding:28px 26px}
  .l8-opts .l8-opt{font-size:18px}
}
@media (max-width:640px){
  .l8-line{font-size:19px}
  /* min-height 撑到一屏：只为让底下那两颗钮（上一句／继续）落在屏幕底边的固定位置，
     换课换句时不上下跳。它是「操作区定位」，不是「把内容摆中间」。 */
  .l8-wrap{min-height:calc(100vh - 214px - max(0px, env(safe-area-inset-top) - 10px))}
  /* ⚠️ 下面这条已删（2026-10-14 深夜，用户报「手机版八节课的排版太难看了」）：
       .l8-mid{padding-top:min(9vh,56px)}
     它是当年为了让内容「看着像居中」加的人为留白——手机上 56px 白档横在顶部导航和
     引导句之间，内容少的时候整块悬在屏幕中间，内容多的时候又往下溢出，一屏一屏位置跳。
     正常逻辑是内容贴着导航往下流式排；要留白也是行间距的事，不该在区块顶上垫一坨。 */
  .l8-mid{padding-top:0}
}
/* ── 收获本（一条时间流：走过的那一笔＋随手记的那一句） ──
   统计行放在列表头上，不放在顶栏 chrome：顶栏 chrome 手机档只剩 1.6 个百分点余量，
   多一行就红（ui3_probe 判 ≤25%）。这一行属于内容，首屏内容仍 ≥65%。 */
.harv-stat{display:block; margin:0 0 10px; font-size:var(--fs-note); color:var(--muted); text-align:right}
/* 时间流里每条都标明来路：走过＝走完一遍的那一笔，随手记＝当场记的一句 */
.harv-src{flex:0 0 auto; font-size:var(--fs-note); color:var(--muted)}
/* 收获本：账号面板折成一行状态、备份/迁移收进抽屉、卡片动作挪到行尾，
   判据是「内容起点」而不是「我觉得好看」——原来 chrome 吃掉 60%，第一张卡片要滚到 546px 才露头。 */
.harv-status{display:flex; align-items:center; gap:9px; width:100%; min-height:46px; text-align:left; cursor:pointer;
  font:inherit; font-size:var(--fs-note); color:var(--muted);
  background:var(--card2); border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 13px; margin:0 0 8px}
.harv-status:hover{border-color:var(--accent-line)}
.harv-status .hs-dot{flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:var(--line)}
.harv-status .hs-dot.on{background:var(--good)}
.harv-status .hs-k{font-weight:700; color:var(--ink); white-space:nowrap}
.harv-status .hs-x{margin-left:auto; white-space:nowrap; color:var(--accent)}
.cbAreaWrap.collapsed{display:none}
/* 宽屏：同步状态与搜索框并成一行（列表头一行是成熟产品的常规），窄屏仍各占一行 */
@media (min-width:641px){
  .harv-top{display:flex; gap:12px; align-items:center; margin-bottom:14px}
  .harv-top .harv-status{width:auto; flex:0 1 auto; margin:0}
  .harv-top .harv-bar{flex:1 1 auto; margin:0}
}
.harv-ops{margin-left:auto; align-self:center; display:flex; gap:7px}
.harv-ops button{width:44px; height:44px; display:grid; place-items:center; cursor:pointer; flex:0 0 auto;
  background:var(--btn); border:1.5px solid var(--btn-line); border-radius:11px; color:var(--btn-ink)}
.harv-ops button:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.harv-ops svg{width:18px; height:18px; display:block}
.harv-form{background:var(--card2); border:1px solid var(--line); border-radius:var(--r-sm); padding:16px; margin-bottom:14px}
.harv-form .goalbox{width:100%; min-height:90px; margin-bottom:12px}
/* 写字屏顶上那行记录时间：复用卡片的时间行，间距单独给一档 */
.harv-form .harv-meta{margin:0 0 10px}
.bak-head{display:flex; align-items:center; gap:10px; margin:0 0 4px}
.bak-h{margin:0; font-size:var(--fs-title); font-weight:700; letter-spacing:.02em}
.bak-x{min-height:46px; padding:0 18px; margin-left:auto}
.bak-sub{margin:0 0 10px; font-size:var(--fs-note); color:var(--muted); line-height:1.55}
/* .bak-row／.bak-lb／.bak-acts 已随「收获本直出 TXT」撤掉（2026-10-14）：那条
   多行版式只服务被删的那一扇门，留一行说明，规则本身不占位。 */
.bak-fb{min-height:72px}
.note{background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:var(--r-sm); padding:14px 16px; font-size:var(--fs-md); margin:var(--sp-3) 0}
.note.alert{background:transparent; border-color:var(--warn); color:var(--warn)}
.hidden{display:none !important}
.toast{
  position:fixed; left:50%; bottom:34px; transform:translate(-50%,20px);
  background:var(--ink); color:var(--card); padding:11px 22px; border-radius:999px;
  font-size:var(--fs-md); opacity:0; pointer-events:none; transition:.22s;
}
.toast.on{opacity:1; transform:translate(-50%,0)}
/* ── 手机 / APP 断点：页签变固定底栏（拇指区），内容为单手沉浸排版 ── */
/* 小屏笔记本档（2026-10-04 补）：原先唯一的断点是 640px，768~1024 那一段走的是桌面布局，
   而这一档才是实际常用的宽度 —— 页签在卡片顶部、卡片带大阴影和大留白，只读性差。
   这里只收紧外框与间距，不改导航形态（底栏仍留给 640px 以下）。 */
@media (min-width:641px) and (max-width:1024px){
  main{max-width:760px; padding:22px 16px 44px}
  .card{padding:20px 20px 24px; box-shadow:0 1px 0 var(--sheen) inset}
  .bar{padding:max(11px, env(safe-area-inset-top)) 16px}
  :root{--fs-title:17px}
  .hint{margin-bottom:var(--sp-4)}
  .opt{padding:14px 16px}
  .chips.wants3 .chip{padding:14px 18px}
}
@media (max-width:640px){
  /* 顶距恢复安全区：基础档的 env(safe-area-inset-top) 原先在这里被 10px 覆盖掉，
     刘海/挖孔机的状态栏＋前摄会压到顶栏——改回 max()，有安全区就抬，没有就保底。
     2026-10-14 用户圈顶栏报「太多空白」：竖衬 10→5。安全区照抬（max 取大者），无刘海机省 10px。 */
  .bar{padding:max(5px, env(safe-area-inset-top)) 14px 5px}
  :root{--fs-title:17px}
  .brand small{display:none}          /* 副标题在窄屏省一行 */
  /* 2026-10-14 用户圈顶栏下方报「太多空白」：main 顶衬 14→8、卡片顶衬 16→10，
     内容贴上来，顶栏底下不再悬一段空。底部 96px 是给固定页签栏让位的，不动。 */
  main{padding:8px 12px 96px}        /* 底部留出底栏 + 安全区 */
  .card{padding:10px 14px 18px; border-radius:var(--r-sm); box-shadow:none}
  /* 五个页签固定底栏，均分触点 */
  .tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    margin:0; gap:2px; flex-wrap:nowrap; align-items:stretch;
    background:var(--card); border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 14px rgba(0,0,0,.06);
  }
  .tab{
    flex:1 1 0; text-align:center; padding:12px 0; font-size:var(--fs-sm);
    border-radius:11px; background:transparent; border-color:transparent;
  }
  .tab:hover{border-color:transparent}
  .tab[aria-selected="true"]{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); font-weight:700}
  /* 问句更大、更沉浸 */
  /* 手机才是主要形态：主问句原来最大只有 33px，比桌面的 42px 还小，这里反过来给到 38px */
  .q{font-size:var(--fs-qn); line-height:1.45}
  .hint{font-size:var(--fs-sm); margin-bottom:var(--sp-4)}
  .kind{font-size:var(--fs-micro); letter-spacing:.2em; margin-bottom:var(--sp-1)}
  .opt{padding:15px 14px}
  /* 释放态那一屏的选项钮跟引导页同档：引导页带副句的选项实测 88px 高，
     工作本的单句选项只有 60px，等于把同一件事在两处做成了大小两号 */
  .wb-focus .opt{min-height:88px}
  /* 手机没有数字键，键帽 .k 只是占宽的噪音；九格一行一颗，跟桌面同一副长相 */
  .opts.grid.emo{grid-template-columns:1fr; gap:var(--sp-1)}
  .opts.grid.emo .opt{padding:11px 8px; min-height:44px; justify-content:flex-start; text-align:left}
  .opts.grid.emo .opt .k{display:none}
  .chip{padding:10px 14px}
  .sw-chips{grid-template-columns:1fr; gap:var(--sp-1)}
  .sw-chips .chip{padding:9px 5px}
  .sw-swap{padding:8px 14px; min-height:44px}
  .chips.wants3 .chip{padding:14px 10px}
  .act{padding:12px 18px}
  /* 收获本底部三颗钮：393 视口下 98+98+113+间距=329，紧贴 339 的可用宽；
     再窄一档（360）就靠这颗收紧保住一行，别让它折成两行壳 */
  .harv-foot .act{padding:10px 11px}
  /* 顶部一行化（2026-10-08）：目标句并入同一行，窄屏靠它自己收缩 */
  .rail{margin:0 0 var(--sp-0)}
  /* 随行条手机两行化（2026-10-08 晚实拍）：一行四件在 393 全截碎——
     第一行留 步数+起点+卡住了，目标句 order 提到下一行独占整行 */
  .rail-bar{flex-wrap:wrap; row-gap:6px}
  .rail .g-line{flex:1 1 100%; max-width:none; order:10}
  .rail .g-lv{padding:3px 9px}
  .rail .clock{padding:3px 9px}
  .rail-count{font-size:var(--fs-cap); letter-spacing:0}
  /* 统计两列 */
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:12px 18px}
  :root{--fs-stat:22px}
  /* 回上一步 / 重新开始 钉在卡底（2026-10-14 轮40 用户报起手屏「这个部分的空白也太多了」：
     内容 492px 一收，钮底下直直到底栏 200+px 死空）。手法与八课屏同一条
     （.l8-wrap min-height 撑一屏，见 1023 行那条注）：pane 撑到「文档刚好不滚动」的
     满高，#stage 吃剩余空间，两颗钮落在固定位置——换步不上下跳。
     189px＝顶栏 55＋main 上衬 8＋卡边上衬 1＋卡内上衬 10＋卡内下衬 18＋卡边 1＋main 下衬 96
     （393×851 实测：pane 74→736、卡底 755、文档高 851 正好不滚；有刘海的机型顶栏
     长多少这里退多少，卡底仍不顶到底栏、文档仍不滚）。 */
  #pane-guide{display:flex; flex-direction:column;
    min-height:calc(100vh - 189px - max(0px, env(safe-area-inset-top) - 5px))}
  #pane-guide #stage{flex:1 1 auto}
  #pane-guide .btnline{margin-top:auto}
  /* toast 抬到底栏之上：反馈通道不能被固定底栏吃掉（393 视口实测曾被遮半截） */
  .toast{bottom:calc(74px + env(safe-area-inset-bottom)); z-index:80}
  /* 顶栏一行化·不分两行（2026-10-08 晚）：App 里「检查更新」常驻，
     393/360 都要同排——禁换行 + 缩衬，极窄屏副标签让位（见块后 ≤360 规则） */
  .bar{flex-wrap:nowrap; gap:6px 8px}
  .bar .grow,.looks{min-width:0}
  /* 前摄居中机型（挖孔／灵动岛）：顶栏内容一律靠两端，正中留空给摄像头。
     原先两颗 .looks 各 flex:1 把「外观」挤到水平正中＝正好压在摄像头下。
     现在品牌名吃满中间空白（flex:1），按钮组只收不撑（flex:0 1 auto），
     视觉＝ [释 释放法 …………][外观]，正中是空的。 */
  .bar .brand{flex:1 1 auto; min-width:0}
  .bar .grow{flex:0 1 0}
  .looks{flex:0 1 auto; margin-top:0; gap:6px; justify-content:flex-end}
  .lookbtn{min-height:44px; padding:3px 8px; gap:5px; white-space:nowrap} /* 10-13 手机档实测 29px 不足，补拇指线 44 */
  /* 副标签让位（App-393 实拍：跟随系统盖住品牌名）——手机只留短标签 */
  .lookbtn .lb-n{display:none}
  .lookbtn .lb-t{font-size:var(--fs-note)}
  .upd{padding:4px 10px; white-space:nowrap}
  /* 抽屉里两列并排：一款一格，示例字 15px（393×851 实测每格 169 宽、列宽 168.5，一行放得下
   「还有剩余吗」＋主色钮；360 宽那档每格 152，同样不裁字） */
  .look-grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
  /* 两列格子窄，英文示例字比中文长：降一档，让「Anything left? + Yes」同格站得下 */
  .lk-q{font-size:var(--fs-note)}
  .lk-p{padding:5px 9px; font-size:var(--fs-cap)}
  /* 浮层改从底部升起（拇指区），盖过底栏 */
  .sheet,.cpanel{top:auto; bottom:0; left:0; right:0; max-width:none; border-radius:var(--r) var(--r) 0 0; max-height:78vh; padding-bottom:calc(18px + env(safe-area-inset-bottom)); animation:sheetUp .3s cubic-bezier(.2,.8,.25,1) both}
  /* 浮层里那颗出口钮按拇指补到 44：桌面的 8px 上下衬只量到 39（10-05 双档实测） */
  .sheet .mini,.cpanel .mini{min-height:44px; padding-top:11px; padding-bottom:11px}
  /* 轮30：去边框后仍是拇指可点的文字入口——保留高度、去掉方块感（沿用 r29 速览卡做法） */
  .wb-act .mini{min-height:0; min-width:0; padding:12px 10px; line-height:1}
  /* 释放态那一屏只有「回队列」一颗出口钮，实测 37px 点不准 */
  .wb-back{min-height:44px; padding-top:11px; padding-bottom:11px}
  /* 氛围层收进窄屏：光晕别铺太开，底栏材质与顶栏一致 */
  body{background:radial-gradient(560px 420px at 85% -80px, var(--glow), transparent 70%), linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
  .tabs{box-shadow:0 -8px 24px var(--shadow)}
}
/* 极窄屏（≤360）：外观的副标签让位，保品牌+两颗钮同一行 */
@media (max-width:360px){
  .lookbtn .lb-n{display:none}
}
/* 说明页折叠段：熟手不用滚 5 屏 */
.about-fold{margin:0 0 2px; border-bottom:1px dashed var(--line)}
.about-fold summary{cursor:pointer; color:var(--accent); font-size:var(--fs-sm); letter-spacing:.04em; padding:7px 0}
.about-fold summary::marker{color:var(--muted)}
.about-fold[open] summary{margin-bottom:2px}
.about-fold p.hint{margin:4px 0 12px}
/* ── 全局可达性 & 反馈 ── */
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
/* 占位符不吃浏览器默认灰：走主题 muted（加深后过 WCAG 4.5） */
input::placeholder,textarea::placeholder{color:var(--muted); opacity:1}
/* 轻量确认态：第一次点变「确认…」，再点才执行 */
.act.armed,.mini.armed{border-color:var(--warn); color:var(--warn); background:transparent}
.act:disabled,.mini:disabled{opacity:.45; cursor:default; pointer-events:none}
/* ── 自定义色盘（第四款「自定义」：17 个颜色变量逐块可调）── 浮层容器样式见 .sheet 区的 .cpanel */
html[data-theme="custom"]{color-scheme:light}
html[data-theme="custom"].cs-dark{color-scheme:dark}
.cp-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.cp-sec{font-size:var(--fs-cap); letter-spacing:.14em; color:var(--muted); margin:12px 0 6px}

.cp-item{display:flex; align-items:center; gap:8px; min-height:36px}

<script>
/* 想要清单是运行时可调的。默认顺序照原文：语料里两两连称 46:2 一律「想要被认同和想要控制」，
   第8课三格全举也同序（想要被认同、想要控制和想要生存）；六步骤原文只有前两颗。 */

/* ══════ 2026-10-09：所有可配置项退役后的定值实现 ══════
   版本固定「1992 课程」：三颗想要照原文序，一步不退，每轮都上溯到想要。
   步骤链固定四格全参与；情绪九层与卡住支线固定默认顺序。 ══════ */
const WANTS_KEYS = ["控制", "被认同", "安全"];   /* 与 WANTS_DEF.order 同序 */
function poolKeys(){ return WANTS_KEYS.slice(); }
function dens(){ return "每轮"; }
function moreGo(s, dflt){ return dflt; }
function runStepOn(id){ return true; }
function onStepOf(id){
  const ord = STEPS_DEF.map(d=>d.id);
  const i = ord.indexOf(id);
  return (i >= 0 && i < ord.length - 1) ? ord[i+1] : "release";
}
function loadWants(){ /* 不再读旧存档的自定义 */ }
function loadRunCfg(){ /* 不再读旧存档的自定义 */ }
function saveWants(){ /* 顺序在拖动落手那一刻直接写 LS_WANT_ORDER，不走这里 */ }
function saveRunCfg(){ /* 不再写 */ }
const WANT_LABEL_OF = {被认同:"想要被认同", 控制:"想要控制", 安全:"想要安全"};
const WANT_ALIAS = {认同:"被认同", approval:"被认同", control:"控制", safe:"安全"}; /* 旧记录/导入可能存英文 key，也认得 */
const LEGACY_IDX = ["控制", "安全", "被认同"];   /* v2.6 及以前工作本想要按下标存，迁移只照这一序 */
const WANTS_DEF = {order:["控制","被认同","安全"], off:[]};
let wantsCfg = JSON.parse(JSON.stringify(WANTS_DEF));
/* 三颗想要的顺序：2026-10-09 起用「长按就地拖」改回来（设置面板那一版退役了，拖动这条留着）。
   存的是 key 数组；读出来必须三颗齐全、不重、且都是认得的 key 才采纳，
   否则回默认——存档坏了宁可回默认值，也不要给出一颗认不出的想要。 */
const LS_WANT_ORDER = "release-want-order-v1";
function wantOrderSaved(){
  try{
    const a = JSON.parse(localStorage.getItem(LS_WANT_ORDER) || "null");
    if(!Array.isArray(a)) return null;
    const ok = a.filter(k => WANTS_KEYS.indexOf(k) >= 0);
    return (ok.length === WANTS_KEYS.length && new Set(ok).size === WANTS_KEYS.length) ? ok : null;
  }catch(e){ return null; }
}
function saveWantOrder(a){
  try{ localStorage.setItem(LS_WANT_ORDER, JSON.stringify(a)); }catch(e){}
}

/* ── 长按就地拖顺序（2026-10-12 通用化：从「只有三颗想要」推广到全站的成排选项）──
   凡是带 data-sort-group 的一排都吃这一套：引导链的 .opts / .chips、八课每一屏的 .l8-opts、
   卡住支线、以及三颗想要（各屏一个组键，各排各的序）。
   九大情绪那九格与它底下的细词芯片不给组键，顺序照 1992 原表固定不动。
   有一条必须记住的坑：拖完松手浏览器还会补一次 click，没有闸门的话松一下就被当成「选中它」，
   直接跳下一屏——所以拖动过就置一个 guard，由各处的 click 分支吃掉那一次 click。 */
const LS_OPT_ORDER = "release-opt-order-v1";
const WANT_GROUP = "want";              /* 三颗想要跨界面共用一个顺序，仍存老键 release-want-order-v1 */
function optOrders(){
  try{
    const o = JSON.parse(localStorage.getItem(LS_OPT_ORDER) || "null");
    return (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
  }catch(e){ return {}; }
}
function orderOf(gk){
  if(!gk) return null;
  if(gk === WANT_GROUP) return wantOrderSaved();
  const a = optOrders()[gk];
  return (Array.isArray(a) && a.length) ? a : null;
}
function commitOrder(gk, keys){
  try{
    if(gk === WANT_GROUP){ saveWantOrder(keys); return; }
    const all = optOrders();
    all[gk] = keys;
    localStorage.setItem(LS_OPT_ORDER, JSON.stringify(all));
  }catch(e){}
}
/* 渲染前先按存档顺序排好再往 DOM 上写：这样 data-i / data-o / data-go 这些路由下标永远和数组对得上。
   DOM 里拖过去只改视觉，落盘改的是存档，下一次渲染才是他自己排的那序。
   存进档里没有的名字排到最后，且保持原相对序——新增一颗选项不会把老序打乱。 */
function applyOrder(gk, arr, keyOf){
  const ord = orderOf(gk);
  if(!Array.isArray(arr) || !ord || !ord.length) return arr;
  const at = x => { const i = ord.indexOf(String(keyOf(x))); return i < 0 ? ord.length : i; };
  return arr.map((x, i) => ({x:x, i:i, r:at(x)}))
            .sort((a, b) => (a.r - b.r) || (a.i - b.i))
            .map(z => z.x);
}
const SORT_TITLE = ' title="按住不放可调整顺序；键盘用 ↑ ↓"';

let optSortMoved = false;
function consumeSortGuard(){ const v = optSortMoved; optSortMoved = false; return v; }

function bindOptSort(root){
  if(!root || !root.querySelectorAll) return;
  Array.prototype.forEach.call(root.querySelectorAll("[data-sort-group]"), function(row){
    if(row.__sortBound) return;         /* 一次渲染里从不同层各接一遍，只绑第一遍 */
    row.__sortBound = true;
    makeSorter(row);
  });
}

function makeSorter(row){
  const gk = row.getAttribute("data-sort-group");
  const keyOf = el => el.getAttribute("data-sort-key");
  const items = () => Array.prototype.slice.call(row.querySelectorAll("[data-sort-key]"));
  let mode = false, dragEl = null, ghost = null, startX = 0, startY = 0, toI = -1, holdT = null, pid = null;

  function enter(){
    if(mode) return;
    mode = true;
    row.classList.add("sorting");
    items().forEach(b => b.setAttribute("data-sortable","1"));
    if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(e){} }
  }
  function leave(){
    clearTimeout(holdT); holdT = null;
    mode = false; dragEl = null; toI = -1;
    if(ghost){ ghost.remove(); ghost = null; }
    row.classList.remove("sorting");
    items().forEach(b => {
      b.removeAttribute("data-sortable");
      b.classList.remove("dragging");
      b.style.transform = "";
    });
  }
  function commit(){
    const keys = items().map(keyOf);
    commitOrder(gk, keys);
    const named = (gk === WANT_GROUP) ? keys.map(k => WANT_LABEL(k)) : keys;
    toast("顺序记住了 · " + named.join(" / "));
  }
  /* 把 el 挪到第 j 位；返回有没有真挪（没挪就不算改动，也就不必存） */
  function dropAt(el, j){
    const list = items();
    const i = list.indexOf(el);
    if(i < 0 || j < 0 || j >= list.length || i === j) return false;
    if(j > i) list[j].after(el); else list[j].before(el);
    return true;
  }
  /* 落点判「离谁的中心最近」，不判「在第几行第几列」：
     引导链那九档是竖排一条线，芯片档一行排开，卡住支线还会换行——
     一个最近中心三种排版都吃得下，比按轴算少一套分支。 */
  function targetIndex(cx, cy){
    const list = items();
    let best = -1, bd = Infinity;
    for(let i=0;i<list.length;i++){
      /* 手上这一颗要跳过：它带着 translate 跟着指针走，自己的中心永远就是指针落点，
         算进去必得 0 距离，于是永远判成「还在原位」——拖了不动（10-12 实测就是这个坑）。 */
      if(list[i] === dragEl) continue;
      const r = list[i].getBoundingClientRect();
      const dx = (r.left + r.width/2) - cx, dy = (r.top + r.height/2) - cy;
      const d = dx*dx + dy*dy;
      if(d < bd){ bd = d; best = i; }
    }
    return best;
  }

  row.addEventListener("pointerdown", function(e){
    const b = e.target.closest("[data-sort-key]");
    if(!b) return;
    optSortMoved = false;
    dragEl = b; pid = e.pointerId; startX = e.clientX; startY = e.clientY;
    toI = items().indexOf(b);
    clearTimeout(holdT);
    holdT = setTimeout(enter, 480);
  });

  row.addEventListener("pointermove", function(e){
    if(!dragEl || e.pointerId !== pid) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(!mode){
      /* 手指先动了就不是长按，是页面滚动：取消，别顺手把练习挡了 */
      if(dx*dx + dy*dy > 64){ clearTimeout(holdT); holdT = null; dragEl = null; }
      return;
    }
    e.preventDefault();
    if(!ghost){
      /* 第一次真拖动：在原位留一个虚线占位。占位必须绝对定位——它要是占了布局，
         整排会被整体挤下去一格，落点判定跟着偏一格（挪一格变成挪两格）。 */
      const rc = dragEl.getBoundingClientRect(), rb = row.getBoundingClientRect();
      ghost = document.createElement("div");
      ghost.className = "sort-ghost";
      ghost.style.left = (rc.left - rb.left) + "px";
      ghost.style.top = (rc.top - rb.top) + "px";
      ghost.style.width = rc.width + "px";
      ghost.style.height = rc.height + "px";
      row.appendChild(ghost);
    }
    dragEl.classList.add("dragging");
    dragEl.style.transform = "translate(" + dx + "px," + dy + "px)";
    const r = dragEl.getBoundingClientRect();
    toI = targetIndex(r.left + r.width / 2, r.top + r.height / 2);
  });

  function dropGhost(){ if(ghost){ ghost.remove(); ghost = null; } }

  function endDrag(){
    clearTimeout(holdT); holdT = null;
    const el = dragEl, wasSorting = mode;
    dragEl = null;
    if(!el) return;
    if(!wasSorting) return;            /* 没进排序模式：让 click 照常发生＝选中它、往下走 */
    optSortMoved = true;               /* 吃掉浏览器补的那次 click */
    el.classList.remove("dragging");
    el.style.transform = "";
    /* ghost 还在算索引，得等 dropAt 用完再撤 */
    const moved = dropAt(el, toI);
    dropGhost();
    if(moved) commit();
    /* 拖完就走。原先要等点「完成」才退出，可那条横条已被用户删掉——
       留着一个进得去出不来的排序模式更糟。落盘即退出，一颗一颗拖，各自独立。 */
    leave();
  }
  row.addEventListener("pointerup", endDrag);
  row.addEventListener("pointercancel", function(){
    clearTimeout(holdT); holdT = null;
    if(dragEl){ dragEl.classList.remove("dragging"); dragEl.style.transform = ""; }
    dragEl = null;
    dropGhost();
  });

  /* 键盘同一条路：第一次方向键进排序模式，之后 ↑ ↓（横排那几档 ← → 也算）挪位。
     读屏和键盘用户不被落下。横条删了之后键盘模式也得自己能出来——Esc 走。 */
  row.addEventListener("keydown", function(e){
    const b = e.target.closest("[data-sort-key]");
    if(!b) return;
    if(e.key === "Escape"){ if(mode){ leave(); b.focus(); } return; }
    const dir = (e.key === "ArrowDown" || e.key === "ArrowRight") ? 1
              : (e.key === "ArrowUp" || e.key === "ArrowLeft") ? -1 : 0;
    if(!dir) return;
    e.preventDefault();
    if(!mode){ enter(); b.focus(); return; }
    const i = items().indexOf(b);
    if(dropAt(b, i + dir)){ commit(); b.focus(); }
  });
}
function normWantKey(k){ if(!k) return ""; const a = WANT_ALIAS[k]; return a || k; }

function wantKeys(){
  /* 1992 课程三颗想要全参与，一颗不少。默认序按 WANTS_DEF（想要控制打头）；
     用户长按拖过就照他排的来（存 LS_WANT_ORDER）。 */
  return wantOrderSaved() || WANTS_DEF.order.filter(k=>WANTS_KEYS.indexOf(k)>=0);
}
function wantList(){ return wantKeys().map(k=>({key:k, label:WANT_LABEL_OF[k]})); }
function wantLabels(){ return wantKeys().map(k=>WANT_LABEL_OF[k]); }
function WANT_LABEL(k){ return WANT_LABEL_OF[normWantKey(k)] || "想要"; }

/* 剩余复查之后往哪儿跳。节点一个不删，只是这一档不走那几格：
   只走感受＝第1-4课走法（在感受上让它离开，不认想要）；认了就放＝六步骤第3步
   「立即看到并且立即释放」——起手已认想要的（老手）直接放，还没认的先把想要认出来，
   都不走第7课那层二次确认。
   2026-10-08：upq 闸门拆了，「没了」直接进第二问；自定义档一并退役，三档够用。 */


function wantQText(){
  const L = wantLabels();
  /* EN 态拼英文标签（"Is it the wanting approval or the wanting to control?" 是 1992
     课程原句族，见 UI_EN 注释）；中文标签串本身走 tx()。整句随语言重拼，不走查表。 */
  if(lang() === "en"){
    const E = L.map(x=>tx(x));
    if(E.length <= 1) return "Which want is there right now?";
    return "Which want is there right now? Is it " + E.slice(0,-1).join(", ") + ", or " + E[E.length-1] + "?";
  }
  if(L.length <= 1) return "现在是哪个想要在那里？";
  return "现在是哪个想要在那里？是" + L.slice(0,-1).join("、") + "，还是" + L[L.length-1] + "？";
}
/* ── 步骤链（2026-10-09：自定义退役）：四格全参与，先后固定。
   order 是全量顺序（排前就先走到），off 是退场的格；三颗预设只是一键铺底，铺完照改。
   退场格的入口一律顺到下一颗参与的格；全退了就直接进「放」——链上没有死胡同。 ── */
const STEPS_DEF = [
  {id:"goal",      name:"目标句"},
  {id:"allow",     name:"允许去感受"},
  {id:"grabwant",  name:"再套一次"}
];
let runCfg = {steps:null, emo:null, stuck:null};




const STEP_SKIP = {goal:"emotion", allow:"drop", grabwant:"afterround"};
function effThen(id, lv){
  /* lv 显式传入（2026-10-12 修）：原先读全局 state.level，面板 routeLen("新手") 传的是
     mock st，算出来永远是老手路径——新手卡「多一步允许」的步数牌少算一步。 */
  if(id !== "emotion") return "release";
  if(lv !== "新手") return "drop";
  return "allow";
}
function EMO_ORDER(){
  /* 退役了自定义排序：恒按「万念俱灰」打头的默认顺序 */
  return ["万念俱灰","悲苦","恐惧","贪求","愤怒","自尊自傲","无畏","接纳","平和"];
}
function STUCK_ORDER(){
  /* 退役了自定义排序：恒按默认支线顺序 */
  return ["crash","mute","stuck","grab"];
}

/* 面板上那几个步数是当场按真身 FLOW 的跳转算出来的（规则和走查量具 want_probe 同一条：
   每个阶段只点第一颗非「再来一轮」的钮，一路走到收工），不是手抄的死数字。 */
function routeLen(lv){
  const IX = {}; FLOW.forEach((s,i)=>{ IX[s.id] = i; });
  const keys = wantKeys();
  const st = {level:lv, emoLevel:"", goal:"x", emotion:"", want:keys[0], rounds:0, also:[], path:[]};
  const th = s=>(s.thenFn ? s.thenFn(st) : s.then);
  function nxt(s){
    if(s.id === "level") return {go:"goal"};
    if(s.type === "emotion") return {go: th(s)};
    if(s.type === "wants"){ st.want = keys[0]; return {go: th(s)}; }
    if(s.step && !runStepOn(s.step)) return {go: STEP_SKIP[s.step] || s.then};
    const o = s.optsFn ? s.optsFn(st) : s.opts;
    if(o && o.length){
      for(let i=0;i<o.length;i++){ if(o[i] && !o[i].round) return o[i]; }
      return o[0];
    }
    return {go: th(s)};
  }
  let cur = "level", guard = 0, n = 0;
  while(cur && cur !== "done" && guard++ < 44){
    n++;
    const s = FLOW[IX[cur]];
    if(!s) break;
    const p = nxt(s);
    cur = p ? p.go : null;
  }
  return n;
}




/* 旧档里的工作本想要是数组下标；认不出下标就当没选 */
function wantOf(it){
  if(!it || it.want === null || it.want === undefined) return "";
  if(typeof it.want === "number") return LEGACY_IDX[it.want] || "";
  return normWantKey(it.want);
}

/* 情绪表：九层名称与子词出自 1992 年 Sedona Institute 官方教材配套的
   「情绪表格」（波澜不惊 → 想要安全稳妥/想生存 → 想要被认同/想要控制 → 九列），
   每列开头的两个关键词是原表标注。这是莱斯特体系的原始教学材料。

function rowIdOf(r){
  return 'L' + String(r.date||"").replace(/[^0-9A-Za-z]/g,"") + '_'
    + String(r.time||"").replace(/[^0-9]/g,"") + '_' + Math.random().toString(36).slice(2,6);
}
/* 老条目没有精确到秒的存档时间：用 日期+时刻 凑一个 ISO 串，合并时只当「谁较新」的尺子用 */
function rowIsoOf(r){
  if(/^\d\d-\d\d-\d\d$/.test(String(r.date||"")) && /^\d\d:\d\d$/.test(String(r.time||"")))
    return "20"+r.date+"T"+r.time+":00";
  return new Date().toISOString();
}
function normalizeRow(r){
  if(!r || typeof r!=="object") return null;
  if(!("goal" in r)){ r.goal = r.anchor || "未填"; delete r.anchor; }
  if(typeof r.emo!=="string") r.emo = "";
  if(typeof r.start!=="string") r.start = "";
  if(!r.id) r.id = rowIdOf(r);
  if(!r.updatedAt) r.updatedAt = rowIsoOf(r);
  if(typeof r.secs!=="number" || !isFinite(r.secs) || r.secs<=0) r.secs = null;
  if(typeof r.rounds!=="number") r.rounds = 0;
  /* reading（读数）这个字段 2026-10-09 从功能里删了。老记录里如果还带着，保留原值不动——
     删用户存过的东西是另一回事，这里只是不再读它、也不再往新记录里写。 */
  if(typeof r.feeling!=="string") r.feeling = "";
  if(typeof r.gain!=="string") r.gain = "";
  if(typeof r.also!=="string") r.also = "";
  if(typeof r.step!=="string") r.step = "";
  if(typeof r.done!=="boolean") r.done = false;
  if(!r.date || !r.time) return null;
  return r;
}
