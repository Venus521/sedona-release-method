/* ── 左右滑动 ──
   正在走链的那一屏（引导页、工作本条目）＝后退／前进；
   八节课那一屏＝左右滑换课（跟手，松手过线就翻，到头有回弹）；
   工作本队列和收获本＝在页签之间走。手指划和鼠标拖动同一条路（桌面上也能滑）。
   2026-10-12 轮20：八课原来没有自己的滑动手势——在这一屏一滑就落到「切页签」上，
   划一下飞去工作本，不是人要的。现在八课＝翻页器：第1课↔第8课 左右划，
   与顶部‹上一课/下一课›两颗钮同一行为（都走 l8Goto）。 */
(function(){
  const ORDER = ["guide","lesson","sheets","harvest"];
  const MIN = 44;                      /* 横向位移不足这一个数，只当点击，不算滑 */
  let sx = 0, sy = 0, live = false, pid = null;
  /* 八课翻页的跟手状态 */
  let l8on = false, l8lock = false, l8AnimAt = 0;
  let justSwiped = 0;                  /* 滑完那一瞬：吞掉浏览器补发的 click，别让它顺手点一颗钮 */
  const root = document.querySelector(".wrap") || document.body;
  const cur = ()=>{ const p = ORDER.filter(x=>!document.getElementById("pane-"+x).classList.contains("hidden"))[0]; return p || "guide"; };
  const reduce = ()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
  const l8Wrap = ()=>document.querySelector("#pane-lesson .l8-wrap");
  /* 这些手上各有各的 drag，滑手势不接：输入框／长按拖序的选项（data-sort-key）／
     老手起手那排想要芯片（.chip[data-w]）／练习目录行与 opener 细条
     （.l8-prow/.l8-pdir-b，2026-10-14 轮40 由 .l8-pc 一排横滚 chip 改来——点跳转的
     行头上不接翻页手势，轻划不当翻页、重点才当点击） */
  function l8From(t){
    if(!t) return false;
    if(t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.isContentEditable) return false;
    return !(t.closest("[data-sort-key]") || t.closest(".chip[data-w]") || t.closest(".l8-prow") || t.closest(".l8-pdir-b"));
  }
  /* 翻课动画：新一课的整块从那一侧推进来。起始帧不透明——reduced-motion 下
     *{animation:none!important} 会把动画连 fill 一起毙掉，元素停在默认态（不透明），
     不会出现浮层穿透那种「后面的字透出来」（2026-10-06 踩过的坑，这里不再犯）。 */
  function l8SlideIn(dir){
    if(reduce()) return;
    const w = l8Wrap(); if(!w) return;
    const kf = dir > 0 ? "l8InNext" : "l8InPrev";
    w.style.animation = "none"; void w.offsetWidth;   /* 连续快滑时重放，不吞帧 */
    w.style.animation = kf + " .26s cubic-bezier(.2,.8,.25,1) both";
  }
  function l8Spring(){
    const w = l8Wrap(); if(!w) return;
    w.style.transition = "transform .24s cubic-bezier(.2,.8,.25,1)";
    w.style.transform = "";
    setTimeout(function(){ w.style.transition = ""; }, 280);
  }
  root.addEventListener("pointerdown", e=>{
    justSwiped = 0;
    const t = e.target;
    const onL8 = cur()==="lesson";
    live = onL8 ? l8From(t) : !(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.isContentEditable));
    sx = e.clientX; sy = e.clientY; pid = e.pointerId;
    l8on = onL8 && live; l8lock = false;
  }, {passive:true});
  root.addEventListener("pointermove", e=>{
    if(!l8on || e.pointerId !== pid) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(!l8lock){
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if(Math.abs(dy) > Math.abs(dx)){ l8on = false; return; }   /* 竖着动＝翻页看内容，不滑 */
      l8lock = true;
      const w0 = l8Wrap(); if(w0) w0.style.userSelect = "none";  /* 滑起来就别划出选中区 */
    }
    const w = l8Wrap(); if(!w) return;
    let d = dx;
    if((l8cur<=1 && d>0) || (l8cur>=8 && d<0)) d *= 0.32;        /* 到头回弹：给一点阻力 */
    w.style.transition = "none";
    w.style.transform = "translateX(" + d + "px)";
  }, {passive:true});
  root.addEventListener("pointerup", e=>{
    if(l8on){
      const wasLock = l8lock;
      l8on = false;
      const w = l8Wrap();
      if(w) w.style.userSelect = "";
      if(!wasLock){ if(w){ w.style.transition=""; w.style.transform=""; } return; }  /* 没滑成＝点击 */
      const dx = e.clientX - sx;
      const th = Math.max(56, (window.innerWidth || 360) * 0.16);
      const dir = dx < 0 ? 1 : -1;                 /* 往左推＝下一课，往右推＝上一课 */
      const dest = l8cur + dir;
      if(Math.abs(dx) >= th && dest >= 1 && dest <= 8 && Date.now() - l8AnimAt > 260){
        l8AnimAt = Date.now();
        justSwiped = 1;                            /* 先立牌：这一下之后的 click 是补发的，吞掉 */
        if(w && !reduce()){
          w.style.transition = "transform .18s ease, opacity .18s ease";
          w.style.transform = "translateX(" + (-dir*28) + "px)";
          w.style.opacity = "0";
          setTimeout(function(){ l8Goto(dest); l8SlideIn(dir); }, 150);
        }else{
          l8Goto(dest);
        }
        return;
      }
      l8Spring();
      return;
    }
    if(!live){ return; }
    live = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) < MIN || Math.abs(dx) < Math.abs(dy)*1.6) return;
    if(window.getSelection && String(window.getSelection())) return;
    const dir = dx < 0 ? 1 : -1;       /* 往左推＝往后走，往右推＝回上一步 */
    const onChain = !!wsSlotId() || cur()==="guide";
    if(onChain && dir < 0 && state.path.length){ back(); return; }
    if(onChain && dir > 0){
      const st = stageEl();
      const main = st && (st.querySelector(".opt.prime") || st.querySelector(".opt"));
      if(main){ main.click(); return; }
      const on = st && st.querySelector('.chip[aria-pressed="true"]');
      if(on){ on.click(); return; }
    }
    const i = ORDER.indexOf(cur()), n = Math.max(0, Math.min(ORDER.length-1, i+dir));
    if(n !== i) setPane(ORDER[n]);
  }, {passive:true});
  root.addEventListener("pointercancel", ()=>{
    live = false; l8on = false;
    const w = l8Wrap();
    if(w){ w.style.transition = "transform .24s ease"; w.style.transform = ""; w.style.userSelect = ""; }
  }, {passive:true});
  /* 滑完补发的 click（手指划完抬起来，浏览器会认成一次点击）——捕获阶段拦掉。
     只拦 justSwiped 之后的第一下；下一次 pointerdown 会清零，正常点击不受影响。 */
  document.addEventListener("click", function(e){
    if(!justSwiped) return;
    justSwiped = 0;
    e.preventDefault(); e.stopPropagation();
  }, true);
})();

/* 走链的键盘：数字＝按序号点那一格，空格＝第一颗主钮，Esc（工作本那一屏）＝回队列。
   引导页和工作本走的是同一条链，手感一致，只是宿主不同。 */
document.addEventListener("keydown", e=>{
  const inWs = !!wsSlotId();
  if(e.key==="Escape" && inWs){ e.preventDefault(); wsClose(); renderSheetsPane(); return; }
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(!inWs && document.getElementById("pane-guide").classList.contains("hidden")) return;
  // 焦点在按钮／链接／页签上时，空格还给原生激活；「空格＝主选项」只接管正文焦点。
  //（10-03 修复：焦点在「回上一步」按空格曾被转成点主按钮——想后退的人被前进）
  if(e.key===" " && e.target && e.target.closest && e.target.closest("button,a,[role=tab]")) return;
  const stage = stageEl();
  if(!stage) return;
  const grid = stage.querySelectorAll(".opts.grid .opt");
  const chips = stage.querySelectorAll(".chip");
  // 序号的落点：九格／三选一优先走格子，其次词块，最后才是普通按钮
  const seq = grid.length > 2 ? grid : (chips.length ? chips : stage.querySelectorAll(".opt"));
  if(e.key===" "){
    e.preventDefault();
    const main = stage.querySelector(".opt.prime") || stage.querySelector(".opt");
    if(main) main.click();
    return;
  }
  if(/^[1-9]$/.test(e.key)){
    const i = +e.key-1;
    if(seq[i]) seq[i].click();
  }
});

/* 主题三问：手动选过（存了 LS_LOOK）固定用；没选过跟随系统深浅；系统切换时实时跟，
   但一旦手动固定就尊重手动。applyTheme/systemTheme/themeIsManual 供 renderLooks 复用。 */
function applyTheme(id){
  if(id==="custom"){
    const v = customVars();
    if(v){ applyCustom(v); return; }
    id = "paper";   // 无自定义存档（异常态）：回预设
  }
  if(!LOOKS.some(x=>x.id===id)) id = "paper";
  clearCustomVars();   // 必须清内联变量，否则自定义值会盖住预设
  document.documentElement.dataset.theme = id;
  paintThemeColor();
}
function systemTheme(){
  try{ return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "ink" : "paper"; }
  catch(e){ return "paper"; }
}
function themeIsManual(){
  try{ return !!localStorage.getItem(LS_LOOK); }catch(e){ return false; }
}
if(storageOk){ try{ const l = localStorage.getItem(LS_LOOK);
  if(l==="custom" && customVars()) applyCustom(customVars());
  else if(l && LOOKS.some(x=>x.id===l)) applyTheme(l);
}catch(e){} }
if(!themeIsManual()) applyTheme(systemTheme());
(function(){
  if(!window.matchMedia) return;
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const onScheme = ()=>{ if(themeIsManual()) return; applyTheme(systemTheme()); renderLooks(); };
  if(mq.addEventListener) mq.addEventListener("change", onScheme);
  else if(mq.addListener) mq.addListener(onScheme);
})();
